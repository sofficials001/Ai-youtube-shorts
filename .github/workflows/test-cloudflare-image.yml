name: Test Cloudflare Image

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate toddler image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "adorable cute 3-year-old Indian toddler boy, chubby round cheeks, big brown eyes, short black hair, happy innocent smile, yellow T-shirt, blue shorts, realistic Indian neighborhood, photorealistic cinematic photograph"
            }')

          echo "HTTP_STATUS=$status"
          echo "CLOUDFLARE_RESPONSE:"
          cat response.json

          test "$status" = "200"

          python -c "import json,base64; d=json.load(open('response.json')); open('toddler_test.png','wb').write(base64.b64decode(d['result']['image']))"

          echo "IMAGE CREATED"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: toddler-test
          path: toddler_test.png
