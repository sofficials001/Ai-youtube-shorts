
name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --break-system-packages \
            requests Pillow edge-tts

      - name: Check Cloudflare configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          }
          ffmpeg -version | head -n 1
          python3 --version

      - name: Generate three toddler scenes
        run: |
          set -euo pipefail
          mkdir -p work

          cat > work/generate_scenes.py <<'PY'
          import os
          import sys
          import base64
          import requests
          from PIL import Image
          from io import BytesIO

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/black-forest-labs/flux-1-schnell"
          )

          scenes = [
              (
                  "scene1.jpg",
                  "A cute little white baby rabbit standing alone "
                  "in a beautiful colorful forest, adorable "
                  "storybook 3D animated children's movie, "
                  "soft sunlight, vertical composition, "
                  "full body, no text, no watermark"
              ),
              (
                  "scene2.jpg",
                  "The same cute little white baby rabbit meeting "
                  "its loving mother rabbit in a colorful forest, "
                  "happy emotional reunion, adorable 3D animated "
                  "children's storybook movie, vertical composition, "
                  "no text, no watermark"
              ),
              (
                  "scene3.jpg",
                  "The same cute little white baby rabbit walking "
                  "happily beside its mother rabbit toward their "
                  "cozy forest home, beautiful warm sunset, "
                  "adorable 3D animated children's movie, "
                  "vertical composition, no text, no watermark"
              ),
          ]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          for filename, prompt in scenes:
              print(f"Generating {filename}...")

              response = requests.post(
                  url,
                  headers=headers,
                  json={"prompt": prompt, "steps": 4},
                  timeout=180,
              )
              response.raise_for_status()
              data = response.json()

              if not data.get("success"):
                  raise RuntimeError(
                      f"Cloudflare error: {data.get('errors')}"
                  )

              result = data.get("result") or {}
              encoded = result.get("image")

              if not encoded:
                  raise RuntimeError(
                      f"No image returned for {filename}"
                  )

              raw = base64.b64decode(encoded, validate=True)

              with Image.open(BytesIO(raw)) as image:
                  image.load()
                  image.convert("RGB").save(
                      f"work/{filename}",
                      "JPEG",
                      quality=95,
                  )

              with Image.open(f"work/{filename}") as check:
                  check.verify()

              print(f"{filename} generated successfully")

          print("All three scenes generated.")
          PY

          python3 work/generate_scenes.py

      - name: Create Hindi voice
        run: |
          set -euo pipefail

          cat > work/voice.py <<'PY'
          import asyncio
          import edge_tts

          TEXT = (
              "एक नन्हा खरगोश जंगल में खो गया। "
              "उसकी माँ ने प्यार से उसे ढूँढ लिया। "
              "दोनों खुशी-खुशी घर लौट आए।"
          )

          async def main():
              voice = edge_tts.Communicate(
                  TEXT,
                  "hi-IN-SwaraNeural",
                  rate="+15%",
                  volume="+0%",
              )
              await voice.save("work/voice.mp3")

          asyncio.run(main())
          PY

          python3 work/voice.py

          test -s work/voice.mp3 || {
            echo "::error::Hindi voice file is empty"
            exit 1
          }

          # Decode the voice and verify that it contains
          # actual non-silent audio samples.
          ffmpeg -hide_banner -loglevel error -y \
            -i work/voice.mp3 \
            -ac 1 -ar 16000 -f s16le \
            work/voice.pcm

          python3 - <<'PY'
          import array
          import os
          import sys
          import math

          path = "work/voice.pcm"
          if not os.path.isfile(path) or os.path.getsize(path) < 1000:
              sys.exit("ERROR: Voice audio is missing or too short")

          samples = array.array("h")
          with open(path, "rb") as f:
              samples.frombytes(f.read())

          if sys.byteorder != "little":
              samples.byteswap()

          if not samples:
              sys.exit("ERROR: No decoded audio samples")

          rms = math.sqrt(
              sum(float(x) * x for x in samples) / len(samples)
          )

          print(f"Voice RMS: {rms:.2f}")

          if rms < 10:
              sys.exit("ERROR: Voice is silent")

          print("Hindi voice audio verified.")
          PY

      - name: Create scene videos
        run: |
          set -euo pipefail

          for i in 1 2 3; do
            test -s "work/scene${i}.jpg"

            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 \
              -framerate 30 \
              -i "work/scene${i}.jpg" \
              -t 3 \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              "work/clip${i}.mp4"

            test -s "work/clip${i}.mp4"
          done

      - name: Join all three scenes
        run: |
          set -euo pipefail

          cat > work/concat.txt <<'EOF'
          file 'clip1.mp4'
          file 'clip2.mp4'
          file 'clip3.mp4'
          EOF

          ffmpeg -hide_banner -loglevel error -y \
            -f concat \
            -safe 0 \
            -i work/concat.txt \
            -c copy \
            work/video_only.mp4

          test -s work/video_only.mp4

      - name: Add Hindi voice and create final video
        run: |
          set -euo pipefail

          # Normalize narration, then pad it if it ends
          # before the 9-second video finishes.
          ffmpeg -hide_banner -loglevel error -y \
            -i work/voice.mp3 \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11,apad=pad_dur=9" \
            -t 9 \
            -ar 48000 \
            -ac 2 \
            -c:a aac \
            -b:a 192k \
            work/voice_normalized.m4a

          ffmpeg -hide_banner -loglevel error -y \
            -i work/video_only.mp4 \
            -i work/voice_normalized.m4a \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -t 9 \
            -movflags +faststart \
            final_video.mp4

          test -s final_video.mp4

      - name: Verify final video and audio
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          import os
          import sys
          import array
          import math

          video = "final_video.mp4"

          def fail(message):
              print(f"ERROR: {message}")
              sys.exit(1)

          if not os.path.isfile(video) or os.path.getsize(video) < 10000:
              fail("Final video is missing or too small")

          result = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_streams", "-show_format",
                  "-of", "json", video
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          info = json.loads(result.stdout)
          streams = info.get("streams", [])

          videos = [s for s in streams if s["codec_type"] == "video"]
          audios = [s for s in streams if s["codec_type"] == "audio"]

          if len(videos) != 1:
              fail("Expected exactly one video stream")
          if len(audios) != 1:
              fail("Expected exactly one audio stream")

          v = videos[0]
          a = audios[0]

          if v.get("width") != 1080 or v.get("height") != 1920:
              fail("Incorrect video resolution")

          if v.get("codec_name") != "h264":
              fail("Video is not H.264")

          if a.get("codec_name") != "aac":
              fail("Audio is not AAC")

          duration = float(info["format"]["duration"])
          audio_duration = float(a["duration"])

          if not 8.8 <= duration <= 9.3:
              fail(f"Incorrect video duration: {duration}")

          if audio_duration < 8.8:
              fail(f"Audio is too short: {audio_duration}")

          # Decode the final audio stream to verify that
          # the encoded output is playable and not silent.
          pcm = subprocess.run(
              [
                  "ffmpeg", "-hide_banner", "-loglevel", "error",
                  "-i", video, "-map", "0:a:0",
                  "-f", "s16le", "-ac", "1", "-ar", "16000", "-"
              ],
              capture_output=True,
              check=True,
          ).stdout

          samples = array.array("h")
          samples.frombytes(pcm)

          if sys.byteorder != "little":
              samples.byteswap()

          if not samples:
              fail("Final audio cannot be decoded")

          rms = math.sqrt(
              sum(float(x) * x for x in samples) / len(samples)
          )

          if rms < 10:
              fail(f"Final audio is silent: RMS={rms:.2f}")

          print("FINAL VIDEO AND AUDIO VALIDATION PASSED")
          print(f"Resolution: {v['width']}x{v['height']}")
          print(f"Video codec: {v['codec_name']}")
          print(f"Audio codec: {a['codec_name']}")
          print(f"Duration: {duration:.2f} seconds")
          print(f"Audio RMS: {rms:.2f}")
          PY

      - name: Create YouTube metadata
        run: |
          set -euo pipefail
          mkdir -p artifacts

          python3 - <<'PY'
          import json

          metadata = {
              "title": "नन्हे खरगोश की प्यारी कहानी 🐰",
              "description": (
                  "एक नन्हे खरगोश और उसकी माँ की प्यारी कहानी। "
                  "बच्चों के लिए एक छोटी हिंदी कहानी।\n\n"
                  "#HindiStory #KidsStory #Shorts"
              ),
              "tags": [
                  "Hindi story",
                  "kids story",
                  "rabbit story",
                  "Hindi cartoon",
                  "YouTube Shorts",
              ],
              "category": "1",
              "language": "hi",
          }

          with open(
              "artifacts/youtube_metadata.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(metadata, f, ensure_ascii=False, indent=2)

          print("YouTube metadata created.")
          PY

      - name: Prepare final package
        run: |
          set -euo pipefail

          cp final_video.mp4 artifacts/
          cp work/scene1.jpg artifacts/
          cp work/scene2.jpg artifacts/
          cp work/scene3.jpg artifacts/
          cp work/voice.mp3 artifacts/

          test -s artifacts/final_video.mp4
          test -s artifacts/voice.mp3
          test -s artifacts/youtube_metadata.json

          ls -lh artifacts/

      - name: Upload final video and files
        uses: actions/upload-artifact@v4
        with:
          name: toddler-video
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          
