
name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Install required tools
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-venv

          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install edge-tts

          mkdir -p artifacts

      # 2. Check Cloudflare configuration
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN secret"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          fi

          echo "Cloudflare configuration found"

      # 3. Generate all three scenes
      - name: Generate toddler scenes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_scenes.py <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/black-forest-labs/flux-1-schnell"
          )

          scenes = [
              {
                  "name": "scene1.png",
                  "prompt": (
                      "Wholesome cinematic photograph of a fictional "
                      "Indian toddler boy, about three years old, "
                      "round cheeks, short black hair, expressive "
                      "brown eyes, happy innocent smile, bright "
                      "yellow T-shirt and blue shorts, standing "
                      "on a sunny Indian neighborhood street, "
                      "natural daylight, realistic photography, "
                      "vertical composition"
                  ),
                  "fallback": (
                      "A cheerful fictional young Indian child "
                      "wearing a yellow shirt and blue shorts, "
                      "smiling outdoors in a sunny neighborhood, "
                      "wholesome family-friendly realistic photograph"
                  )
              },
              {
                  "name": "scene2.png",
                  "prompt": (
                      "Cinematic close-up photograph of the same "
                      "fictional Indian toddler boy, three years old, "
                      "round cheeks, short black hair, large brown "
                      "eyes, funny confused facial expression, "
                      "yellow T-shirt and blue shorts, standing "
                      "at a realistic Indian home entrance, "
                      "warm daylight, wholesome family photography"
                  ),
                  "fallback": (
                      "A fictional young Indian child wearing "
                      "a yellow shirt, looking confused at a "
                      "home entrance, wholesome family-friendly "
                      "realistic photograph"
                  )
              },
              {
                  "name": "scene3.png",
                  "prompt": (
                      "Wholesome cinematic photograph of the same "
                      "fictional Indian toddler boy, three years old, "
                      "round cheeks, short black hair, large brown "
                      "eyes, laughing happily, wearing a bright "
                      "yellow T-shirt and blue shorts, playful "
                      "moment outdoors in an Indian neighborhood, "
                      "warm natural daylight, realistic photography"
                  ),
                  "fallback": (
                      "A cheerful fictional young Indian child "
                      "smiling outdoors in a sunny neighborhood, "
                      "colorful casual clothing, wholesome "
                      "family-friendly realistic photograph"
                  )
              }
          ]

          def generate(prompt, filename):
              payload = json.dumps({
                  "prompt": prompt,
                  "steps": 4
              }).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=180
                  ) as response:
                      data = json.loads(response.read())

                  if not data.get("success"):
                      raise RuntimeError(
                          json.dumps(data.get("errors", data))
                      )

                  image = data["result"]["image"]
                  image_bytes = base64.b64decode(
                      image, validate=True
                  )

                  if not image_bytes:
                      raise RuntimeError("Empty image response")

                  with open(filename, "wb") as file:
                      file.write(image_bytes)

                  print(filename + " created successfully")
                  return True

              except Exception as error:
                  print("Generation failed:", str(error))
                  return False

          for scene in scenes:
              print("Generating", scene["name"])

              if not generate(
                  scene["prompt"], scene["name"]
              ):
                  print("Trying safe fallback")

                  if not generate(
                      scene["fallback"], scene["name"]
                  ):
                      raise SystemExit(
                          "Could not generate " + scene["name"]
                      )

          print("All scenes generated successfully")
          PY

          python3 generate_scenes.py

      # 4. Create Hindi voice
      - name: Create Hindi voice
        run: |
          cat > script.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा।
          क्या राज़?
          होमवर्क छुपा दो तो टीचर खुद ढूंढने आ जाती हैं!
          EOF

          .venv/bin/edge-tts \
            --voice hi-IN-MadhurNeural \
            --rate="+10%" \
            --pitch="+10Hz" \
            --text-file script.txt \
            --write-media voice.mp3

          ffmpeg -y \
            -i voice.mp3 \
            -ar 44100 \
            -ac 2 \
            voice.wav

          test -s voice.wav
          echo "Hindi voice created successfully"

      # 5. Create scene 1 video
      - name: Create Scene 1 video
        run: |
          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene1.png \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -frames:v 90 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -r 30 \
            scene1.mp4

      # 6. Create scene 2 video
      - name: Create Scene 2 video
        run: |
          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene2.png \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.001,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -frames:v 90 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -r 30 \
            scene2.mp4

      # 7. Create scene 3 video
      - name: Create Scene 3 video
        run: |
          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene3.png \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -frames:v 90 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -r 30 \
            scene3.mp4

      # 8. Join all scenes
      - name: Join scenes
        run: |
          printf "file '%s/scene1.mp4'\n" "$PWD" > concat.txt
          printf "file '%s/scene2.mp4'\n" "$PWD" >> concat.txt
          printf "file '%s/scene3.mp4'\n" "$PWD" >> concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            silent_video.mp4

          test -s silent_video.mp4

      # 9. Add Hindi voice
      - name: Add Hindi voice
        run: |
          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -t 9 \
            -movflags +faststart \
            final_toddler_short.mp4

          test -s final_toddler_short.mp4

      # 10. Verify final video
      - name: Verify final video
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import os

          filename = "final_toddler_short.mp4"

          if not os.path.isfile(filename):
              raise SystemExit("Final video is missing")

          if os.path.getsize(filename) == 0:
              raise SystemExit("Final video is empty")

          result = subprocess.run([
              "ffprobe",
              "-v", "error",
              "-show_entries",
              "format=duration:stream=codec_type,codec_name,width,height",
              "-of", "json",
              filename
          ], capture_output=True, text=True, check=True)

          info = json.loads(result.stdout)
          streams = info.get("streams", [])
          video = next(
              (s for s in streams if s["codec_type"] == "video"),
              None
          )
          audio = next(
              (s for s in streams if s["codec_type"] == "audio"),
              None
          )

          if video is None:
              raise SystemExit("Video stream is missing")

          if audio is None:
              raise SystemExit("Audio stream is missing")

          if video.get("width") != 1080:
              raise SystemExit("Incorrect video width")

          if video.get("height") != 1920:
              raise SystemExit("Incorrect video height")

          duration = float(info["format"]["duration"])

          if not 8.8 <= duration <= 9.2:
              raise SystemExit(
                  "Unexpected video duration: " + str(duration)
              )

          print("VIDEO VERIFIED")
          print("Codec:", video.get("codec_name"))
          print("Resolution: 1080x1920")
          print("Duration:", duration)
          print("Audio:", audio.get("codec_name"))
          PY

      # 11. Create YouTube metadata
      - name: Create YouTube metadata
        run: |
          python3 - <<'PY'
          import json

          metadata = {
              "title": "जब बच्चे ने होमवर्क का राज़ बताया 😂",
              "description": "एक छोटे बच्चे का मासूम लेकिन मज़ेदार जवाब 😂",
              "language": "Hindi",
              "format": "YouTube Shorts",
              "aspect_ratio": "9:16",
              "duration": "9 seconds",
              "captions": False,
              "visual_style": "photorealistic cinematic",
              "generation_model": "Cloudflare FLUX.1 Schnell"
          }

          with open(
              "youtube_metadata.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  metadata,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Metadata created successfully")
          PY

      # 12. Prepare upload folder
      - name: Prepare final package
        if: always()
        run: |
          mkdir -p artifacts

          for file in \
            final_toddler_short.mp4 \
            script.txt \
            voice.mp3 \
            voice.wav \
            scene1.png \
            scene2.png \
            scene3.png \
            scene1.mp4 \
            scene2.mp4 \
            scene3.mp4 \
            youtube_metadata.json
          do
            if [ -s "$file" ]; then
              cp "$file" artifacts/
              echo "Included: $file"
            else
              echo "Not available: $file"
            fi
          done

      # 13. Upload final package
      - name: Upload final test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toddler-video-test
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
          
