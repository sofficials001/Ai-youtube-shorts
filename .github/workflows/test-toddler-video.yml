name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # ============================================================
      # 1. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip

          python3 -m pip install \
            --break-system-packages \
            edge-tts \
            Pillow

          mkdir -p artifacts

          echo "Tools installed successfully."


      # ============================================================
      # 2. CHECK CLOUDFLARE SECRETS
      # ============================================================
      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi

          echo "Cloudflare configuration found."


      # ============================================================
      # 3. GENERATE THREE DISTINCT IMAGES
      # ============================================================
      - name: Generate toddler scenes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell"

          generate_image() {
            local prompt="$1"
            local output="$2"
            local response="$3"
            local raw_image="${output}.raw"

            local http_code

            rm -f "$output" "$response" "$raw_image"

            http_code="$(
              curl -sS \
                --retry 3 \
                --retry-delay 2 \
                --connect-timeout 20 \
                --max-time 180 \
                -o "$response" \
                -w "%{http_code}" \
                "$API_URL" \
                -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(
                  jq -n \
                    --arg prompt "$prompt" \
                    '{prompt: $prompt, steps: 4}'
                )"
            )"

            echo "Cloudflare HTTP status: $http_code"

            if [ "$http_code" != "200" ]; then
              echo "Cloudflare response:"
              cat "$response"
              return 1
            fi

            if [ "$(jq -r '.success // false' "$response")" != "true" ]; then
              echo "Cloudflare returned success=false:"
              cat "$response"
              return 1
            fi

            jq -e '.result.image | type == "string" and length > 0' \
              "$response" >/dev/null

            jq -r '.result.image' "$response" | base64 --decode > "$raw_image"

            test -s "$raw_image"

            # Cloudflare's returned bytes may be JPEG/PNG depending on
            # the response. FFmpeg detects the actual image format.
            ffmpeg -hide_banner -loglevel error -y \
              -i "$raw_image" \
              -frames:v 1 \
              -q:v 2 \
              "$output"

            test -s "$output"

            rm -f "$raw_image"

            echo "Created $output"
          }


          generate_or_retry() {
            local prompt="$1"
            local fallback="$2"
            local output="$3"
            local response="$4"

            if generate_image "$prompt" "$output" "$response"; then
              return 0
            fi

            echo "Primary generation failed."
            echo "Trying fallback prompt..."

            generate_image "$fallback" "$output" "${response}.fallback"
          }


          CHARACTER="wholesome family-friendly fictional Indian toddler boy, approximately three years old, round cheeks, large expressive brown eyes, short black hair, bright yellow T-shirt and blue shorts, natural toddler proportions, photorealistic"

          SCENE1="${CHARACTER}, smiling happily beside a small red toy car on a sunny Indian residential street, full-body wide shot, warm morning sunlight, realistic neighborhood background, professional cinematic photography, vertical composition, no text, no watermark"

          SCENE2="${CHARACTER}, standing at the doorway of a colorful Indian home, funny surprised expression while looking sideways toward his mother who is softly visible in the background, medium shot, different location and pose from scene one, warm daylight, professional cinematic photography, vertical composition, no text, no watermark"

          SCENE3="${CHARACTER}, sitting on a small chair in an Indian courtyard, laughing while holding a school notebook with a plain blank cover, close-up three-quarter portrait, clearly different pose and framing from previous scenes, warm daylight, professional cinematic photography, vertical composition, no text, no watermark"

          FALLBACK="wholesome family-friendly photograph of a cheerful fictional Indian child in colorful casual clothing, smiling outdoors in a sunny Indian neighborhood, natural daylight, realistic professional photography, vertical composition, no text, no watermark"


          echo "Generating Scene 1..."
          generate_or_retry "$SCENE1" "$FALLBACK" "scene1.jpg" "scene1.json"

          echo "Generating Scene 2..."
          generate_or_retry "$SCENE2" "$FALLBACK" "scene2.jpg" "scene2.json"

          echo "Generating Scene 3..."
          generate_or_retry "$SCENE3" "$FALLBACK" "scene3.jpg" "scene3.json"


          # ----------------------------------------------------------
          # Verify image files.
          # ----------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import sys

          files = [
              Path("scene1.jpg"),
              Path("scene2.jpg"),
              Path("scene3.jpg")
          ]

          for path in files:
              if not path.is_file() or path.stat().st_size < 1000:
                  sys.exit(f"Invalid or missing image: {path}")

              try:
                  with Image.open(path) as image:
                      image.verify()
              except Exception as error:
                  sys.exit(f"Image verification failed for {path}: {error}")

          hashes = [
              hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files
          ]

          if len(set(hashes)) != 3:
              print("Image hashes:")
              for path, digest in zip(files, hashes):
                  print(path, digest)
              sys.exit("Generated scene images are identical.")

          print("All three scene images are valid and distinct.")
          PY


          rm -f \
            scene1.json \
            scene2.json \
            scene3.json \
            scene1.json.fallback \
            scene2.json.fallback \
            scene3.json.fallback


      # ============================================================
      # 4. CREATE HINDI VOICE
      # ============================================================
      - name: Create Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          cat > child1.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          EOF

          cat > mother.txt <<'EOF'
          अच्छा? कैसा राज़?
          EOF

          cat > child2.txt <<'EOF'
          होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF


          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate="+8%" \
            --pitch="+15Hz" \
            --file child1.txt \
            --write-media child1.mp3

          edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --rate="+3%" \
            --pitch="+0Hz" \
            --file mother.txt \
            --write-media mother.mp3

          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate="+8%" \
            --pitch="+15Hz" \
            --file child2.txt \
            --write-media child2.mp3


          for file in child1.mp3 mother.mp3 child2.mp3
          do
            if [ ! -s "$file" ]; then
              echo "::error::TTS output missing: $file"
              exit 1
            fi
          done


          # Convert each line to a standard PCM WAV.
          ffmpeg -hide_banner -loglevel error -y \
            -i child1.mp3 \
            -ar 44100 \
            -ac 2 \
            child1.wav

          ffmpeg -hide_banner -loglevel error -y \
            -i mother.mp3 \
            -ar 44100 \
            -ac 2 \
            mother.wav

          ffmpeg -hide_banner -loglevel error -y \
            -i child2.mp3 \
            -ar 44100 \
            -ac 2 \
            child2.wav


          # Short natural pauses.
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi \
            -i "anullsrc=r=44100:cl=stereo" \
            -t 0.15 \
            pause.wav


          {
            printf "file '%s/child1.wav'\n" "$PWD"
            printf "file '%s/pause.wav'\n" "$PWD"
            printf "file '%s/mother.wav'\n" "$PWD"
            printf "file '%s/pause.wav'\n" "$PWD"
            printf "file '%s/child2.wav'\n" "$PWD"
          } > voice_concat.txt


          ffmpeg -hide_banner -loglevel error -y \
            -f concat \
            -safe 0 \
            -i voice_concat.txt \
            -c:a pcm_s16le \
            voice.wav


          test -s voice.wav


          # Verify the source narration isn't silent.
          ffmpeg -hide_banner -loglevel error \
            -i voice.wav \
            -af volumedetect \
            -f null - 2> voice_volume.log


          mean_volume="$(
            sed -n 's/.*mean_volume: \([-0-9.]*\) dB.*/\1/p' \
              voice_volume.log | tail -n 1
          )"


          if [ -z "$mean_volume" ] || [ "$mean_volume" = "-inf" ]; then
            echo "::error::TTS audio is silent or could not be measured."
            cat voice_volume.log
            exit 1
          fi


          if ! awk -v v="$mean_volume" 'BEGIN { exit !(v > -45) }'
          then
            echo "::error::TTS audio is too quiet: ${mean_volume} dB"
            exit 1
          fi


          echo "Hindi narration created."
          echo "Narration mean volume: ${mean_volume} dB"


          cat > script.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          अच्छा? कैसा राज़?
          होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF


      # ============================================================
      # 5. CREATE FINAL VIDEO DIRECTLY FROM THREE IMAGES + AUDIO
      # ============================================================
      - name: Create final vertical video
        shell: bash
        run: |
          set -euo pipefail

          # Three completely separate image inputs are used here.
          # Each produces exactly 3 seconds, then concat creates the
          # final 9-second video with hard scene changes.
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -i scene1.jpg \
            -loop 1 -framerate 30 -i scene2.jpg \
            -loop 1 -framerate 30 -i scene3.jpg \
            -i voice.wav \
            -filter_complex "\
              [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,trim=duration=3,setpts=PTS-STARTPTS[v0];\
              [1:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0010,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,trim=duration=3,setpts=PTS-STARTPTS[v1];\
              [2:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,trim=duration=3,setpts=PTS-STARTPTS[v2];\
              [v0][v1][v2]concat=n=3:v=1:a=0[v];\
              [3:a]aresample=44100,volume=1.8,apad,atrim=duration=9,asetpts=PTS-STARTPTS[a]" \
            -map "[v]" \
            -map "[a]" \
            -t 9 \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            final_toddler_short.mp4


          test -s final_toddler_short.mp4

          echo "Final video created."


      # ============================================================
      # 6. VERIFY FINAL VIDEO + AUDIO + THREE SCENES
      # ============================================================
      - name: Verify final video
        shell: bash
        run: |
          set -euo pipefail

          test -s final_toddler_short.mp4


          width="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"


          height="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"


          video_codec="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"


          audio_codec="$(
            ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"


          video_duration="$(
            ffprobe -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"


          audio_duration="$(
            ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"


          echo "=========================================="
          echo "VIDEO CHECK"
          echo "=========================================="
          echo "Resolution: ${width}x${height}"
          echo "Video codec: ${video_codec}"
          echo "Audio codec: ${audio_codec}"
          echo "Video duration: ${video_duration} seconds"
          echo "Audio duration: ${audio_duration} seconds"
          echo "=========================================="


          if [ "$width" != "1080" ]; then
            echo "::error::Wrong width: $width"
            exit 1
          fi


          if [ "$height" != "1920" ]; then
            echo "::error::Wrong height: $height"
            exit 1
          fi


          if [ "$video_codec" != "h264" ]; then
            echo "::error::Wrong video codec: $video_codec"
            exit 1
          fi


          if [ "$audio_codec" != "aac" ]; then
            echo "::error::Wrong audio codec: $audio_codec"
            exit 1
          fi


          if ! awk -v d="$video_duration" \
            'BEGIN { exit !(d >= 8.8 && d <= 9.2) }'
          then
            echo "::error::Wrong video duration: $video_duration"
            exit 1
          fi


          if ! awk -v d="$audio_duration" \
            'BEGIN { exit !(d >= 8.0) }'
          then
            echo "::error::Audio track is missing or too short: $audio_duration"
            exit 1
          fi


          # ----------------------------------------------------------
          # Extract audio and calculate actual waveform level.
          # This avoids unreliable parsing of FFmpeg log messages.
          # ----------------------------------------------------------

          ffmpeg -hide_banner -loglevel error -y \
            -i final_toddler_short.mp4 \
            -map 0:a:0 \
            -t 9 \
            -ar 44100 \
            -ac 1 \
            verify_audio.wav


          python3 - <<'PY'
          import math
          import struct
          import wave
          import sys

          with wave.open("verify_audio.wav", "rb") as audio:
              channels = audio.getnchannels()
              width = audio.getsampwidth()
              frames = audio.readframes(audio.getnframes())

          if width != 2:
              sys.exit(f"Unexpected WAV sample width: {width}")

          values = struct.unpack(
              "<" + "h" * (len(frames) // 2),
              frames
          )

          if not values:
              sys.exit("No audio samples found.")

          peak = max(abs(v) for v in values)
          rms = math.sqrt(
              sum(v * v for v in values) / len(values)
          )

          print(f"Audio samples: {len(values)}")
          print(f"Audio peak: {peak}")
          print(f"Audio RMS: {rms:.2f}")

          if peak < 1000:
              sys.exit("Audio waveform is effectively silent.")

          if rms < 300:
              sys.exit("Audio waveform is too quiet.")

          print("AUDIO WAVEFORM VALIDATION PASSED")
          PY


          # ----------------------------------------------------------
          # Verify that the three scene intervals are visually
          # different inside the FINAL video itself.
          # ----------------------------------------------------------

          ffmpeg -hide_banner -loglevel error -y \
            -ss 1 \
            -i final_toddler_short.mp4 \
            -frames:v 1 \
            -q:v 2 \
            verify_scene1.jpg

          ffmpeg -hide_banner -loglevel error -y \
            -ss 4 \
            -i final_toddler_short.mp4 \
            -frames:v 1 \
            -q:v 2 \
            verify_scene2.jpg

          ffmpeg -hide_banner -loglevel error -y \
            -ss 7 \
            -i final_toddler_short.mp4 \
            -frames:v 1 \
            -q:v 2 \
            verify_scene3.jpg


          python3 - <<'PY'
          from PIL import Image
          import sys

          names = [
              "verify_scene1.jpg",
              "verify_scene2.jpg",
              "verify_scene3.jpg"
          ]

          images = [
              Image.open(name).convert("RGB").resize((64, 64))
              for name in names
          ]

          arrays = [
              list(image.getdata())
              for image in images
          ]

          def difference(a, b):
              total = 0
              count = len(a) * 3

              for p1, p2 in zip(a, b):
                  total += abs(p1[0] - p2[0])
                  total += abs(p1[1] - p2[1])
                  total += abs(p1[2] - p2[2])

              return total / count

          d12 = difference(arrays[0], arrays[1])
          d13 = difference(arrays[0], arrays[2])
          d23 = difference(arrays[1], arrays[2])

          print(f"Scene difference 1->2: {d12:.2f}")
          print(f"Scene difference 1->3: {d13:.2f}")
          print(f"Scene difference 2->3: {d23:.2f}")

          minimum = min(d12, d13, d23)

          if minimum < 8:
              sys.exit(
                  "FINAL VIDEO SCENE CHECK FAI
