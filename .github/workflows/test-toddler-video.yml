name: AI YouTube Shorts

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            pillow \
            numpy \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Create working directories
        run: |
          rm -rf scenes audio segments output
          mkdir -p scenes
          mkdir -p audio
          mkdir -p segments
          mkdir -p output

      # ==========================================================
      # GENERATE STORY
      # ==========================================================
      - name: Generate AI story
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_story.py <<'PY'
          import os
          import json
          import random
          import requests

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          MODEL = "@cf/meta/llama-3.2-3b-instruct"

          URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/ai/run/{MODEL}"
          )

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json",
          }

          themes = [
              "एक छोटे खरगोश और एक खोए हुए पक्षी की भावुक दोस्ती",
              "एक छोटा खरगोश जो तूफान में अपने दोस्त को बचाने की कोशिश करता है",
              "एक छोटा खरगोश जिसे जंगल में एक रहस्यमयी चिट्ठी मिलती है",
              "एक खरगोश जो अपने दोस्त के लिए आखिरी मौका मिलने पर हिम्मत दिखाता है",
              "एक छोटा खरगोश जो जंगल में एक घायल जानवर की मदद करता है",
              "एक खरगोश जिसे लगता है कि उसका दोस्त उसे छोड़कर चला गया है, लेकिन अंत में सच्चाई सामने आती है",
              "एक छोटा खरगोश जो किसी अनजान की मदद करता है और बदले में अप्रत्याशित मदद पाता है",
              "एक खरगोश जो अपने डर के बावजूद अपने दोस्त को बचाने के लिए अंधेरे जंगल में जाता है",
          ]

          theme = random.choice(themes)

          system_prompt = """
          तुम Hindi YouTube Shorts के लिए professional viral-story writer हो।

          एक ORIGINAL fictional YouTube Short बनाओ।

          कहानी:
          - लगभग 25 से 40 सेकंड की हो
          - पहले ही वाक्य में strong hook हो
          - शुरुआत boring introduction से नहीं हो
          - clear problem हो
          - tension बढ़े
          - climax हो
          - emotional satisfying ending हो
          - आखिरी scene में natural short CTA हो
          - graphic violence नहीं
          - real people नहीं
          - copyrighted characters नहीं
          - brands/logos नहीं

          भाषा:
          - सरल और natural Hindi
          - narration बोलने में आसान हो
          - छोटे वाक्य इस्तेमाल करो

          मुख्य character:
          "एक छोटा प्यारा सफेद खरगोश, नीला छोटा scarf पहने हुए"

          Character को सभी scenes में consistent रखो।

          EXACT JSON structure:

          {
            "title": "short Hindi title",
            "description": "short YouTube description",
            "tags": ["tag1", "tag2", "tag3", "tag4", "tag5"],
            "scenes": [
              {
                "scene": 1,
                "role": "HOOK",
                "narration": "Hindi narration",
                "visual_prompt": "English visual prompt"
              },
              {
                "scene": 2,
                "role": "SETUP",
                "narration": "Hindi narration",
                "visual_prompt": "English visual prompt"
              },
              {
                "scene": 3,
                "role": "PROBLEM",
                "narration": "Hindi narration",
                "visual_prompt": "English visual prompt"
              },
              {
                "scene": 4,
                "role": "TENSION",
                "narration": "Hindi narration",
                "visual_prompt": "English visual prompt"
              },
              {
                "scene": 5,
                "role": "CLIMAX",
                "narration": "Hindi narration",
                "visual_prompt": "English visual prompt"
              },
              {
                "scene": 6,
                "role": "ENDING_CTA",
                "narration": "Hindi narration with a natural short CTA",
                "visual_prompt": "English visual prompt"
              }
            ]
          }

          Rules:
          - केवल JSON दो
          - Markdown code fences मत लगाओ
          - exactly 6 scenes
          - visual_prompt English में
          - visual_prompt में text, letters, subtitles, watermark या logo नहीं
          """

          user_prompt = f"""
          आज का story theme:

          {theme}

          इस theme पर एक engaging Hindi YouTube Short बनाओ।
          """

          payload = {
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "max_tokens": 1800,
              "temperature": 0.85,
              "top_p": 0.9
          }

          print("Generating story...")
          print("Theme:", theme)

          response = requests.post(
              URL,
              headers=HEADERS,
              json=payload,
              timeout=180
          )

          print("Cloudflare HTTP:", response.status_code)

          if response.status_code != 200:
              print(response.text[:5000])
              raise RuntimeError(
                  "Cloudflare story generation failed."
              )

          data = response.json()

          if not data.get("success"):
              print(data)
              raise RuntimeError(
                  "Cloudflare returned success=false."
              )

          result = data.get("result")

          if result is None:
              print(data)
              raise RuntimeError(
                  "Cloudflare returned no result."
              )

          # ======================================================
          # IMPORTANT FIX:
          # Cloudflare may return either:
          #
          # 1. result = {"response": "..."}
          # 2. result = {...structured JSON...}
          #
          # Handle both safely.
          # ======================================================

          if isinstance(result, dict):

              if "response" in result:
                  raw = result["response"]

                  if isinstance(raw, dict):
                      story = raw

                  elif isinstance(raw, str):
                      try:
                          story = json.loads(raw)
                      except json.JSONDecodeError as exc:
                          print(raw)
                          raise RuntimeError(
                              "Cloudflare returned invalid JSON text."
                          ) from exc

                  else:
                      raise RuntimeError(
                          "Unexpected response type."
                      )

              elif all(
                  key in result
                  for key in [
                      "title",
                      "description",
                      "tags",
                      "scenes"
                  ]
              ):
                  # Your screenshot showed this format.
                  story = result

              else:
                  print("Unexpected result:")
                  print(result)
                  raise RuntimeError(
                      "Could not identify story data."
                  )

          elif isinstance(result, str):

              try:
                  story = json.loads(result)
              except json.JSONDecodeError as exc:
                  print(result)
                  raise RuntimeError(
                      "Cloudflare returned invalid JSON text."
                  ) from exc

          else:
              raise RuntimeError(
                  f"Unexpected result type: {type(result)}"
              )

          # ======================================================
          # VALIDATE STORY
          # ======================================================

          required_top = [
              "title",
              "description",
              "tags",
              "scenes"
          ]

          for key in required_top:
              if key not in story:
                  raise RuntimeError(
                      f"Missing story field: {key}"
                  )

          scenes = story["scenes"]

          if not isinstance(scenes, list):
              raise RuntimeError(
                  "scenes is not a list."
              )

          if len(scenes) != 6:
              raise RuntimeError(
                  f"Expected 6 scenes, got {len(scenes)}."
              )

          required_scene_fields = [
              "scene",
              "role",
              "narration",
              "visual_prompt"
          ]

          expected_roles = [
              "HOOK",
              "SETUP",
              "PROBLEM",
              "TENSION",
              "CLIMAX",
              "ENDING_CTA"
          ]

          for index, scene in enumerate(scenes):

              for key in required_scene_fields:
                  if key not in scene:
                      raise RuntimeError(
                          f"Scene {index + 1} missing {key}."
                      )

              if not str(
                  scene["narration"]
              ).strip():
                  raise RuntimeError(
                      f"Scene {index + 1} has empty narration."
                  )

              if not str(
                  scene["visual_prompt"]
              ).strip():
                  raise RuntimeError(
                      f"Scene {index + 1} has empty visual prompt."
                  )

              # Force correct scene numbering.
              scene["scene"] = index + 1

              # Force expected role.
              scene["role"] = expected_roles[index]

          # ======================================================
          # CONSISTENT CHARACTER
          # ======================================================

          character = (
              "same main character: a small cute white rabbit "
              "wearing a small blue scarf, consistent face, "
              "consistent body proportions"
          )

          visual_rules = (
              ", cinematic 3D animated movie style, "
              "high detail, expressive characters, "
              "beautiful lighting, vertical composition, "
              "no text, no letters, no subtitles, "
              "no watermark, no logo, no brand"
          )

          for scene in scenes:

              scene["visual_prompt"] = (
                  character
                  + ", "
                  + str(
                      scene["visual_prompt"]
                  ).strip()
                  + visual_rules
              )

          # ======================================================
          # SAVE STORY
          # ======================================================

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "story.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "TITLE:\n"
                  + str(story["title"])
                  + "\n\n"
              )

              f.write(
                  "DESCRIPTION:\n"
                  + str(story["description"])
                  + "\n\n"
              )

              for scene in scenes:

                  f.write(
                      f"SCENE {scene['scene']} "
                      f"({scene['role']})\n"
                  )

                  f.write(
                      str(scene["narration"])
                      + "\n\n"
                  )

          print("")
          print("========================================")
          print("STORY GENERATED SUCCESSFULLY")
          print("========================================")
          print("TITLE:", story["title"])

          for scene in scenes:
              print(
                  f"Scene {scene['scene']} "
                  f"[{scene['role']}]: "
                  f"{scene['narration']}"
              )

          print("========================================")
          PY

          python generate_story.py

      # ==========================================================
      # GENERATE 6 IMAGES
      # ==========================================================
      - name: Generate AI scenes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_images.py <<'PY'
          import os
          import json
          import base64
          import requests

          from io import BytesIO
          from PIL import Image

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          MODEL = "@cf/black-forest-labs/flux-1-schnell"

          URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/ai/run/{MODEL}"
          )

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json"
          }

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          for scene in story["scenes"]:

              number = int(scene["scene"])

              prompt = " ".join(
                  scene["visual_prompt"].split()
              )

              print(
                  f"Generating image {number}/6..."
              )

              response = requests.post(
                  URL,
                  headers=HEADERS,
                  json={
                      "prompt": prompt,
                      "steps": 4
                  },
                  timeout=180
              )

              print(
                  "Cloudflare HTTP:",
                  response.status_code
              )

              if response.status_code != 200:
                  print(response.text[:5000])
                  raise RuntimeError(
                      f"Image generation failed for scene {number}."
                  )

              data = response.json()

              if not data.get("success"):
                  print(data)
                  raise RuntimeError(
                      f"Cloudflare failed for scene {number}."
                  )

              result = data.get("result")

              if not isinstance(result, str):
                  raise RuntimeError(
                      f"Unexpected image result for scene {number}."
                  )

              image_bytes = base64.b64decode(
                  result,
                  validate=True
              )

              image = Image.open(
                  BytesIO(image_bytes)
              )

              image.load()

              path = (
                  f"scenes/scene{number}.png"
              )

              image.save(
                  path,
                  "PNG"
              )

              print(
                  f"Saved {path}: "
                  f"{image.width}x{image.height}"
              )

          print("All 6 images generated.")
          PY

          python generate_images.py

      # ==========================================================
      # GENERATE VOICE
      # ==========================================================
      - name: Generate scene narration
        run: |
          cat > generate_audio.py <<'PY'
          import asyncio
          import json
          import os
          import edge_tts

          VOICE = "hi-IN-SwaraNeural"

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          async def generate():

              for scene in story["scenes"]:

                  number = int(scene["scene"])

                  output = (
                      f"audio/scene{number}.mp3"
                  )

                  print(
                      f"Generating voice {number}/6..."
                  )

                  communicator = edge_tts.Communicate(
                      str(scene["narration"]).strip(),
                      VOICE,
                      rate="+0%",
                      volume="+0%"
                  )

                  await communicator.save(output)

                  if not os.path.exists(output):
                      raise RuntimeError(
                          f"Audio missing for scene {number}."
                      )

                  size = os.path.getsize(output)

                  if size < 1000:
                      raise RuntimeError(
                          f"Audio too small for scene {number}."
                      )

                  print(
                      f"Created {output}: {size} bytes"
                  )

          asyncio.run(generate())

          print("All narration generated.")
          PY

          python generate_audio.py

      # ==========================================================
      # CREATE SUBTITLED VIDEOS
      # ==========================================================
      - name: Create subtitled scene videos
        run: |
          cat > create_segments.py <<'PY'
          import json
          import subprocess

          FONT_DIR = "/usr/share/fonts/truetype/noto"

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          def duration(path):

              result = subprocess.check_output([
