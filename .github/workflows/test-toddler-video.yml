name: Test Toddler Video

on:
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # INSTALL TOOLS
      # ============================================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts

          echo "Tools installed successfully"

      # ============================================================
      # CHECK SECRETS
      # ============================================================
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi

          echo "Cloudflare configuration found"

      # ============================================================
      # GENERATE SCENE 1
      # ============================================================
      - name: Generate Scene 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          echo "======================================"
          echo "GENERATING SCENE 1"
          echo "======================================"

          curl -sS \
            --retry 3 \
            --retry-delay 3 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "A wholesome family friendly cinematic photograph of a fictional young Indian child, around three years old, small and cheerful, round cheeks, large expressive brown eyes, short black hair, innocent happy smile, wearing a bright yellow T-shirt and blue shorts, standing on a clean residential street in India, warm morning sunlight, realistic photography, natural proportions, detailed face, professional camera, shallow depth of field",
              "steps": 4,
              "seed": 12345
            }' \
            -o scene1.json

          python3 - <<'PY'
          import json
          import base64
          import sys

          with open("scene1.json", "r") as f:
              data = json.load(f)

          if not data.get("success", False):
              print("Cloudflare response:")
              print(json.dumps(data, indent=2))
              sys.exit("Scene 1 failed")

          image = data["result"]["image"]

          with open("scene1.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 1 created successfully")
          PY

      # ============================================================
      # GENERATE SCENE 2
      # ============================================================
      - name: Generate Scene 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          echo "======================================"
          echo "GENERATING SCENE 2"
          echo "======================================"

          curl -sS \
            --retry 3 \
            --retry-delay 3 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "A wholesome family friendly cinematic close-up photograph of a fictional young Indian child, around three years old, cheerful face, round cheeks, large expressive brown eyes, short black hair, funny surprised expression, wearing a bright yellow T-shirt and blue shorts, standing near the entrance of a colorful Indian home, warm natural daylight, realistic photography, professional camera, shallow depth of field",
              "steps": 4,
              "seed": 12345
            }' \
            -o scene2.json

          python3 - <<'PY'
          import json
          import base64
          import sys

          with open("scene2.json", "r") as f:
              data = json.load(f)

          if not data.get("success", False):
              print("Cloudflare response:")
              print(json.dumps(data, indent=2))
              sys.exit("Scene 2 failed")

          image = data["result"]["image"]

          with open("scene2.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 2 created successfully")
          PY

      # ============================================================
      # GENERATE SCENE 3
      # ============================================================
      - name: Generate Scene 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          echo "======================================"
          echo "GENERATING SCENE 3"
          echo "======================================"

          curl -sS \
            --retry 3 \
            --retry-delay 3 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "A wholesome family friendly cinematic photograph of a cheerful fictional young Indian child smiling happily outdoors, wearing a bright yellow T-shirt and blue shorts, colorful residential neighborhood in India, sunny natural daylight, realistic photography, natural proportions, professional camera, detailed face",
              "steps": 4,
              "seed": 54321
            }' \
            -o scene3.json

          python3 - <<'PY'
          import json
          import base64

          with open("scene3.json", "r") as f:
              data = json.load(f)

          if data.get("success", False):

              image = data["result"]["image"]

              with open("scene3.png", "wb") as f:
                  f.write(base64.b64decode(image))

              print("Scene 3 created successfully")

          else:

              print("Scene 3 was rejected.")
              print(json.dumps(data, indent=2))

              with open("scene3_retry", "w") as f:
                  f.write("retry")

          PY

      # ============================================================
      # SCENE 3 FALLBACK
      # ============================================================
      - name: Generate Scene 3 fallback
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          if [ -f scene3.png ]; then
            echo "Scene 3 already exists."
            exit 0
          fi

          echo "======================================"
          echo "SCENE 3 FALLBACK"
          echo "======================================"

          curl -sS \
            --retry 3 \
            --retry-delay 3 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "Wholesome family friendly cinematic photograph, cheerful young person in colorful casual clothing, smiling outdoors on a sunny Indian residential street, natural daylight, realistic professional photography",
              "steps": 4,
              "seed": 98765
            }' \
            -o scene3_fallback.json

          python3 - <<'PY'
          import json
          import base64
          import sys

          with open("scene3_fallback.json", "r") as f:
              data = json.load(f)

          if not data.get("success", False):
              print(json.dumps(data, indent=2))
              sys.exit("Scene 3 fallback failed")

          image = data["result"]["image"]

          with open("scene3.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 3 fallback created successfully")
          PY

      # ============================================================
      # CREATE HINDI VOICE
      # ============================================================
      - name: Create Hindi voice
        run: |

          echo "======================================"
          echo "CREATING HINDI VOICE"
          echo "======================================"

          cat > script.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा।
          क्या राज़?
          होमवर्क छुपा दो तो टीचर खुद ढूंढने आ जाती हैं!
          EOF

          edge-tts \
            --voice hi-IN-MadhurNeural \
            --rate "+10%" \
            --pitch "+5Hz" \
            --text "$(cat script.txt)" \
            --write-media voice.mp3

          ffmpeg -y \
            -i voice.mp3 \
            -ar 44100 \
            -ac 2 \
            voice.wav

          echo "Hindi voice created"

      # ============================================================
      # CREATE SCENE 1 VIDEO
      # ============================================================
      - name: Create Scene 1 video
        run: |

          ffmpeg -y \
            -loop 1 \
            -i scene1.png \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            scene1.mp4

      # ============================================================
      # CREATE SCENE 2 VIDEO
      # ============================================================
      - name: Create Scene 2 video
        run: |

          ffmpeg -y \
            -loop 1 \
            -i scene2.png \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.001,1.10)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            scene2.mp4

      # ============================================================
      # CREATE SCENE 3 VIDEO
      # ============================================================
      - name: Create Scene 3 video
        run: |

          ffmpeg -y \
            -loop 1 \
            -i scene3.png \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            scene3.mp4

      # ============================================================
      # JOIN VIDEOS
      # ============================================================
      - name: Join scenes
        run: |

          echo "file '$PWD/scene1.mp4'" > concat.txt
          echo "file '$PWD/scene2.mp4'" >> concat.txt
          echo "file '$PWD/scene3.mp4'" >> concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            silent_video.mp4

      # ============================================================
      # ADD HINDI VOICE
      # ============================================================
      - name: Add Hindi voice
        run: |

          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -shortest \
            final_toddler_short.mp4

      # ============================================================
      # VIDEO INFORMATION
      # ============================================================
      - name: Check final video
        run: |

          echo "======================================"
          echo "FINAL VIDEO INFORMATION"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            final_toddler_short.mp4

      # ============================================================
      # YOUTUBE METADATA
      # ============================================================
      - name: Create YouTube metadata
        run: |

          python3 - <<'PY'

          import json

          metadata = {
              "title": "जब बच्चे ने होमवर्क का राज़ बताया 😂",
              "description": "एक छोटे बच्चे का मासूम लेकिन मज़ेदार जवाब 😂",
              "language": "Hindi",
              "category": "Entertainment",
              "format": "YouTube Shorts",
              "aspect_ratio": "9:16",
              "duration": "9 seconds",
              "hashtags": [
                  "#shorts",
                  "#hindi",
                  "#funny",
                  "#comedy",
                  "#viral"
              ]
          }

          with open(
              "youtube_metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  metadata,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("YouTube metadata created")

          PY

      # ============================================================
      # UPLOAD EVERYTHING
      # ============================================================
      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: toddler-video-test
          path: |
            final_toddler_short.mp4
            scene1.png
            scene2.png
            scene3.png
            scene1.mp4
            scene2.mp4
            scene3.mp4
            voice.mp3
            voice.wav
            script.txt
            youtube_metadata.json
