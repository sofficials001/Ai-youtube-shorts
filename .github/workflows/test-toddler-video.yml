name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ============================================================
      # 1. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts

          echo "Tools installed successfully."


      # ============================================================
      # 2. CHECK CLOUDFLARE SECRETS
      # ============================================================
      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

          echo "Cloudflare secrets found."


      # ============================================================
      # 3. GENERATE ALL TODDLER SCENES
      # ============================================================
      - name: Generate toddler scenes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          set -euo pipefail

          cat > generate_scenes.py <<'PY'
          import base64
          import json
          import os
          import shutil
          import urllib.error
          import urllib.request
          from pathlib import Path


          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          API_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]

          ENDPOINT = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + ACCOUNT_ID
              + "/ai/run/@cf/black-forest-labs/flux-1-schnell"
          )


          # --------------------------------------------------------
          # CHARACTER
          # --------------------------------------------------------

          CHARACTER = (
              "wholesome family-friendly fictional Indian boy, "
              "three years old, cute round cheeks, "
              "large expressive brown eyes, short black hair, "
              "slightly chubby toddler proportions, "
              "bright yellow T-shirt, blue shorts"
          )


          # --------------------------------------------------------
          # SCENE PROMPTS
          # --------------------------------------------------------

          SCENES = [

              (
                  "scene1.jpg",
                  CHARACTER
                  + ", cheerful innocent smile, "
                  + "standing on a clean Indian residential street, "
                  + "warm natural daylight, realistic professional photography, "
                  + "cinematic portrait, shallow depth of field"
              ),

              (
                  "scene2.jpg",
                  CHARACTER
                  + ", funny confused expression, "
                  + "looking toward a family member near an Indian home entrance, "
                  + "warm natural daylight, realistic professional photography, "
                  + "cinematic close-up, shallow depth of field"
              ),

              (
                  "scene3.jpg",
                  CHARACTER
                  + ", playful happy expression, "
                  + "smiling after saying something clever, "
                  + "colorful Indian neighborhood background, "
                  + "warm natural daylight, realistic professional photography, "
                  + "cinematic portrait, shallow depth of field"
              )

          ]


          FALLBACK_PROMPTS = [

              (
                  "scene1.jpg",
                  "wholesome family-friendly photograph of a cheerful "
                  "fictional Indian child with a round cute face, "
                  "large expressive brown eyes, short black hair, "
                  "bright yellow shirt, blue shorts, "
                  "sunny residential neighborhood in India, "
                  "natural light, realistic professional photography"
              ),

              (
                  "scene2.jpg",
                  "wholesome family-friendly photograph of the same "
                  "fictional Indian child, smiling and looking curious, "
                  "bright yellow shirt, blue shorts, "
                  "Indian home entrance, natural daylight, "
                  "realistic professional photography"
              ),

              (
                  "scene3.jpg",
                  "wholesome family-friendly photograph of the same "
                  "fictional Indian child, cheerful playful smile, "
                  "bright yellow shirt, blue shorts, "
                  "sunny Indian neighborhood, "
                  "natural daylight, realistic professional photography"
              )

          ]


          def request_image(prompt):
              payload = {
                  "prompt": prompt,
                  "steps": 4
              }

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  ENDPOINT,
                  data=body,
                  headers={
                      "Authorization": "Bearer " + API_TOKEN,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:

                      raw = response.read()

              except urllib.error.HTTPError as error:

                  response_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      "Cloudflare HTTP "
                      + str(error.code)
                      + ": "
                      + response_body
                  )

              except Exception as error:

                  raise RuntimeError(
                      "Cloudflare request failed: "
                      + str(error)
                  )


              try:
                  data = json.loads(
                      raw.decode("utf-8")
                  )
              except Exception as error:

                  raise RuntimeError(
                      "Cloudflare returned invalid JSON: "
                      + str(error)
                  )


              if not data.get("success", False):

                  raise RuntimeError(
                      "Cloudflare error: "
                      + json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )


              result = data.get("result")

              if not isinstance(result, dict):

                  raise RuntimeError(
                      "Cloudflare response has no result object."
                  )


              encoded = result.get("image")

              if not encoded:

                  raise RuntimeError(
                      "Cloudflare response contains no image."
                  )


              try:
                  image_bytes = base64.b64decode(
                      encoded,
                      validate=True
                  )
              except Exception as error:

                  raise RuntimeError(
                      "Invalid Base64 image: "
                      + str(error)
                  )


              if len(image_bytes) < 1000:

                  raise RuntimeError(
                      "Generated image is unexpectedly small."
                  )


              return image_bytes


          def save_image(path, image_bytes):

              Path(path).write_bytes(
                  image_bytes
              )

              print(
                  "Saved "
                  + path
                  + " ("
                  + str(len(image_bytes))
                  + " bytes)"
              )


          def generate_scene(
              filename,
              primary_prompt,
              fallback_prompt
          ):

              print()
              print(
                  "=========================================="
              )
              print(
                  "Generating "
                  + filename
              )
              print(
                  "=========================================="
              )

              # ----------------------------------------------------
              # PRIMARY REQUEST
              # ----------------------------------------------------

              try:

                  image = request_image(
                      primary_prompt
                  )

                  save_image(
                      filename,
                      image
                  )

                  return True

              except Exception as error:

                  print(
                      "Primary prompt failed:"
                  )

                  print(
                      str(error)
                  )


              # ----------------------------------------------------
              # FALLBACK REQUEST
              # ----------------------------------------------------

              print(
                  "Trying fallback prompt..."
              )

              try:

                  image = request_image(
                      fallback_prompt
                  )

                  save_image(
                      filename,
                      image
                  )

                  return True

              except Exception as error:

                  print(
                      "Fallback prompt failed:"
                  )

                  print(
                      str(error)
                  )

                  return False


          # --------------------------------------------------------
          # GENERATE SCENES
          # --------------------------------------------------------

          generated = {}

          for index in range(3):

              filename, prompt = SCENES[index]

              fallback_filename, fallback_prompt = (
                  FALLBACK_PROMPTS[index]
              )

              success = generate_scene(
                  filename,
                  prompt,
                  fallback_prompt
              )

              generated[filename] = success


          # --------------------------------------------------------
          # GUARANTEE THREE FILES WHEN POSSIBLE
          # --------------------------------------------------------

          existing = [
              name
              for name, success in generated.items()
              if success and Path(name).exists()
          ]


          print()
          print(
              "=========================================="
          )

          print(
              "Generated scenes:"
          )

          for name in generated:

              print(
                  name
                  + ": "
                  + str(generated[name])
              )


          print(
              "=========================================="
          )


          # Scene 1 is required.
          if not Path("scene1.jpg").exists():

              raise SystemExit(
                  "Scene 1 could not be generated."
              )


          # If Scene 2 failed, reuse Scene 1.
          if not Path("scene2.jpg").exists():

              print(
                  "Scene 2 unavailable. Reusing Scene 1."
              )

              shutil.copyfile(
                  "scene1.jpg",
                  "scene2.jpg"
              )


          # If Scene 3 failed, reuse Scene 2.
          if not Path("scene3.jpg").exists():

              print(
                  "Scene 3 unavailable. Reusing Scene 2."
              )

              shutil.copyfile(
                  "scene2.jpg",
                  "scene3.jpg"
              )


          # --------------------------------------------------------
          # SAVE PROMPTS FOR INSPECTION
          # --------------------------------------------------------

          with open(
              "scene_prompts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for index, item in enumerate(
                  SCENES,
                  start=1
              ):

                  file.write(
                      "SCENE "
                      + str(index)
                      + "\n"
                  )

                  file.write(
                      item[1]
                      + "\n\n"
                  )


          print()
          print(
              "All scene files are ready."
          )

          PY

          python3 generate_scenes.py


      # ============================================================
      # 4. CREATE HINDI SCRIPT + REALISTIC TTS
      # ============================================================
      - name: Create Hindi voice
        shell: bash
        run: |

          set -euo pipefail

          cat > script.txt <<'EOF'
          बच्चा 1: मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          बच्चा 2: अच्छा? कैसा राज़?
          बच्चा 1: होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF

          echo "Hindi script:"
          cat script.txt
          echo ""

          # Child-like voice
          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate "+8%" \
            --pitch "+15Hz" \
            --text "मम्मी, आज मैंने स्कूल में एक राज़ सीखा!" \
            --write-media child1.mp3

          # Adult voice
          edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --rate "+3%" \
            --pitch "+0Hz" \
            --text "अच्छा? कैसा राज़?" \
            --write-media adult.mp3

          # Child-like punchline
          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate "+8%" \
            --pitch "+15Hz" \
            --text "होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!" \
            --write-media child2.mp3

          # Convert everything to WAV.
          ffmpeg -y \
            -i child1.mp3 \
            -ar 44100 \
            -ac 2 \
            child1.wav

          ffmpeg -y \
            -i adult.mp3 \
            -ar 44100 \
            -ac 2 \
            adult.wav

          ffmpeg -y \
            -i child2.mp3 \
            -ar 44100 \
            -ac 2 \
            child2.wav

          # Small pauses between dialogue lines.
          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=44100:cl=stereo" \
            -t 0.12 \
            pause.wav

          # Build concat list.
          printf "file '%s'\n" "$PWD/child1.wav" > audio_concat.txt
          printf "file '%s'\n" "$PWD/pause.wav" >> audio_concat.txt
          printf "file '%s'\n" "$PWD/adult.wav" >> audio_concat.txt
          printf "file '%s'\n" "$PWD/pause.wav" >> audio_concat.txt
          printf "file '%s'\n" "$PWD/child2.wav" >> audio_concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i audio_concat.txt \
            -c:a pcm_s16le \
            voice.wav

          echo "Hindi voice created."


      # ============================================================
      # 5. CREATE SCENE 1 VIDEO
      # ============================================================
      - name: Create Scene 1 video
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -i scene1.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            scene1.mp4


      # ============================================================
      # 6. CREATE SCENE 2 VIDEO
      # ============================================================
      - name: Create Scene 2 video
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -i scene2.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0010,1.10)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            scene2.mp4


      # ============================================================
      # 7. CREATE SCENE 3 VIDEO
      # ============================================================
      - name: Create Scene 3 video
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -i scene3.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            scene3.mp4


      # ============================================================
      # 8. JOIN ALL THREE VIDEO SCENES
      # ============================================================
      - name: Join scenes
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -i scene1.mp4 \
            -i scene2.mp4 \
            -i scene3.mp4 \
            -filter_complex \
            "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v]" \
            -map "[v]" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            silent_video.mp4


      # ============================================================
      # 9. ADD HINDI VOICE
      # ============================================================
      - name: Add Hindi voice
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -shortest \
            final_toddler_short.mp4

          test -s final_toddler_short.mp4

          echo "Final video created."


      # ============================================================
      # 10. VERIFY OUTPUT
      # ============================================================
      - name: Verify final video
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "FINAL VIDEO INFORMATION"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            final_toddler_short.mp4

          echo "=========================================="

          python3 - <<'PY'
    
