                  path
              ])

              return float(
                  result.decode().strip()
              )

          def ass_escape(text):

              return (
                  str(text)
                  .replace("\\", "\\\\")
                  .replace("{", "\\{")
                  .replace("}", "\\}")
              )

          for scene in story["scenes"]:

              number = int(scene["scene"])

              image = (
                  f"scenes/scene{number}.png"
              )

              audio = (
                  f"audio/scene{number}.mp3"
              )

              ass = (
                  f"scene{number}.ass"
              )

              output = (
                  f"segments/segment{number}.mp4"
              )

              length = max(
                  
