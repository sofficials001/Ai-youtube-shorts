name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip

          python3 -m pip install \
            --break-system-packages \
            edge-tts

          mkdir -p artifacts

          echo "Tools installed successfully."


      # ============================================================
      # 2. CHECK CLOUDFLARE SECRETS
      # ============================================================
      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi

          echo "Cloudflare configuration found."


      # ============================================================
      # 3. GENERATE THREE TODDLER SCENES
      # ============================================================
      - name: Generate toddler scenes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell"

          generate_image() {
            local prompt="$1"
            local output="$2"
            local response="$3"
            local http_code
            local encoded

            http_code="$(
              curl -sS \
                --retry 3 \
                --retry-delay 2 \
                -o "$response" \
                -w "%{http_code}" \
                "$API_URL" \
                -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(
                  jq -n \
                    --arg prompt "$prompt" \
                    --argjson steps 4 \
                    '{prompt: $prompt, steps: $steps}'
                )"
            )"

            echo "Cloudflare HTTP status: $http_code"

            if [ "$http_code" != "200" ]; then
              echo "Cloudflare response:"
              cat "$response"
              return 1
            fi

            if [ "$(jq -r '.success // false' "$response")" != "true" ]; then
              echo "Cloudflare returned success=false:"
              cat "$response"
              return 1
            fi

            encoded="$(jq -r '.result.image // empty' "$response")"

            if [ -z "$encoded" ]; then
              echo "Cloudflare response did not contain result.image:"
              cat "$response"
              return 1
            fi

            printf '%s' "$encoded" | base64 --decode > "$output"

            test -s "$output"

            # Let FFmpeg verify the returned image bytes.
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of default=noprint_wrappers=1:nokey=1 \
              "$output" >/dev/null

            echo "Created $output"
          }


          # ----------------------------------------------------------
          # Same fictional character description
          # ----------------------------------------------------------

          character="wholesome family-friendly fictional Indian toddler boy, about three years old, small chubby body, round cheeks, large expressive brown eyes, short black hair, bright yellow T-shirt, blue shorts"


          scene1="wide full-body shot, toddler standing alone beside a small red toy car on a sunny Indian residential street, smiling directly at camera, clearly visible yellow T-shirt and blue shorts, warm natural daylight, realistic professional photography, vertical 9:16 composition"

          scene2="medium close-up at the doorway of an Indian home, toddler looking sideways with a funny confused expression toward his mother, mother only partly visible in the background, clearly different camera angle and setting from other scenes, warm natural daylight, realistic professional photography, vertical 9:16 composition"

          scene3="close-up of the same toddler laughing proudly while holding a school notebook with a simple blank cover, colorful Indian neighborhood courtyard, different pose and framing from the other scenes, warm natural daylight, realistic professional photography, vertical 9:16 composition"


          fallback="wholesome family-friendly photograph of a fictional young Indian child smiling outdoors, colorful casual clothing, sunny Indian neighborhood, natural daylight, realistic professional photography, vertical composition"


          # ----------------------------------------------------------
          # Scene 1
          # ----------------------------------------------------------

          echo "Generating Scene 1..."

          if ! generate_image \
            "$character, $scene1" \
            "scene1.jpg" \
            "scene1.json"
          then
            echo "Scene 1 primary prompt failed."
            echo "Trying fallback prompt..."

            generate_image \
              "$fallback" \
              "scene1.jpg" \
              "scene1_fallback.json"
          fi


          # ----------------------------------------------------------
          # Scene 2
          # ----------------------------------------------------------

          echo "Generating Scene 2..."

          if ! generate_image \
            "$character, $scene2" \
            "scene2.jpg" \
            "scene2.json"
          then
            echo "Scene 2 primary prompt failed."
            echo "Trying fallback prompt..."

            generate_image \
              "$fallback" \
              "scene2.jpg" \
              "scene2_fallback.json"
          fi


          # ----------------------------------------------------------
          # Scene 3
          # ----------------------------------------------------------

          echo "Generating Scene 3..."

          if ! generate_image \
            "$character, $scene3" \
            "scene3.jpg" \
            "scene3.json"
          then
            echo "Scene 3 primary prompt failed."
            echo "Trying fallback prompt..."

            generate_image \
              "$fallback" \
              "scene3.jpg" \
              "scene3_fallback.json"
          fi


          # ----------------------------------------------------------
          # Verify images exist
          # ----------------------------------------------------------

          for file in scene1.jpg scene2.jpg scene3.jpg
          do
            if [ ! -s "$file" ]; then
              echo "::error::Missing image: $file"
              exit 1
            fi
          done


          # Remove API response JSON files from the final package.
          rm -f \
            scene1.json \
            scene2.json \
            scene3.json \
            scene1_fallback.json \
            scene2_fallback.json \
            scene3_fallback.json


          # Catch the exact failure mode where the same image is accidentally
          # reused for every scene. Different prompts are used above; if the
          # API nevertheless returns identical files, fail rather than publish
          # a video that only shows one picture.
          image_hashes="$(sha256sum scene1.jpg scene2.jpg scene3.jpg | awk '{print $1}' | sort -u | wc -l)"
          if [ "$image_hashes" -ne 3 ]; then
            echo "::error::Scene images are identical. Regenerate the workflow run."
            sha256sum scene1.jpg scene2.jpg scene3.jpg
            exit 1
          fi

          echo "All three distinct toddler scenes generated successfully."


      # ============================================================
      # 4. CREATE HINDI VOICE
      # ============================================================
      - name: Create Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            'मम्मी, आज मैंने स्कूल में एक राज़ सीखा!' \
            > child1.txt

          printf '%s\n' \
            'अच्छा? कैसा राज़?' \
            > adult.txt

          printf '%s\n' \
            'होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!' \
            > child2.txt


          # Child line 1
          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate="+8%" \
            --pitch="+15Hz" \
            --file child1.txt \
            --write-media child1.mp3


          # Mother line
          edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --rate="+3%" \
            --pitch="+0Hz" \
            --file adult.txt \
            --write-media adult.mp3


          # Child punchline
          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate="+8%" \
            --pitch="+15Hz" \
            --file child2.txt \
            --write-media child2.mp3


          test -s child1.mp3
          test -s adult.mp3
          test -s child2.mp3


          # Convert audio
          ffmpeg -y \
            -i child1.mp3 \
            -ar 44100 \
            -ac 2 \
            child1.wav

          ffmpeg -y \
            -i adult.mp3 \
            -ar 44100 \
            -ac 2 \
            adult.wav

          ffmpeg -y \
            -i child2.mp3 \
            -ar 44100 \
            -ac 2 \
            child2.wav


          # Small dialogue pause
          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=44100:cl=stereo" \
            -t 0.12 \
            pause.wav


          # Build audio order
          printf "file '%s/child1.wav'\n" "$PWD" > audio_concat.txt
          printf "file '%s/pause.wav'\n" "$PWD" >> audio_concat.txt
          printf "file '%s/adult.wav'\n" "$PWD" >> audio_concat.txt
          printf "file '%s/pause.wav'\n" "$PWD" >> audio_concat.txt
          printf "file '%s/child2.wav'\n" "$PWD" >> audio_concat.txt


          # Combine voice
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i audio_concat.txt \
            -c:a pcm_s16le \
            voice.wav


          test -s voice.wav


          printf '%s\n' \
            'मम्मी, आज मैंने स्कूल में एक राज़ सीखा!' \
            'अच्छा? कैसा राज़?' \
            'होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!' \
            > script.txt


          echo "Hindi voice created successfully."


      # ============================================================
      # 5. CREATE SCENE VIDEOS
      # ============================================================
      - name: Create Scene 1 video
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene1.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -movflags +faststart \
            scene1.mp4

          test -s scene1.mp4


      - name: Create Scene 2 video
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene2.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0010,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -movflags +faststart \
            scene2.mp4

          test -s scene2.mp4


      - name: Create Scene 3 video
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene3.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -movflags +faststart \
            scene3.mp4

          test -s scene3.mp4


      # ============================================================
      # 6. JOIN SCENES
      # ============================================================
      - name: Join scenes
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -i scene1.mp4 \
            -i scene2.mp4 \
            -i scene3.mp4 \
            -filter_complex "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v]" \
            -map "[v]" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            silent_video.mp4

          test -s silent_video.mp4


      # ============================================================
      # 7. ADD HINDI VOICE
      # ============================================================
      - name: Add Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          # Keep the video at 9 seconds and guarantee that the narration is
          # present from the beginning, padded if short, and never runs past it.
          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -af "aresample=44100,volume=1.5,apad=pad_dur=9,atrim=start=0:duration=9" \
            -t 9 \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            final_toddler_short.mp4

          test -s final_toddler_short.mp4

          echo "Final video created successfully."


      # ============================================================
      # 8. VERIFY FINAL VIDEO
      # ============================================================
      - name: Verify final video
        shell: bash
        run: |
          set -euo pipefail

          test -s final_toddler_short.mp4


          width="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"

          height="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"

          video_codec="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"

          audio_codec="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"

          duration="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"

          audio_duration="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              final_toddler_short.mp4
          )"

          # Detect a missing or completely silent audio track.
          audio_stats="$(ffmpeg -hide_banner -i final_toddler_short.mp4 -map 0:a:0 -af volumedetect -f null - 2>&1 || true)"
          mean_volume="$(printf '%s\\n' "$audio_stats" | sed -n 's/.*mean_volume: \\([-0-9.]*\\) dB.*/\\1/p' | tail -n 1)"
          max_volume="$(printf '%s\\n' "$audio_stats" | sed -n 's/.*max_volume: \\([-0-9.]*\\) dB.*/\\1/p' | tail -n 1)"


          echo "=========================================="
          echo "FINAL VIDEO CHECK"
          echo "=========================================="
          echo "Resolution: ${width}x${height}"
          echo "Video codec: ${video_codec}"
          echo "Audio codec: ${audio_codec}"
          echo "Audio duration: ${audio_duration:-unknown} seconds"
          echo "Audio mean volume: ${mean_volume:-unknown} dB"
          echo "Audio peak volume: ${max_volume:-unknown} dB"
          echo "Duration: ${duration} seconds"
          echo "=========================================="


          if [ "$width" != "1080" ]; then
            echo "::error::Wrong video width: $width"
            exit 1
          fi


          if [ "$height" != "1920" ]; then
            echo "::error::Wrong video height: $height"
            exit 1
          fi


          if [ "$video_codec" != "h264" ]; then
            echo "::error::Wrong video codec: $video_codec"
            exit 1
          fi


          if [ "$audio_codec" != "aac" ]; then
            echo "::error::Wrong audio codec: $audio_codec"
            exit 1
          fi

          if [ -z "$audio_duration" ] || ! awk -v d="$audio_duration" 'BEGIN { exit !(d > 0.5) }'; then
            echo "::error::Audio stream is missing or too short."
            exit 1
          fi

          if [ -z "$mean_volume" ] || [ "$mean_volume" = "-inf" ]; then
            echo "::error::Audio is silent or could not be measured."
            exit 1
          fi

          if ! awk -v v="$mean_volume" 'BEGIN { exit !(v > -45) }'; then
            echo "::error::Audio is too quiet (mean volume: $mean_volume dB)."
            exit 1
          fi


          awk -v d="$duration" '
            BEGIN {
              if (d >= 8.8 && d <= 9.2) {
                exit 0
              }

              exit 1
            }
          '


          echo "VIDEO VALIDATION PASSED."


      # ============================================================
      # 9. CREATE YOUTUBE METADATA
      # ============================================================
      - name: Create YouTube metadata
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            '{' \
            '  "title": "जब बच्चे ने होमवर्क का राज़ बताया 😂",' \
            '  "description": "एक छोटे बच्चे का मासूम लेकिन मज़ेदार जवाब 😂\n\n#shorts #funny #comedy #hindi #kids",' \
            '  "language": "Hindi",' \
            '  "format": "YouTube Shorts",' \
            '  "aspect_ratio": "9:16",' \
            '  "duration_seconds": 9,' \
            '  "captions": false,' \
            '  "visual_style": "photorealistic cinematic",' \
            '  "image_model": "Cloudflare FLUX.1 Schnell"' \
            '}' \
            > youtube_metadata.json


          jq empty youtube_metadata.json


          echo "YouTube metadata created and validated."


      # ============================================================
      # 10. PREPARE ARTIFACT
      # ===============================================
