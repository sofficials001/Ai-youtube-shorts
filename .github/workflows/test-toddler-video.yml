name: AI YouTube Shorts

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy edge-tts google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Create working directories
        run: |
          mkdir -p output scenes

      # ---------------------------------------------------------
      # 1. GENERATE IMAGES WITH CLOUDFLARE WORKERS AI
      # ---------------------------------------------------------
      - name: Generate AI images
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_images.py <<'PY'
          import os
          import base64
          import requests
          from PIL import Image
          from io import BytesIO

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/ai/run/@cf/black-forest-labs/FLUX.1-schnell"
          )

          prompts = [
              """
              A cute small white rabbit sitting in a colorful village garden,
              warm morning sunlight, flowers, soft cinematic lighting,
              adorable 3D animated movie style, highly detailed,
              vertical composition, no text, no watermark
              """,

              """
              The same cute white rabbit helping a tiny lost bird in a
              beautiful colorful forest, emotional friendly moment,
              warm cinematic lighting, adorable 3D animated movie style,
              highly detailed, vertical composition, no text, no watermark
              """,

              """
              The same cute white rabbit and the tiny bird happily returning
              to the village together at sunset, beautiful glowing sky,
              heartwarming ending, adorable 3D animated movie style,
              highly detailed, vertical composition, no text, no watermark
              """
          ]

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json"
          }

          for index, prompt in enumerate(prompts, start=1):
              print(f"Generating scene {index}...")

              response = requests.post(
                  URL,
                  headers=headers,
                  json={"prompt": prompt},
                  timeout=180
              )

              print("HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text[:2000])
                  raise RuntimeError(
                      f"Cloudflare image generation failed for scene {index}"
                  )

              image_bytes = None
              content_type = response.headers.get("content-type", "")

              # Some responses may return the image directly.
              if content_type.startswith("image/"):
                  image_bytes = response.content

              # Others return JSON containing base64 image data.
              else:
                  data = response.json()
                  result = data.get("result")

                  if isinstance(result, dict):
                      image_data = result.get("image")
                  else:
                      image_data = result

                  if not image_data:
                      raise RuntimeError(
                          f"No image data returned for scene {index}: {data}"
                      )

                  if image_data.startswith("data:image"):
                      image_data = image_data.split(",", 1)[1]

                  image_bytes = base64.b64decode(image_data)

              # Validate image.
              image = Image.open(BytesIO(image_bytes))
              image.load()

              path = f"scenes/scene{index}.png"
              image.save(path, "PNG")

              print(
                  f"Saved {path}: "
                  f"{image.width}x{image.height}, "
                  f"{len(image_bytes)} bytes"
              )

          print("All scenes generated successfully.")
          PY

          python generate_images.py

      # ---------------------------------------------------------
      # 2. GENERATE HINDI NARRATION
      # ---------------------------------------------------------
      - name: Generate narration
        run: |
          cat > generate_voice.py <<'PY'
          import asyncio
          import edge_tts

          TEXT = """
          एक छोटे से गाँव में एक प्यारा सा खरगोश रहता था।
          एक दिन उसे जंगल में एक छोटा सा खोया हुआ पक्षी मिला।
          खरगोश ने उसकी मदद की और उसे सुरक्षित घर पहुँचा दिया।
          उस दिन दोनों बहुत अच्छे दोस्त बन गए।
          """

          VOICE = "hi-IN-SwaraNeural"
          OUTPUT = "narration.mp3"

          async def main():
              communicate = edge_tts.Communicate(
                  TEXT,
                  VOICE,
                  rate="+0%",
                  volume="+0%"
              )
              await communicate.save(OUTPUT)

          asyncio.run(main())

          with open(OUTPUT, "rb") as f:
              data = f.read()

          if len(data) < 1000:
              raise RuntimeError("Narration file is unexpectedly small.")

          print(f"Narration created: {len(data)} bytes")
          PY

          python generate_voice.py

      # ---------------------------------------------------------
      # 3. CREATE 3 VIDEO SEGMENTS
      # ---------------------------------------------------------
      - name: Create video segments
        run: |
          for i in 1 2 3; do
            ffmpeg -y \
              -loop 1 \
              -i "scenes/scene${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
              -t 3 \
              -r 30 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              "segment${i}.mp4"
          done

      # ---------------------------------------------------------
      # 4. CONCATENATE THE SEGMENTS
      # ---------------------------------------------------------
      - name: Join video segments
        run: |
          cat > concat.txt <<'EOF'
          file 'segment1.mp4'
          file 'segment2.mp4'
          file 'segment3.mp4'
          EOF

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            silent_video.mp4

      # ---------------------------------------------------------
      # 5. ADD NARRATION
      # ---------------------------------------------------------
      - name: Add narration
        run: |
          ffmpeg -y \
            -i silent_video.mp4 \
            -i narration.mp3 \
            -filter_complex "[1:a]aresample=48000,apad,atrim=0:9[a]" \
            -map 0:v:0 \
            -map "[a]" \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -t 9 \
            output/final_short.mp4

      # ---------------------------------------------------------
      # 6. VERIFY VIDEO
      # ---------------------------------------------------------
      - name: Verify final video
        run: |
          python - <<'PY'
          import json
          import subprocess
          import numpy as np

          video = "output/final_short.mp4"

          probe = subprocess.check_output([
              "ffprobe",
              "-v", "error",
              "-show_entries",
              "format=duration",
              "-show_streams",
              "-of", "json",
              video
          ])

          data = json.loads(probe)

          duration = float(data["format"]["duration"])

          streams = data["streams"]

          video_stream = next(
              s for s in streams if s["codec_type"] == "video"
          )

          audio_stream = next(
              s for s in streams if s["codec_type"] == "audio"
          )

          print("Duration:", duration)
          print("Video:", video_stream["width"], "x", video_stream["height"])
          print("Video codec:", video_stream["codec_name"])
          print("Audio codec:", audio_stream["codec_name"])

          if video_stream["width"] != 1080:
              raise RuntimeError("Incorrect video width.")

          if video_stream["height"] != 1920:
              raise RuntimeError("Incorrect video height.")

          if duration < 8.5 or duration > 9.5:
              raise RuntimeError("Unexpected video duration.")

          if video_stream["codec_name"] != "h264":
              raise RuntimeError("Video is not H.264.")

          if audio_stream["codec_name"] != "aac":
              raise RuntimeError("Audio is not AAC.")

          # Decode audio and check that it is not silent.
          pcm = subprocess.check_output([
              "ffmpeg",
              "-v", "error",
              "-i", video,
              "-map", "0:a:0",
              "-f", "s16le",
              "-ac", "1",
              "-ar", "16000",
              "pipe:1"
          ])

          samples = np.frombuffer(pcm, dtype=np.int16).astype(np.float32)

          if samples.size == 0:
              raise RuntimeError("No audio samples found.")

          rms = float(np.sqrt(np.mean(samples ** 2)))

          print("Audio RMS:", rms)

          if rms < 100:
              raise RuntimeError("Audio appears to be silent.")

          print("VIDEO VERIFICATION PASSED")
          PY

      # ---------------------------------------------------------
      # 7. YOUTUBE UPLOAD
      # ---------------------------------------------------------
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          SCOPES = [
              "https://www.googleapis.com/auth/youtube.upload"
          ]

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=SCOPES
          )

          credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          request_body = {
              "snippet": {
                  "title": "प्यारा खरगोश और उसका नया दोस्त 🐰 #Shorts",
                  "description": (
                      "एक प्यारे खरगोश और छोटे पक्षी की दिल छू लेने वाली कहानी।\n\n"
                      "#Shorts #HindiStory #Rabbit #AI"
                  ),
                  "tags": [
                      "shorts",
                      "hindi story",
                      "rabbit",
                      "kids story",
                      "AI story"
                  ],
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": True
              }
          }

          media = MediaFileUpload(
              "output/final_short.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=1024 * 1024
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=request_body,
              media_body=media
          )

          print("Uploading to YouTube...")

          response = None

          while response is None:
              status, response = request.next_chunk()

              if status:
                  print(
                      f"Upload progress: "
                      f"{int(status.progress() * 100)}%"
                  )

          video_id = response["id"]

          print("YOUTUBE UPLOAD SUCCESSFUL")
          print("Video ID:", video_id)
          print(
              "URL:",
              f"https://www.youtube.com/watch?v={video_id}"
          )
          PY

          python upload_youtube.py

      # ---------------------------------------------------------
      # 8. SAVE VIDEO AS GITHUB ARTIFACT
      # ---------------------------------------------------------
      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-short
          path: output/final_short.mp4
          if-no-files-found: error
