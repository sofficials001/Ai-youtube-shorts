name: AI YouTube Shorts

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. FFMPEG
      # =========================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # =========================================================
      # 4. PYTHON PACKAGES
      # =========================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            pillow \
            numpy \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # =========================================================
      # 5. CREATE DIRECTORIES
      # =========================================================
      - name: Create working directories
        run: |
          mkdir -p scenes
          mkdir -p output

      # =========================================================
      # 6. GENERATE AI IMAGES
      # =========================================================
      - name: Generate AI images
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_images.py <<'PY'
          import os
          import base64
          import requests
          from io import BytesIO
          from PIL import Image

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          MODEL = "@cf/black-forest-labs/flux-1-schnell"

          URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/ai/run/{MODEL}"
          )

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json",
          }

          PROMPTS = [
              """
              A cute small white rabbit sitting in a beautiful colorful
              village garden, warm morning sunlight, flowers everywhere,
              adorable 3D animated movie style, cinematic lighting,
              highly detailed, vertical composition, no text,
              no watermark
              """,

              """
              The same cute small white rabbit helping a tiny lost bird
              in a beautiful colorful forest, emotional friendly moment,
              warm cinematic lighting, adorable 3D animated movie style,
              highly detailed, vertical composition, no text,
              no watermark
              """,

              """
              The same cute white rabbit and the tiny bird happily
              returning to the village together at sunset, beautiful
              glowing sky, heartwarming ending, adorable 3D animated
              movie style, highly detailed, vertical composition,
              no text, no watermark
              """
          ]

          for index, prompt in enumerate(PROMPTS, start=1):

              print(f"Generating scene {index}...")

              payload = {
                  "prompt": " ".join(prompt.split()),
                  "steps": 4
              }

              response = requests.post(
                  URL,
                  headers=HEADERS,
                  json=payload,
                  timeout=180
              )

              print("Cloudflare HTTP status:", response.status_code)

              if response.status_code != 200:
                  print("Cloudflare response:")
                  print(response.text[:4000])
                  raise RuntimeError(
                      f"Cloudflare image generation failed for scene {index}"
                  )

              try:
                  data = response.json()
              except Exception:
                  print("Response was not valid JSON:")
                  print(response.text[:4000])
                  raise

              if not data.get("success"):
                  print("Cloudflare reported failure:")
                  print(data)
                  raise RuntimeError(
                      f"Cloudflare returned success=false for scene {index}"
                  )

              result = data.get("result")

              if not isinstance(result, dict):
                  print("Unexpected result:")
                  print(data)
                  raise RuntimeError(
                      f"Unexpected Cloudflare result for scene {index}"
                  )

              image_b64 = result.get("image")

              if not image_b64:
                  print("No image field returned.")
                  print(data)
                  raise RuntimeError(
                      f"No image returned for scene {index}"
                  )

              try:
                  image_bytes = base64.b64decode(
                      image_b64,
                      validate=True
                  )
              except Exception as exc:
                  raise RuntimeError(
                      f"Could not decode Cloudflare image for scene {index}"
                  ) from exc

              try:
                  image = Image.open(BytesIO(image_bytes))
                  image.load()
              except Exception as exc:
                  raise RuntimeError(
                      f"Cloudflare returned invalid image data for scene {index}"
                  ) from exc

              output_path = f"scenes/scene{index}.png"

              image.save(
                  output_path,
                  "PNG"
              )

              print(
                  f"Saved {output_path} | "
                  f"{image.width}x{image.height} | "
                  f"{len(image_bytes)} bytes"
              )

          print("All 3 AI images generated successfully.")
          PY

          python generate_images.py

      # =========================================================
      # 7. GENERATE HINDI VOICE
      # =========================================================
      - name: Generate narration
        run: |
          cat > generate_voice.py <<'PY'
          import asyncio
          import os
          import edge_tts

          TEXT = """
          एक छोटे से गाँव में एक प्यारा सा खरगोश रहता था।
          एक दिन उसे जंगल में एक छोटा सा खोया हुआ पक्षी मिला।
          खरगोश ने उसकी मदद की और उसे सुरक्षित घर पहुँचा दिया।
          उस दिन दोनों बहुत अच्छे दोस्त बन गए।
          """

          VOICE = "hi-IN-SwaraNeural"
          OUTPUT = "narration.mp3"

          async def main():
              communicator = edge_tts.Communicate(
                  TEXT.strip(),
                  VOICE,
                  rate="+0%",
                  volume="+0%"
              )

              await communicator.save(OUTPUT)

          asyncio.run(main())

          if not os.path.exists(OUTPUT):
              raise RuntimeError("Narration file was not created.")

          size = os.path.getsize(OUTPUT)

          print(f"Narration size: {size} bytes")

          if size < 1000:
              raise RuntimeError(
                  "Narration file is unexpectedly small."
              )

          print("Narration generated successfully.")
          PY

          python generate_voice.py

      # =========================================================
      # 8. CREATE VIDEO SEGMENTS
      # =========================================================
      - name: Create video segments
        run: |
          for i in 1 2 3
          do
            ffmpeg -y \
              -loop 1 \
              -i "scenes/scene${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
              -t 3 \
              -r 30 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              "segment${i}.mp4"
          done

          echo "Video segments created."

      # =========================================================
      # 9. JOIN VIDEO SEGMENTS
      # =========================================================
      - name: Join video segments
        run: |
          cat > concat.txt <<'EOF'
          file 'segment1.mp4'
          file 'segment2.mp4'
          file 'segment3.mp4'
          EOF

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            silent_video.mp4

          echo "Video segments joined."

      # =========================================================
      # 10. ADD NARRATION
      # =========================================================
      - name: Add narration
        run: |
          ffmpeg -y \
            -i silent_video.mp4 \
            -i narration.mp3 \
            -filter_complex "[1:a]aresample=48000,apad,atrim=duration=9[a]" \
            -map 0:v:0 \
            -map "[a]" \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -t 9 \
            -movflags +faststart \
            output/final_short.mp4

          echo "Final video created."

      # =========================================================
      # 11. VERIFY VIDEO
      # =========================================================
      - name: Verify final video
        run: |
          python - <<'PY'
          import json
          import subprocess
          import numpy as np

          VIDEO = "output/final_short.mp4"

          probe_command = [
              "ffprobe",
              "-v",
              "error",
              "-show_entries",
              "format=duration",
              "-show_streams",
              "-of",
              "json",
              VIDEO
          ]

          result = subprocess.check_output(
              probe_command
          )

          data = json.loads(result)

          duration = float(
              data["format"]["duration"]
          )

          streams = data["streams"]

          video_streams = [
              s for s in streams
              if s.get("codec_type") == "video"
          ]

          audio_streams = [
              s for s in streams
              if s.get("codec_type") == "audio"
          ]

          if not video_streams:
              raise RuntimeError("No video stream found.")

          if not audio_streams:
              raise RuntimeError("No audio stream found.")

          video = video_streams[0]
          audio = audio_streams[0]

          width = int(video["width"])
          height = int(video["height"])
          video_codec = video["codec_name"]
          audio_codec = audio["codec_name"]

          print("Duration:", duration)
          print("Resolution:", width, "x", height)
          print("Video codec:", video_codec)
          print("Audio codec:", audio_codec)

          if width != 1080:
              raise RuntimeError(
                  f"Wrong width: {width}"
              )

          if height != 1920:
              raise RuntimeError(
                  f"Wrong height: {height}"
              )

          if duration < 8.5 or duration > 9.5:
              raise RuntimeError(
                  f"Unexpected duration: {duration}"
              )

          if video_codec != "h264":
              raise RuntimeError(
                  f"Wrong video codec: {video_codec}"
              )

          if audio_codec != "aac":
              raise RuntimeError(
                  f"Wrong audio codec: {audio_codec}"
              )

          # Decode the audio and check whether it contains actual sound.
          audio_command = [
              "ffmpeg",
              "-v",
              "error",
              "-i",
              VIDEO,
              "-map",
              "0:a:0",
              "-f",
              "s16le",
              "-ac",
              "1",
              "-ar",
              "16000",
              "pipe:1"
          ]

          pcm = subprocess.check_output(
              audio_command
          )

          samples = np.frombuffer(
              pcm,
              dtype=np.int16
          ).astype(np.float32)

          if samples.size == 0:
              raise RuntimeError(
                  "No audio samples were found."
              )

          rms = float(
              np.sqrt(np.mean(samples ** 2))
          )

          print("Audio RMS:", rms)

          if rms < 100:
              raise RuntimeError(
                  "Audio appears to be silent."
              )

          print("")
          print("VIDEO VERIFICATION PASSED")
          PY

      # =========================================================
      # 12. UPLOAD TO YOUTUBE
      # =========================================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          if not CLIENT_ID:
              raise RuntimeError(
                  "YOUTUBE_CLIENT_ID is missing."
              )

          if not CLIENT_SECRET:
              raise RuntimeError(
                  "YOUTUBE_CLIENT_SECRET is missing."
              )

          if not REFRESH_TOKEN:
              raise RuntimeError(
                  "YOUTUBE_REFRESH_TOKEN is missing."
              )

          SCOPES = [
              "https://www.googleapis.com/auth/youtube.upload"
          ]

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=SCOPES
          )

          print("Refreshing YouTube access token...")

          credentials.refresh(
              Request()
          )

          print("Authentication successful.")

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          request_body = {
              "snippet": {
                  "title": "प्यारा खरगोश और उसका नया दोस्त 🐰 #Shorts",
                  "description": (
                      "एक प्यारे खरगोश और छोटे पक्षी की "
                      "दिल छू लेने वाली कहानी।\n\n"
                      "#Shorts #HindiStory #Rabbit #AI"
                  ),
                  "tags": [
                      "shorts",
                      "hindi story",
                      "rabbit",
                      "kids story",
                      "AI story"
                  ],
                  "categoryId": "22"
              },

              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": True
              }
          }

          media = MediaFileUpload(
              "output/final_short.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=1024 * 1024
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=request_body,
              media_body=media
          )

          print("Uploading video to YouTube...")

          response = None

          while response is None:

              status, response = request.next_chunk()

              if status:
                  progress = int(
                      status.progress() * 100
                  )

                  print(
                      f"Upload progress: {progress}%"
                  )

          if not response or "id" not in response:
              raise RuntimeError(
                  f"YouTube upload returned an unexpected response: "
                  f"{response}"
              )

          video_id = response["id"]

          print("")
          print("========================================")
          print("YOUTUBE UPLOAD SUCCESSFUL")
          print("========================================")
          print("Video ID:", video_id)
          print(
              "Video URL:",
              f"https://www.youtube.com/watch?v={video_id}"
          )
          print("Privacy: PRIVATE")
          print("========================================")
          PY

          python upload_youtube.py

      # =========================================================
      # 13. SAVE VIDEO AS GITHUB ARTIFACT
      # =========================================================
      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-short
          path: output/final_short.mp4
          if-no-files-found: error
