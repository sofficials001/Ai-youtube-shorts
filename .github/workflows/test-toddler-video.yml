name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-venv

          python3 -m venv .venv

          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install edge-tts

          mkdir -p artifacts

          echo "Tools installed successfully."


      # ============================================================
      # 2. CHECK CLOUDFLARE SECRETS
      # ============================================================
      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

          echo "Cloudflare configuration found."


      # ============================================================
      # 3. GENERATE TODDLER SCENES
      # ============================================================
      - name: Generate toddler scenes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cat > generate_scenes.py <<'PY'
          import base64
          import json
          import os
          import shutil
          import urllib.error
          import urllib.request
          from pathlib import Path

          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          API_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]

          ENDPOINT = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + ACCOUNT_ID
              + "/ai/run/@cf/black-forest-labs/flux-1-schnell"
          )

          CHARACTER = (
              "wholesome family friendly fictional Indian toddler boy, "
              "about three years old, small chubby body, round cheeks, "
              "large expressive brown eyes, short black hair, "
              "cute innocent face, yellow T-shirt, blue shorts"
          )

          SCENES = [
              (
                  "scene1.png",
                  CHARACTER
                  + ", happy smile, standing on a sunny Indian residential "
                  + "street, warm daylight, realistic professional "
                  + "photography, cinematic portrait"
              ),
              (
                  "scene2.png",
                  CHARACTER
                  + ", funny confused expression, looking toward a family "
                  + "member, Indian home entrance, warm daylight, realistic "
                  + "professional photography, cinematic close-up"
              ),
              (
                  "scene3.png",
                  CHARACTER
                  + ", playful happy expression, smiling after saying "
                  + "something funny, Indian neighborhood, warm daylight, "
                  + "realistic professional photography, cinematic portrait"
              )
          ]

          FALLBACK = (
              "wholesome family friendly photograph of a fictional young "
              "Indian child, cute round face, large brown eyes, short black "
              "hair, colorful casual clothing, cheerful smile, sunny "
              "neighborhood, natural daylight, realistic professional "
              "photography"
          )


          def request_image(prompt):

              payload = json.dumps(
                  {
                      "prompt": prompt,
                      "steps": 4
                  },
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  ENDPOINT,
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + API_TOKEN,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      raw = response.read()

              except urllib.error.HTTPError as error:

                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      "Cloudflare HTTP "
                      + str(error.code)
                      + ": "
                      + body
                  )

              except Exception as error:

                  raise RuntimeError(
                      "Cloudflare request failed: "
                      + str(error)
                  )

              try:

                  data = json.loads(
                      raw.decode("utf-8")
                  )

              except Exception as error:

                  raise RuntimeError(
                      "Cloudflare returned invalid JSON: "
                      + str(error)
                  )

              if not data.get("success", False):

                  raise RuntimeError(
                      "Cloudflare error: "
                      + json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )

              result = data.get("result")

              if not isinstance(result, dict):

                  raise RuntimeError(
                      "Cloudflare response has no result object."
                  )

              encoded = result.get("image")

              if not isinstance(encoded, str) or not encoded:

                  raise RuntimeError(
                      "Cloudflare response contains no image."
                  )

              try:

                  image_bytes = base64.b64decode(
                      encoded,
                      validate=True
                  )

              except Exception as error:

                  raise RuntimeError(
                      "Invalid Base64 image: "
                      + str(error)
                  )

              if len(image_bytes) < 1000:

                  raise RuntimeError(
                      "Generated image is unexpectedly small."
                  )

              return image_bytes


          def save_image(filename, image_bytes):

              Path(filename).write_bytes(
                  image_bytes
              )

              size = Path(filename).stat().st_size

              if size == 0:

                  raise RuntimeError(
                      "Created empty image: "
                      + filename
                  )

              print(
                  filename
                  + " created ("
                  + str(size)
                  + " bytes)"
              )


          previous = None


          for filename, prompt in SCENES:

              print()
              print(
                  "=========================================="
              )
              print(
                  "GENERATING "
                  + filename
              )
              print(
                  "=========================================="
              )

              # ----------------------------------------------------
              # PRIMARY PROMPT
              # ----------------------------------------------------

              try:

                  image = request_image(
                      prompt
                  )

                  save_image(
                      filename,
                      image
                  )

                  previous = filename

                  continue

              except Exception as error:

                  print(
                      "Primary prompt failed:"
                  )

                  print(
                      str(error)
                  )


              # ----------------------------------------------------
              # FALLBACK PROMPT
              # ----------------------------------------------------

              try:

                  print(
                      "Trying safe fallback..."
                  )

                  image = request_image(
                      FALLBACK
                  )

                  save_image(
                      filename,
                      image
                  )

                  previous = filename

                  continue

              except Exception as error:

                  print(
                      "Fallback failed:"
                  )

                  print(
                      str(error)
                  )


              # ----------------------------------------------------
              # REUSE PREVIOUS IMAGE
              # ----------------------------------------------------

              if previous is None:

                  raise SystemExit(
                      "Unable to generate the first scene."
                  )

              print(
                  "Reusing "
                  + previous
                  + " for "
                  + filename
              )

              shutil.copyfile(
                  previous,
                  filename
              )


          # --------------------------------------------------------
          # SAVE PROMPTS
          # --------------------------------------------------------

          with open(
              "scene_prompts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for index, (_, prompt) in enumerate(
                  SCENES,
                  start=1
              ):

                  file.write(
                      "SCENE "
                      + str(index)
                      + "\n"
                  )

                  file.write(
                      prompt
                      + "\n\n"
                  )


          # --------------------------------------------------------
          # FINAL FILE CHECK
          # --------------------------------------------------------

          for filename, _ in SCENES:

              if not Path(filename).is_file():

                  raise SystemExit(
                      "Missing generated file: "
                      + filename
                  )

          print()
          print(
              "All three toddler scenes are ready."
          )

          PY

          python3 generate_scenes.py


      # ============================================================
      # 4. CREATE HINDI VOICE
      # ============================================================
      - name: Create Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          cat > child1.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          EOF

          cat > adult.txt <<'EOF'
          अच्छा? कैसा राज़?
          EOF

          cat > child2.txt <<'EOF'
          होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF


          # Child-style delivery
          # Uses Swara with higher pitch/rate.
          .venv/bin/edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate "+8%" \
            --pitch "+15Hz" \
            --file child1.txt \
            --write-media child1.mp3


          # Adult response
          .venv/bin/edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --rate "+3%" \
            --pitch "+0Hz" \
            --file adult.txt \
            --write-media adult.mp3


          # Punchline
          .venv/bin/edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate "+8%" \
            --pitch "+15Hz" \
            --file child2.txt \
            --write-media child2.mp3


          test -s child1.mp3
          test -s adult.mp3
          test -s child2.mp3


          # Convert MP3 to WAV
          ffmpeg -y \
            -i child1.mp3 \
            -ar 44100 \
            -ac 2 \
            child1.wav


          ffmpeg -y \
            -i adult.mp3 \
            -ar 44100 \
            -ac 2 \
            adult.wav


          ffmpeg -y \
            -i child2.mp3 \
            -ar 44100 \
            -ac 2 \
            child2.wav


          # Short dialogue pauses
          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=44100:cl=stereo" \
            -t 0.12 \
            pause.wav


          {
            echo "file '$PWD/child1.wav'"
            echo "file '$PWD/pause.wav'"
            echo "file '$PWD/adult.wav'"
            echo "file '$PWD/pause.wav'"
            echo "file '$PWD/child2.wav'"
          } > audio_concat.txt


          # Combine dialogue
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i audio_concat.txt \
            -c:a pcm_s16le \
            voice.wav


          test -s voice.wav

          cat > script.txt <<'EOF'
          बच्चा: मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          मम्मी: अच्छा? कैसा राज़?
          बच्चा: होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF


          echo "Hindi voice created successfully."


      # ============================================================
      # 5. CREATE THREE VERTICAL SCENE VIDEOS
      # ============================================================
      - name: Create scene videos
        shell: bash
        run: |
          set -euo pipefail

          for i in 1 2 3
          do

            case "$i" in

              1)
                ZOOM="min(zoom+0.0008,1.08)"
                ;;

              2)
                ZOOM="min(zoom+0.0010,1.10)"
                ;;

              3)
                ZOOM="min(zoom+0.0012,1.12)"
                ;;

            esac


            ffmpeg -y \
              -loop 1 \
              -framerate 30 \
              -i "scene${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='${ZOOM}':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
              -frames:v 90 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -r 30 \
              "scene${i}.mp4"


            test -s "scene${i}.mp4"

          done


          echo "All scene videos created."


      # ============================================================
      # 6. JOIN SCENES
      # ============================================================
      - name: Join scenes
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -i scene1.mp4 \
            -i scene2.mp4 \
            -i scene3.mp4 \
            -filter_complex \
              "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v]" \
            -map "[v]" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            silent_video.mp4


          test -s silent_video.mp4


      # ============================================================
      # 7. ADD HINDI VOICE
      # ============================================================
      - name: Add Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -af "apad=whole_dur=9" \
            -t 9 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            final_toddler_short.mp4


          test -s final_toddler_short.mp4

          echo "Final video created."


      # ============================================================
      # 8. VERIFY FINAL VIDEO
      # ============================================================
      - name: Verify final video
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          filename = Path(
              "final_toddler_short.mp4"
          )


          if not filename.is_file():

              raise SystemExit(
                  "Final video is missing."
              )


          if filename.stat().st_size == 0:

              raise SystemExit(
                  "Final video is empty."
              )


          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-show_entries",
                  "stream=codec_type,codec_name,width,height",
                  "-of",
                  "json",
                  str(filename)
              ],
              capture_output=True,
              text=True,
              check=True
          )


          info = json.loads(
              result.stdout
          )


          streams = info.get(
              "streams",
              []
          )


          video = next(
              (
                  stream
                  for stream in streams
                  if stream.get("codec_type") == "video"
              ),
              None
          )


          audio = next(
              (
                  stream
                  for stream in streams
                  if stream.get("codec_type") == "audio"
              ),
              None
          )


          if video is None:

              raise SystemExit(
                  "Video stream is missing."
              )


          if audio is None:

              raise SystemExit(
                  "Audio stream is missing."
              )


          width = video.get("width")
          height = video.get("height")


          if width != 1080 or height != 1920:

              raise SystemExit(
                  "Wrong resolution: "
                  + str(width)
                  + "x"
                  + str(height)
              )


          duration = float(
              info["format"]["duration"]
          )


          if not 8.80 <= duration <= 9.20:

              raise SystemExit(
                  "Wrong duration: "
                  + str(duration)
              )


          print("================================")
          print("VIDEO VALIDATION PASSED")
          print("Resolution: 1080x1920")
          print(
              "Duration: "
              + str(round(duration, 2))
              + " seconds"
          )
          print(
              "Video codec: "
              + str(video.get("codec_name"))
          )
          print(
              "Audio codec: "
              + str(audio.get("codec_name"))
          )
          print("================================")

          PY


      # ============================================================
      # 9. CREATE YOUTUBE METADATA
      # ============================================================
      - name: Create YouTube metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          metadata = {
              "title": "जब बच्चे ने होमवर्क का राज़ बताया 😂",

              "description": (
                  "एक
