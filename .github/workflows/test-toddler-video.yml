
name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --break-system-packages requests edge-tts

      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          fi

          echo "Cloudflare configuration found"

      - name: Generate toddler scenes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import requests
          import sys

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]

          url = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{account}/ai/run/"
              "@cf/black-forest-labs/flux-1-schnell"
          )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          scenes = [
              {
                  "file": "scene1.png",
                  "prompt": (
                      "Wholesome family friendly cinematic photograph "
                      "of a fictional Indian toddler boy, around three "
                      "years old, round cheeks, large expressive brown "
                      "eyes, short black hair, innocent happy smile, "
                      "bright yellow T-shirt, blue shorts, standing "
                      "in a realistic Indian neighborhood street, "
                      "warm natural daylight, natural proportions, "
                      "professional photography, vertical composition"
                  )
              },
              {
                  "file": "scene2.png",
                  "prompt": (
                      "Wholesome family friendly cinematic close-up "
                      "photograph of the same fictional Indian toddler "
                      "boy, around three years old, round cheeks, large "
                      "brown eyes, short black hair, funny confused "
                      "facial expression, bright yellow T-shirt, "
                      "blue shorts, looking toward his mother at "
                      "a realistic Indian home entrance, warm daylight, "
                      "professional photography, vertical composition"
                  )
              },
              {
                  "file": "scene3.png",
                  "prompt": (
                      "Wholesome family friendly photograph of a "
                      "cheerful fictional Indian toddler boy, around "
                      "three years old, round cheeks, large brown eyes, "
                      "short black hair, smiling happily, wearing a "
                      "bright yellow T-shirt and blue shorts, playful "
                      "moment outdoors in an Indian neighborhood, "
                      "warm daylight, realistic photography, "
                      "professional camera, vertical composition"
                  )
              }
          ]

          fallback = (
              "Wholesome family friendly photograph of a young "
              "fictional Indian child smiling outdoors, colorful "
              "casual clothing, sunny neighborhood, natural daylight, "
              "natural proportions, professional photography, "
              "vertical composition"
          )

          def generate(prompt):
              response = requests.post(
                  url,
                  headers=headers,
                  json={"prompt": prompt, "steps": 4},
                  timeout=180
              )

              try:
                  data = response.json()
              except ValueError:
                  raise RuntimeError(
                      f"Cloudflare returned invalid JSON: "
                      f"{response.status_code}"
                  )

              if not response.ok or not data.get("success"):
                  raise RuntimeError(
                      json.dumps(data.get("errors", data), ensure_ascii=False)
                  )

              encoded = data.get("result", {}).get("image")
              if not encoded:
                  raise RuntimeError("Cloudflare returned no image")

              return base64.b64decode(encoded, validate=True)

          for index, scene in enumerate(scenes, start=1):
              print(f"Generating Scene {index}...")

              try:
                  image = generate(scene["prompt"])
              except Exception as first_error:
                  print(f"Primary prompt failed: {first_error}")
                  print("Trying safe fallback prompt...")

                  try:
                      image = generate(fallback)
                  except Exception as fallback_error:
                      print(f"Fallback failed: {fallback_error}")
                      sys.exit(f"Scene {index} generation failed")

              if not image.startswith(b"\x89PNG\r\n\x1a\n"):
                  sys.exit(f"Scene {index} is not a valid PNG")

              with open(scene["file"], "wb") as output:
                  output.write(image)

              print(f"Scene {index} created successfully")

          print("All three scenes generated successfully")
          PY

      - name: Create Hindi voice
        run: |
          set -euo pipefail

          cat > script.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा।
          क्या राज़?
          होमवर्क छुपा दो तो टीचर खुद ढूंढने आ जाती हैं!
          EOF

          edge-tts \
            --voice hi-IN-MadhurNeural \
            --rate=+10% \
            --pitch=+10Hz \
            --file script.txt \
            --write-media voice.mp3

          test -s voice.mp3

          ffmpeg -y \
            -i voice.mp3 \
            -ar 44100 \
            -ac 2 \
            voice.wav

          test -s voice.wav
          echo "Hindi voice created successfully"

      - name: Create Scene 1 video
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene1.png \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=90:s=1080x1920:fps=30,format=yuv420p" \
            -frames:v 90 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            scene1.mp4

      - name: Create Scene 2 video
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene2.png \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.001,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=90:s=1080x1920:fps=30,format=yuv420p" \
            -frames:v 90 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            scene2.mp4

      - name: Create Scene 3 video
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene3.png \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=90:s=1080x1920:fps=30,format=yuv420p" \
            -frames:v 90 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            scene3.mp4

      - name: Join scenes
        run: |
          set -euo pipefail

          for file in scene1.mp4 scene2.mp4 scene3.mp4; do
            test -s "$file"
          done

          printf "file '%s/scene1.mp4'\n" "$PWD" > concat.txt
          printf "file '%s/scene2.mp4'\n" "$PWD" >> concat.txt
          printf "file '%s/scene3.mp4'\n" "$PWD" >> concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            silent_video.mp4

          test -s silent_video.mp4

      - name: Add Hindi voice
        run: |
          set -euo pipefail

          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -af "apad" \
            -c:a aac \
            -b:a 128k \
            -t 9 \
            -movflags +faststart \
            final_toddler_short.mp4

          test -s final_toddler_short.mp4
          echo "Final video created"

      - name: Verify final video
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries",
                  "stream=codec_type,codec_name,width,height",
                  "-show_entries", "format=duration",
                  "-of", "json",
                  "final_toddler_short.mp4"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          info = json.loads(result.stdout)
          streams = info.get("streams", [])
          video = next(
              (s for s in streams if s.get("codec_type") == "video"),
              None
          )
          audio = next(
              (s for s in streams if s.get("codec_type") == "audio"),
              None
          )

          if video is None:
              sys.exit("Video stream is missing")

          if audio is None:
              sys.exit("Audio stream is missing")

          width = video.get("width")
          height = video.get("height")
          duration = float(info["format"]["duration"])

          if width != 1080 or height != 1920:
              sys.exit(f"Wrong resolution: {width}x{height}")

          if not 8.0 <= duration <= 9.2:
              sys.exit(f"Wrong duration: {duration:.2f} seconds")

          if video.get("codec_name") != "h264":
              sys.exit("Video is not encoded as H.264")

          if audio.get("codec_name") != "aac":
              sys.exit("Audio is not encoded as AAC")

          print("==============================")
          print("VIDEO VALIDATION PASSED")
          print(f"Resolution: {width}x{height}")
          print(f"Duration: {duration:.2f} seconds")
          print(f"Video codec: {video['codec_name']}")
          print(f"Audio codec: {audio['codec_name']}")
          print("==============================")
          PY

      - name: Create YouTube metadata
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          metadata = {
              "title": "जब बच्चे ने होमवर्क का राज़ बताया 😂",
              "description": "एक छोटे बच्चे का मासूम लेकिन मज़ेदार जवाब 😂",
              "language": "Hindi",
              "format": "YouTube Shorts",
              "aspect_ratio": "9:16",
              "duration": "9 seconds",
              "captions": False,
              "visual_style": "photorealistic cinematic",
              "generation_model": "Cloudflare FLUX.1 Schnell"
          }

          with open(
              "youtube_metadata.json",
              "w",
              encoding="utf-8"
          ) as output:
              json.dump(
                  metadata,
                  output,
                  ensure_ascii=False,
                  indent=2
              )

          # Verify that the generated JSON is valid.
          with open("youtube_metadata.json", encoding="utf-8") as source:
              check = json.load(source)

          assert check["format"] == "YouTube Shorts"
          assert check["language"] == "Hindi"
          assert check["aspect_ratio"] == "9:16"

          print("YouTube metadata created and verified")
          PY

      - name: Prepare final package
        run: |
          set -euo pipefail

          files=(
            final_toddler_short.mp4
            script.txt
            voice.mp3
            voice.wav
            scene1.png
            scene2.png
            scene3.png
            scene1.mp4
            scene2.mp4
            scene3.mp4
            youtube_metadata.json
          )

          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty file: $file"
              exit 1
            fi
          done

          echo "All final package files are present"

      - name: Upload final video and files
        uses: actions/upload-artifact@v4
        with:
          name: toddler-video-test
          path: |
            final_toddler_short.mp4
            script.txt
            voice.mp3
            voice.wav
            scene1.png
            scene2.png
            scene3.png
            scene1.mp4
            scene2.mp4
            scene3.mp4
            youtube_metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          
