name: AI YouTube Shorts

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. FFMPEG + FONTS
      # ============================================================
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      # ============================================================
      # 4. PYTHON PACKAGES
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            pillow \
            numpy \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ============================================================
      # 5. DIRECTORIES
      # ============================================================
      - name: Create working directories
        run: |
          rm -rf scenes audio segments output
          rm -f story.json story.txt concat.txt
          mkdir -p scenes
          mkdir -p audio
          mkdir -p segments
          mkdir -p output

      # ============================================================
      # 6. GENERATE STORY
      # ============================================================
      - name: Generate AI story
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_story.py <<'PY'
          import ast
          import json
          import os
          import random
          import re
          import requests

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          MODEL = "@cf/meta/llama-3.2-3b-instruct"

          URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/ai/run/{MODEL}"
          )

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json",
          }

          THEMES = [
              "एक छोटे खरगोश और एक खोए हुए पक्षी की भावुक दोस्ती",
              "एक छोटा खरगोश जो तूफान से पहले अपने दोस्त को ढूंढने निकलता है",
              "एक छोटे खरगोश को जंगल में एक रहस्यमयी चिट्ठी मिलती है",
              "एक खरगोश अपने दोस्त के लिए एक मुश्किल फैसला लेता है",
              "एक छोटा खरगोश जंगल में किसी अनजान जानवर की मदद करता है",
              "एक खरगोश को लगता है कि उसका दोस्त उसे छोड़कर चला गया है लेकिन सच्चाई अलग होती है",
              "एक छोटा खरगोश अपने दोस्त को ढूंढने के लिए जंगल की यात्रा करता है",
              "एक खरगोश अपने डर को हराकर अपने दोस्त की मदद करता है",
          ]

          FALLBACK_STORY = {
              "title": "छोटे खरगोश ने आखिरी पल में क्या किया? 🐰",
              "description": (
                  "एक छोटे खरगोश की दिल छू लेने वाली कहानी, "
                  "जिसमें एक छोटी सी मदद बड़ी दोस्ती बन जाती है।"
              ),
              "tags": [
                  "shorts",
                  "hindi story",
                  "rabbit",
                  "emotional story",
                  "AI story"
              ],
              "scenes": [
                  {
                      "scene": 1,
                      "role": "HOOK",
                      "narration": (
                          "उसे जंगल में जो मिला, उसे देखकर "
                          "खरगोश बिल्कुल रुक गया!"
                      ),
                      "visual_prompt": (
                          "the rabbit suddenly discovering a tiny lost bird "
                          "under a large tree, surprised emotional expression"
                      )
                  },
                  {
                      "scene": 2,
                      "role": "SETUP",
                      "narration": (
                          "एक छोटा पक्षी रास्ता भूल गया था और "
                          "अपने घर तक नहीं पहुंच पा रहा था।"
                      ),
                      "visual_prompt": (
                          "the rabbit gently looking at a frightened tiny bird "
                          "in a peaceful forest clearing"
                      )
                  },
                  {
                      "scene": 3,
                      "role": "PROBLEM",
                      "narration": (
                          "खरगोश ने उसे घर पहुंचाने का फैसला किया, "
                          "लेकिन जंगल का रास्ता बहुत उलझा हुआ था।"
                      ),
                      "visual_prompt": (
                          "the rabbit and the tiny bird standing at a "
                          "confusing forest crossroads with multiple paths"
                      )
                  },
                  {
                      "scene": 4,
                      "role": "TENSION",
                      "narration": (
                          "शाम होने लगी और रास्ता और भी अंधेरा हो गया, "
                          "फिर खरगोश को एक छोटी सी रोशनी दिखाई दी।"
                      ),
                      "visual_prompt": (
                          "the rabbit carefully following a warm glowing "
                          "light through a peaceful forest at dusk"
                      )
                  },
                  {
                      "scene": 5,
                      "role": "CLIMAX",
                      "narration": (
                          "वही रोशनी पक्षी के घर का रास्ता थी। "
                          "आखिरकार दोनों वहां पहुंच गए।"
                      ),
                      "visual_prompt": (
                          "the rabbit happily guiding the tiny bird toward "
                          "a cozy nest glowing warmly at sunset"
                      )
                  },
                  {
                      "scene": 6,
                      "role": "ENDING_CTA",
                      "narration": (
                          "पक्षी ने अपने दोस्त को धन्यवाद दिया और दोनों "
                          "हमेशा के लिए अच्छे दोस्त बन गए। "
                          "ऐसी प्यारी कहानी पसंद है तो जुड़े रहना!"
                      ),
                      "visual_prompt": (
                          "the rabbit and tiny bird happily together near "
                          "the cozy nest under a beautiful sunset sky"
                      )
                  }
              ]
          }

          def clean_model_text(value):
              if not isinstance(value, str):
                  return value

              text = value.strip()

              # Remove markdown fences if the model adds them.
              text = re.sub(
                  r"^```(?:json|python)?\s*",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              return text.strip()

          def parse_story_value(value):
              """
              Handles:
              1. A normal dict.
              2. Valid JSON text.
              3. A Python dict representation using single quotes.
              4. JSON/Python object wrapped in extra text/fences.
              """

              if isinstance(value, dict):
                  return value

              if not isinstance(value, str):
                  raise ValueError(
                      f"Unexpected story value type: {type(value)}"
                  )

              text = clean_model_text(value)

              # First: strict JSON.
              try:
                  parsed = json.loads(text)

                  if isinstance(parsed, dict):
                      return parsed

              except json.JSONDecodeError:
                  pass

              # Second: Python literal representation.
              try:
                  parsed = ast.literal_eval(text)

                  if isinstance(parsed, dict):
                      return parsed

              except (ValueError, SyntaxError):
                  pass

              # Third: find the outer object.
              start = text.find("{")
              end = text.rfind("}")

              if start != -1 and end > start:
                  candidate = text[start:end + 1]

                  try:
                      parsed = json.loads(candidate)

                      if isinstance(parsed, dict):
                          return parsed

                  except json.JSONDecodeError:
                      pass

                  try:
                      parsed = ast.literal_eval(candidate)

                      if isinstance(parsed, dict):
                          return parsed

                  except (ValueError, SyntaxError):
                      pass

              raise ValueError(
                  "Could not parse AI story response."
              )

          def extract_story(data):
              result = data.get("result")

              if result is None:
                  raise ValueError(
                      "Cloudflare response contains no result."
                  )

              if isinstance(result, dict):

                  # Normal chat response.
                  if "response" in result:
                      response_value = result["response"]
                      return parse_story_value(response_value)

                  # Some responses may already be the story object.
                  if (
                      "title" in result
                      and "description" in result
                      and "tags" in result
                      and "scenes" in result
                  ):
                      return result

              return parse_story_value(result)

          def validate_story(story):

              if not isinstance(story, dict):
                  raise ValueError(
                      "Story is not a dictionary."
                  )

              required = [
                  "title",
                  "description",
                  "tags",
                  "scenes"
              ]

              for field in required:
                  if field not in story:
                      raise ValueError(
                          f"Missing top-level field: {field}"
                      )

              if not isinstance(story["scenes"], list):
                  raise ValueError(
                      "scenes must be a list."
                  )

              if len(story["scenes"]) != 6:
                  raise ValueError(
                      f"Expected 6 scenes, got "
                      f"{len(story['scenes'])}."
                  )

              roles = [
                  "HOOK",
                  "SETUP",
                  "PROBLEM",
                  "TENSION",
                  "CLIMAX",
                  "ENDING_CTA"
              ]

              fields = [
                  "scene",
                  "role",
                  "narration",
                  "visual_prompt"
              ]

              for index, scene in enumerate(
                  story["scenes"]
              ):

                  if not isinstance(scene, dict):
                      raise ValueError(
                          f"Scene {index + 1} is not an object."
                      )

                  for field in fields:
                      if field not in scene:
                          raise ValueError(
                              f"Scene {index + 1} missing "
                              f"{field}."
                          )

                  narration = str(
                      scene["narration"]
                  ).strip()

                  visual = str(
                      scene["visual_prompt"]
                  ).strip()

                  if not narration:
                      raise ValueError(
                          f"Scene {index + 1} has empty narration."
                      )

                  if not visual:
                      raise ValueError(
                          f"Scene {index + 1} has empty visual prompt."
                      )

                  scene["scene"] = index + 1
                  scene["role"] = roles[index]
                  scene["narration"] = narration
                  scene["visual_prompt"] = visual

              story["title"] = str(
                  story["title"]
              ).strip()

              story["description"] = str(
                  story["description"]
              ).strip()

              if not story["title"]:
                  raise ValueError(
                      "Story title is empty."
                  )

              if not story["description"]:
                  raise ValueError(
                      "Story description is empty."
                  )

              if not isinstance(
                  story["tags"],
                  list
              ):
                  story["tags"] = []

              story["tags"] = [
                  str(tag).strip()
                  for tag in story["tags"]
                  if str(tag).strip()
              ]

          def prepare_visual_prompts(story):

              character = (
                  "same main character in every scene: "
                  "a small cute white rabbit wearing a "
                  "small blue scarf, consistent face, "
                  "consistent body proportions"
              )

              global_rules = (
                  ", family-friendly, cinematic 3D animated "
                  "movie style, highly detailed, expressive "
                  "characters, beautiful lighting, vertical "
                  "composition, no text, no letters, no subtitles, "
                  "no watermark, no logo, no brand, non-graphic"
              )

              for scene in story["scenes"]:

                  scene["visual_prompt"] = (
                      character
                      + ", "
                      + scene["visual_prompt"].strip()
                      + global_rules
                  )

          def save_story(story):

              with open(
                  "story.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      story,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              with open(
                  "story.txt",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "TITLE:\n"
                      + story["title"]
                      + "\n\n"
                  )

                  f.write(
                      "DESCRIPTION:\n"
                      + story["description"]
                      + "\n\n"
                  )

                  f.write("TAGS:\n")

                  f.write(
                      ", ".join(story["tags"])
                      + "\n\n"
                  )

                  for scene in story["scenes"]:

                      f.write(
                          f"SCENE {scene['scene']} "
                          f"({scene['role']})\n"
                      )

                      f.write(
                          scene["narration"]
                          + "\n\n"
                      )

          system_prompt = """
          तुम Hindi YouTube Shorts के लिए professional
          short-form story writer हो।

          एक ORIGINAL fictional story बनाओ।

          STORY REQUIREMENTS:

          1. पहले scene में powerful curiosity hook हो।
          2. पहले 1-2 seconds में viewer को reason मिले कि
             वह आगे देखे।
          3. कहानी में स्पष्ट setup हो।
          4. फिर वास्तविक problem आए।
          5. tension लगातार बढ़े।
          6. scene 5 में clear climax हो।
          7. scene 6 में emotional satisfying ending हो।
          8. अंतिम narration में बहुत छोटा natural CTA हो।
          9. कहानी लगभग 25-40 seconds की narration के लिए हो।
          10. हर scene कहानी को आगे बढ़ाए।
          11. कोई filler dialogue नहीं।
          12. भाषा आसान, natural Hindi हो।
          13. graphic violence नहीं।
          14. real persons नहीं।
          15. copyrighted characters नहीं।
          16. brands/logos नहीं।

          MAIN CHARACTER:

          एक छोटा प्यारा सफेद खरगोश,
          नीला छोटा scarf पहने हुए।

          CHARACTER CONSISTENCY:

          हर scene में यही rabbit दिखाई दे।
          उसका face, fur, scarf और body proportions
          consistent रहें।

          RETURN FORMAT:

          एक object दो जिसमें exactly ये fields हों:

          title
          description
          tags
          scenes

          scenes में exactly 6 objects हों।

          Scene roles EXACTLY:

          1 = HOOK
          2 = SETUP
          3 = PROBLEM
          4 = TENSION
          5 = CLIMAX
          6 = ENDING_CTA

          हर scene में:

          scene
          role
          narration
          visual_prompt

          narration Hindi में हो।

          visual_prompt English में हो।

          visual_prompt में text, letters, subtitles,
          watermark या logo नहीं होना चाहिए।

          केवल object लौटाओ।
          Markdown code fences मत लगाओ।
          """

          theme = random.choice(THEMES)

          user_prompt = f"""
          Create a highly engaging Hindi YouTube Short
          about this theme:

          {theme}

          Make the opening hook strong and curiosity-driven.
          Build a clear problem and tension.
          Give the story a real climax.
          End with a satisfying emotional payoff and a
          short natural CTA.

          The final result must contain exactly 6 scenes.
          """

          story = None

          # --------------------------------------------------------
          # Try AI generation twice.
          # --------------------------------------------------------
          for attempt in range(1, 3):

              print("")
              print(
                  f"Story generation attempt "
                  f"{attempt}/2..."
              )

              payload = {
                  "messages": [
                      {
                          "role": "system",
                          "content": system_prompt
                      },
                      {
                          "role": "user",
                          "content": user_prompt
                      }
                  ],
                  "max_tokens": 1800,
                  "temperature": 0.7,
                  "top_p": 0.9
              }

              response = requests.post(
                  URL,
                  headers=HEADERS,
                  json=payload,
                  timeout=180
              )

              print(
                  "Cloudflare HTTP:",
                  response.status_code
              )

              if response.status_code != 200:
                  print(
                      response.text[:5000]
                  )

                  if attempt == 2:
                      raise RuntimeError(
                          "Cloudflare story generation failed."
                      )

                  cont
