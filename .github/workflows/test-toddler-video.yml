name: AI YouTube Shorts

on:
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. FFMPEG + HINDI FONT
      # ============================================================
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      # ============================================================
      # 4. PYTHON PACKAGES
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            pillow \
            numpy \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ============================================================
      # 5. CREATE DIRECTORIES
      # ============================================================
      - name: Create working directories
        run: |
          rm -rf scenes audio segments output
          mkdir -p scenes
          mkdir -p audio
          mkdir -p segments
          mkdir -p output

      # ============================================================
      # 6. GENERATE STORY + SCRIPT + IMAGE PROMPTS
      # ============================================================
      - name: Generate AI story
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_story.py <<'PY'
          import os
          import json
          import random
          import re
          import requests

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          MODEL = "@cf/meta/llama-3.2-3b-instruct"

          URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/ai/run/{MODEL}"
          )

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json",
          }

          THEMES = [
              "एक छोटे खरगोश और एक खोए हुए पक्षी की भावुक दोस्ती",
              "एक छोटा खरगोश जो तूफान में अपने दोस्त को बचाने की कोशिश करता है",
              "एक गरीब छोटा खरगोश जिसे जंगल में एक रहस्यमयी चिट्ठी मिलती है",
              "एक खरगोश जो अपने दोस्त के लिए आखिरी मौका मिलने पर हिम्मत दिखाता है",
              "एक छोटा खरगोश जो जंगल में एक घायल जानवर की मदद करता है",
              "एक खरगोश जिसे लगता है कि उसका दोस्त उसे छोड़कर चला गया है, लेकिन अंत में सच्चाई सामने आती है",
              "एक छोटा खरगोश जो जंगल में किसी अनजान की मदद करता है और बदले में अप्रत्याशित मदद पाता है",
              "एक खरगोश जो अपने डर के बावजूद अपने दोस्त को बचाने के लिए अंधेरे जंगल में जाता है",
          ]

          theme = random.choice(THEMES)

          system_prompt = """
          तुम Hindi YouTube Shorts के लिए professional viral-story writer हो।

          तुम्हारा काम एक ORIGINAL fictional short story बनाना है।

          कहानी:
          - लगभग 25 से 40 सेकंड की हो
          - शुरुआत पहले ही वाक्य में strong hook से हो
          - boring introduction नहीं होना चाहिए
          - हर scene में कहानी आगे बढ़नी चाहिए
          - एक clear problem हो
          - tension बढ़नी चाहिए
          - climax होना चाहिए
          - satisfying emotional ending होना चाहिए
          - आखिरी scene में natural short CTA हो
          - बच्चों के लिए डरावनी, खतरनाक या graphic violence नहीं
          - कोई real person नहीं
          - कोई copyrighted character नहीं
          - कोई brand/logo नहीं

          भाषा:
          - सरल और natural Hindi
          - narration बोलने में आसान हो
          - बहुत कठिन शब्द नहीं
          - English केवल तभी जब natural लगे

          Visual consistency:
          मुख्य character हमेशा:
          "एक छोटा प्यारा सफेद खरगोश, नीला छोटा scarf पहने हुए"

          हर scene में इसी character का appearance consistent रहना चाहिए।

          बिल्कुल इसी JSON structure में जवाब दो:

          {
            "title": "short Hindi title",
            "description": "short YouTube description",
            "tags": ["tag1", "tag2", "tag3", "tag4", "tag5"],
            "scenes": [
              {
                "scene": 1,
                "role": "HOOK",
                "narration": "Hindi narration",
                "visual_prompt": "English image generation prompt"
              },
              {
                "scene": 2,
                "role": "SETUP",
                "narration": "Hindi narration",
                "visual_prompt": "English image generation prompt"
              },
              {
                "scene": 3,
                "role": "PROBLEM",
                "narration": "Hindi narration",
                "visual_prompt": "English image generation prompt"
              },
              {
                "scene": 4,
                "role": "TENSION",
                "narration": "Hindi narration",
                "visual_prompt": "English image generation prompt"
              },
              {
                "scene": 5,
                "role": "CLIMAX",
                "narration": "Hindi narration",
                "visual_prompt": "English image generation prompt"
              },
              {
                "scene": 6,
                "role": "ENDING_CTA",
                "narration": "Hindi narration ending with a natural short CTA",
                "visual_prompt": "English image generation prompt"
              }
            ]
          }

          Important:
          - केवल JSON दो
          - Markdown code fence मत लगाना
          - scene count exactly 6 होना चाहिए
          - narration में scene labels मत लिखना
          - visual_prompt English में होना चाहिए
          - visual_prompt में text, letters, subtitles, watermark या logo नहीं
          """

          user_prompt = f"""
          आज की कहानी का theme:

          {theme}

          इस theme पर ऊपर दिए structure के अनुसार एक engaging YouTube Short बनाओ।
          """

          payload = {
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "max_tokens": 1800,
              "temperature": 0.85,
              "top_p": 0.9
          }

          print("Generating story...")
          print("Theme:", theme)

          response = requests.post(
              URL,
              headers=HEADERS,
              json=payload,
              timeout=180
          )

          print("Cloudflare HTTP:", response.status_code)

          if response.status_code != 200:
              print(response.text[:5000])
              raise RuntimeError(
                  "Story generation request failed."
              )

          data = response.json()

          if not data.get("success"):
              print(data)
              raise RuntimeError(
                  "Cloudflare story generation returned success=false."
              )

          result = data.get("result", {})

          raw_text = result.get("response", "")

          if not raw_text:
              print(data)
              raise RuntimeError(
                  "No text response returned by Cloudflare."
              )

          print("Raw AI response:")
          print(raw_text)

          # --------------------------------------------------------
          # Extract JSON even if the model accidentally adds text.
          # --------------------------------------------------------
          match = re.search(
              r"\{.*\}",
              raw_text,
              re.DOTALL
          )

          if not match:
              raise RuntimeError(
                  "Could not find JSON in AI response."
              )

          json_text = match.group(0)

          try:
              story = json.loads(json_text)
          except json.JSONDecodeError as exc:
              print("Invalid JSON:")
              print(json_text)
              raise RuntimeError(
                  "AI returned invalid JSON."
              ) from exc

          # --------------------------------------------------------
          # Validate structure.
          # --------------------------------------------------------
          required_top = [
              "title",
              "description",
              "tags",
              "scenes"
          ]

          for key in required_top:
              if key not in story:
                  raise RuntimeError(
                      f"Missing story field: {key}"
                  )

          scenes = story["scenes"]

          if not isinstance(scenes, list):
              raise RuntimeError(
                  "scenes must be a list."
              )

          if len(scenes) != 6:
              raise RuntimeError(
                  f"Expected exactly 6 scenes, got {len(scenes)}."
              )

          required_scene_fields = [
              "scene",
              "role",
              "narration",
              "visual_prompt"
          ]

          expected_roles = [
              "HOOK",
              "SETUP",
              "PROBLEM",
              "TENSION",
              "CLIMAX",
              "ENDING_CTA"
          ]

          for index, scene in enumerate(scenes):

              for key in required_scene_fields:
                  if key not in scene:
                      raise RuntimeError(
                          f"Scene {index + 1} is missing {key}."
                      )

              if not str(scene["narration"]).strip():
                  raise RuntimeError(
                      f"Scene {index + 1} has empty narration."
                  )

              if not str(scene["visual_prompt"]).strip():
                  raise RuntimeError(
                      f"Scene {index + 1} has empty visual prompt."
                  )

              role = str(scene["role"]).strip()

              if role != expected_roles[index]:
                  print(
                      f"Warning: scene {index + 1} role was "
                      f"{role}, expected {expected_roles[index]}"
                  )

          # --------------------------------------------------------
          # Add mandatory visual consistency instruction.
          # --------------------------------------------------------
          character = (
              "same main character: a small cute white rabbit "
              "wearing a small blue scarf, consistent character "
              "design, same face, same proportions"
          )

          global_visual_rules = (
              ", cinematic 3D animated movie style, "
              "high detail, expressive characters, "
              "beautiful lighting, vertical composition, "
              "no text, no letters, no subtitles, no watermark, "
              "no logo, no brand"
          )

          for scene in scenes:
              scene["visual_prompt"] = (
                  character
                  + ", "
                  + str(scene["visual_prompt"]).strip()
                  + global_visual_rules
              )

          # --------------------------------------------------------
          # Save story.
          # --------------------------------------------------------
          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # Save simple text version for debugging/artifact.
          with open(
              "story.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  f"TITLE:\n{story['title']}\n\n"
              )

              f.write(
                  f"DESCRIPTION:\n{story['description']}\n\n"
              )

              for scene in scenes:
                  f.write(
                      f"SCENE {scene['scene']} "
                      f"({scene['role']})\n"
                  )

                  f.write(
                      f"{scene['narration']}\n\n"
                  )

          print("")
          print("==========================================")
          print("AI STORY GENERATED")
          print("==========================================")
          print("TITLE:", story["title"])

          for scene in scenes:
              print(
                  f"Scene {scene['scene']} "
                  f"[{scene['role']}]: "
                  f"{scene['narration']}"
              )

          print("==========================================")
          PY

          python generate_story.py

      # ============================================================
      # 7. GENERATE SIX AI IMAGES
      # ============================================================
      - name: Generate AI scenes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > generate_images.py <<'PY'
          import os
          import json
          import base64
          import requests
          from io import BytesIO
          from PIL import Image

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          MODEL = "@cf/black-forest-labs/flux-1-schnell"

          URL = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{ACCOUNT_ID}/ai/run/{MODEL}"
          )

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json"
          }

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          for scene in story["scenes"]:

              number = int(scene["scene"])

              prompt = " ".join(
                  scene["visual_prompt"].split()
              )

              print("")
              print(
                  f"Generating image for scene {number}..."
              )

              payload = {
                  "prompt": prompt,
                  "steps": 4
              }

              response = requests.post(
                  URL,
                  headers=HEADERS,
                  json=payload,
                  timeout=180
              )

              print(
                  "Cloudflare HTTP:",
                  response.status_code
              )

              if response.status_code != 200:
                  print(response.text[:5000])
                  raise RuntimeError(
                      f"Image generation failed for scene {number}."
                  )

              data = response.json()

              if not data.get("success"):
                  print(data)
                  raise RuntimeError(
                      f"Cloudflare failed for scene {number}."
                  )

              result = data.get("result", {})

              image_b64 = result.get("image")

              if not image_b64:
                  print(data)
                  raise RuntimeError(
                      f"No image returned for scene {number}."
                  )

              try:
                  image_bytes = base64.b64decode(
                      image_b64,
                      validate=True
                  )
              except Exception as exc:
                  raise RuntimeError(
                      f"Invalid Base64 image for scene {number}."
                  ) from exc

              try:
                  image = Image.open(
                      BytesIO(image_bytes)
                  )

                  image.load()

              except Exception as exc:
                  raise RuntimeError(
                      f"Invalid image data for scene {number}."
                  ) from exc

              output_path = (
                  f"scenes/scene{number}.png"
              )

              image.save(
                  output_path,
                  "PNG"
              )

              print(
                  f"Saved {output_path} | "
                  f"{image.width}x{image.height}"
              )

          print("")
          print("All 6 AI images generated.")
          PY

          python generate_images.py

      # ============================================================
      # 8. GENERATE SEPARATE NARRATION FOR EACH SCENE
      # ============================================================
      - name: Generate scene narration
        run: |
          cat > generate_audio.py <<'PY'
          import asyncio
          import json
          import os
          import edge_tts

          VOICE = "hi-IN-SwaraNeural"

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          async def generate_one(
              text,
              output
          ):
              communicate = edge_tts.Communicate(
                  text.strip(),
                  VOICE,
                  rate="+0%",
                  volume="+0%"
              )

              await communicate.save(output)

          async def main():

              for scene in story["scenes"]:

                  number = int(scene["scene"])

                  output = (
                      f"audio/scene{number}.mp3"
                  )

                  print(
                      f"Generating narration "
                      f"for scene {number}..."
                  )

                  await generate_one(
                      scene["narration"],
                      output
                  )

                  if not os.path.exists(output):
                      raise RuntimeError(
                          f"Audio was not created for scene {number}."
                      )

                  size = os.path.getsize(output)

                  if size < 1000:
                      raise RuntimeError(
                          f"Audio for scene {number} "
                          f"is unexpectedly small."
                      )

                  print(
                      f"Saved {output}: {size} bytes"
                  )

          asyncio.run(main())

          print("All narration files generated.")
          PY

          python generate_audio.py

      # ============================================================
      # 9. CREATE SUBTITLES + SCENE VIDEOS
      # ============================================================
      - name: Create subtitled scene videos
        run: |
          cat > create_segments.py <<'PY'
          import json
          import os
          import subprocess

          FONT_DIR = "/usr/share/fonts/truetype/noto"

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          def get_duration(path):

              result = subprocess.check_output([
      
