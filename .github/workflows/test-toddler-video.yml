
name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip
          python3 -m pip install --break-system-packages edge-tts Pillow
          mkdir -p artifacts

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing Cloudflare API token"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing Cloudflare account ID"
            exit 1
          }

      - name: Generate three toddler scenes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell"

          generate_image() {
            local prompt="$1"
            local output="$2"
            local response="${output}.json"
            local raw="${output}.raw"

            rm -f "$output" "$response" "$raw"

            local status
            status=$(curl -sS --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 180 \
              -o "$response" -w "%{http_code}" \
              "$API_URL" \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg prompt "$prompt" \
                '{prompt:$prompt,steps:4}')")

            if [ "$status" != "200" ]; then
              cat "$response"
              echo "::error::Cloudflare returned HTTP $status"
              return 1
            fi

            if [ "$(jq -r '.success // false' "$response")" != "true" ]; then
              cat "$response"
              echo "::error::Cloudflare image generation failed"
              return 1
            fi

            jq -e '.result.image | type == "string" and length > 0' \
              "$response" >/dev/null

            jq -r '.result.image' "$response" | base64 -d > "$raw"
            test -s "$raw"

            ffmpeg -hide_banner -loglevel error -y \
              -i "$raw" -frames:v 1 "$output"

            test -s "$output"
            rm -f "$raw" "$response"
          }

          CHARACTER="fictional Indian toddler boy, three years old, round cheeks, large brown eyes, short black hair, yellow T-shirt and blue shorts, natural proportions, photorealistic, family-friendly"

          generate_image \
            "$CHARACTER, happily playing with a small red toy car on a sunny Indian street, full body wide shot, morning sunlight, vertical composition, no text, no watermark" \
            scene1.png

          generate_image \
            "$CHARACTER, standing at the doorway of a colorful Indian home, surprised expression, looking sideways, mother softly visible in background, medium shot, different pose, vertical composition, no text, no watermark" \
            scene2.png

          generate_image \
            "$CHARACTER, sitting on a small chair in an Indian courtyard, laughing and holding a blank school notebook, close-up three-quarter portrait, different pose and framing, vertical composition, no text, no watermark" \
            scene3.png

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          import sys

          files = [Path(f"scene{i}.png") for i in range(1, 4)]

          for path in files:
              if not path.is_file() or path.stat().st_size < 1000:
                  sys.exit(f"Missing or invalid image: {path}")
              with Image.open(path) as im:
                  im.verify()

          hashes = [hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in files]
          if len(set(hashes)) != 3:
              sys.exit("The three generated images are identical")

          print("All three images are valid and distinct")
          PY

      - name: Create Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          cat > child1.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          EOF

          cat > mother.txt <<'EOF'
          अच्छा? कैसा राज़?
          EOF

          cat > child2.txt <<'EOF'
          होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF

          edge-tts --voice hi-IN-SwaraNeural \
            --rate="+8%" --pitch="+15Hz" \
            --file child1.txt --write-media child1.mp3

          edge-tts --voice hi-IN-MadhurNeural \
            --rate="+3%" \
            --file mother.txt --write-media mother.mp3

          edge-tts --voice hi-IN-SwaraNeural \
            --rate="+8%" --pitch="+15Hz" \
            --file child2.txt --write-media child2.mp3

          for f in child1.mp3 mother.mp3 child2.mp3; do
            test -s "$f" || {
              echo "::error::Missing voice file: $f"
              exit 1
            }
          done

          for f in child1 mother child2; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "$f.mp3" -ar 44100 -ac 2 "$f.wav"
          done

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "anullsrc=r=44100:cl=stereo" \
            -t 0.15 pause.wav

          {
            printf "file '%s/child1.wav'\n" "$PWD"
            printf "file '%s/pause.wav'\n" "$PWD"
            printf "file '%s/mother.wav'\n" "$PWD"
            printf "file '%s/pause.wav'\n" "$PWD"
            printf "file '%s/child2.wav'\n" "$PWD"
          } > voice_concat.txt

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i voice_concat.txt \
            -c:a pcm_s16le voice.wav

          test -s voice.wav

          ffmpeg -hide_banner -loglevel error \
            -i voice.wav -af volumedetect \
            -f null - 2> voice_volume.log

          mean_volume=$(sed -n \
            's/.*mean_volume: \([-0-9.]*\) dB.*/\1/p' \
            voice_volume.log | tail -n 1)

          if [ -z "$mean_volume" ] || [ "$mean_volume" = "-inf" ]; then
            echo "::error::Voice is silent or could not be measured"
            exit 1
          fi

          if ! awk -v v="$mean_volume" 'BEGIN {exit !(v > -45)}'; then
            echo "::error::Voice is too quiet: $mean_volume dB"
            exit 1
          fi

          cat child1.txt mother.txt child2.txt > script.txt
          echo "Hindi voice created: $mean_volume dB"

      - name: Create final vertical video
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -t 3 -i scene1.png \
            -loop 1 -framerate 30 -t 3 -i scene2.png \
            -loop 1 -framerate 30 -t 3 -i scene3.png \
            -i voice.wav \
            -filter_complex "\
              [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,setpts=PTS-STARTPTS[v0];\
              [1:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,setpts=PTS-STARTPTS[v1];\
              [2:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,setpts=PTS-STARTPTS[v2];\
              [v0][v1][v2]concat=n=3:v=1:a=0[v];\
              [3:a]aresample=44100,volume=1.5,apad,atrim=duration=9,asetpts=PTS-STARTPTS[a]" \
            -map "[v]" -map "[a]" \
            -t 9 -r 30 \
            -c:v libx264 -preset veryfast -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -movflags +faststart \
            final_toddler_short.mp4

          test -s final_toddler_short.mp4

      - name: Verify final video and audio
        shell: bash
        run: |
          set -euo pipefail

          VIDEO=final_toddler_short.mp4
          test -s "$VIDEO"

          width=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width -of csv=p=0 "$VIDEO")
          height=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=height -of csv=p=0 "$VIDEO")
          vcodec=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name -of csv=p=0 "$VIDEO")
          acodec=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name -of csv=p=0 "$VIDEO")
          duration=$(ffprobe -v error \
            -show_entries format=duration -of csv=p=0 "$VIDEO")
          audio_duration=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=duration -of csv=p=0 "$VIDEO")

          echo "Resolution: ${width}x${height}"
          echo "Video codec: $vcodec"
          echo "Audio codec: $acodec"
          echo "Video duration: $duration"
          echo "Audio duration: $audio_duration"

          [ "$width" = "1080" ] || {
            echo "::error::Wrong video width"
            exit 1
          }
          [ "$height" = "1920" ] || {
            echo "::error::Wrong video height"
            exit 1
          }
          [ "$vcodec" = "h264" ] || {
            echo "::error::Wrong video codec"
            exit 1
          }
          [ "$acodec" = "aac" ] || {
            echo "::error::Missing AAC audio"
            exit 1
          }

          awk -v d="$duration" \
            'BEGIN {exit !(d >= 8.8 && d <= 9.2)}' || {
              echo "::error::Video duration is not approximately 9 seconds"
              exit 1
            }

          awk -v d="$audio_duration" \
            'BEGIN {exit !(d >= 8.0)}' || {
              echo "::error::Audio track is missing or too short"
              exit 1
            }

          ffmpeg -hide_banner -loglevel error -y \
            -i "$VIDEO" -map 0:a:0 -t 9 \
            -ar 44100 -ac 1 verify_audio.wav

          python3 - <<'PY'
          import math
          import struct
          import wave
          import sys

          with wave.open("verify_audio.wav", "rb") as f:
              width = f.getsampwidth()
              samples = f.readframes(f.getnframes())

          if width != 2 or not samples:
              sys.exit("Invalid or missing audio samples")

          values = struct.unpack("<" + "h" * (len(samples)//2), samples)
          peak = max(abs(x) for x in values)
          rms = math.sqrt(sum(x*x for x in values) / len(values))

          print(f"Audio peak: {peak}")
          print(f"Audio RMS: {rms:.2f}")

          if peak < 1000 or rms < 300:
              sys.exit("Audio is silent or too quiet")

          print("Audio waveform check passed")
          PY

          for t in 1 4 7; do
            ffmpeg -hide_banner -loglevel error -y \
              -ss "$t" -i "$VIDEO" -frames:v 1 \
              "verify_scene${t}.png"
          done

          python3 - <<'PY'
          from PIL import Image
          import sys

          images = [
              Image.open(f"verify_scene{t}.png").convert("RGB").resize((64,64))
              for t in (1,4,7)
          ]
          arrays = [list(im.getdata()) for im in images]

          def difference(a,b):
              return sum(
                  abs(x-y)
                  for p,q in zip(a,b)
                  for x,y in zip(p,q)
              ) / (len(a)*3)

          diffs = [
              difference(arrays[0], arrays[1]),
              difference(arrays[0], arrays[2]),
              difference(arrays[1], arrays[2])
          ]
          print("Scene differences:", diffs)

          if min(diffs) < 8:
              sys.exit("Two final video scenes appear too similar")

          print("Three-scene check passed")
          PY

          echo "All final video checks passed"

      - name: Create YouTube metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > youtube_metadata.json <<'EOF'
          {
            "title": "जब बच्चे ने होमवर्क का राज़ बताया 😂",
            "description": "एक छोटे बच्चे का मज़ेदार और मासूम जवाब 😂\n\n#shorts #funny #comedy #hindi #kids",
            "language": "Hindi",
            "format": "YouTube Shorts",
            "aspect_ratio": "9:16",
            "duration_seconds": 9,
            "captions": false,
            "visual_style": "photorealistic cinematic",
            "image_model": "Cloudflare FLUX.1 Schnell"
          }
          EOF
          jq empty youtube_metadata.json

      - name: Prepare final package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for f in final_toddler_short.mp4 \
                   scene1.png scene2.png scene3.png \
                   voice.wav child1.mp3 mother.mp3 child2.mp3 \
                   script.txt youtube_metadata.json; do
            if [ -s "$f" ]; then
              cp "$f" artifacts/
            fi
          done

          {
            echo "Toddler Video Test"
            echo "Expected resolution: 1080x1920"
            echo "Expected duration: 9 seconds"
            echo "Scenes: 3"
            echo "Audio: Hindi narration"
          } > artifacts/REPORT.txt

          ls -lh artifacts

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toddler-video-test
          path: artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
          
