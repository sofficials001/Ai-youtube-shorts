name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

          python3 -m pip install \
            --break-system-packages \
            requests \
            Pillow \
            edge-tts

          mkdir -p artifacts

          echo "Tools installed successfully."


      # ============================================================
      # 3. CHECK CLOUDFLARE SECRETS
      # ============================================================
      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi

          echo "Cloudflare configuration found."


      # ============================================================
      # 4. GENERATE TODDLER IMAGES
      # ============================================================
      - name: Generate toddler scenes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          set -euo pipefail

          cat > generate_scenes.py <<'PY'
          import base64
          import io
          import json
          import os
          import shutil
          import sys

          import requests
          from PIL import Image


          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          API_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]


          ENDPOINT = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + ACCOUNT_ID
              + "/ai/run/@cf/black-forest-labs/flux-1-schnell"
          )


          # --------------------------------------------------------
          # CHARACTER
          # --------------------------------------------------------

          CHARACTER = (
              "wholesome family friendly fictional Indian toddler boy, "
              "about three years old, small chubby body, round cheeks, "
              "large expressive brown eyes, short black hair, "
              "cute innocent face, bright yellow T-shirt, blue shorts"
          )


          # --------------------------------------------------------
          # SCENE PROMPTS
          # --------------------------------------------------------

          SCENES = [
              (
                  "scene1.jpg",
                  CHARACTER
                  + ", happy innocent smile, standing on a clean "
                  + "Indian residential street, warm natural daylight, "
                  + "realistic professional photography, cinematic portrait"
              ),

              (
                  "scene2.jpg",
                  CHARACTER
                  + ", funny confused expression, looking toward his "
                  + "mother near an Indian home entrance, warm daylight, "
                  + "realistic professional photography, cinematic close-up"
              ),

              (
                  "scene3.jpg",
                  CHARACTER
                  + ", playful happy expression, smiling after saying "
                  + "something funny, colorful Indian neighborhood, "
                  + "warm daylight, realistic professional photography, "
                  + "cinematic portrait"
              )
          ]


          FALLBACK_PROMPT = (
              "wholesome family friendly photograph of a fictional "
              "young Indian child, cute round face, large expressive "
              "brown eyes, short black hair, colorful casual clothing, "
              "cheerful smile, sunny neighborhood, natural daylight, "
              "realistic professional photography"
          )


          # --------------------------------------------------------
          # CLOUDFLARE REQUEST
          # --------------------------------------------------------

          def request_image(prompt):

              payload = {
                  "prompt": prompt,
                  "steps": 4
              }

              response = requests.post(
                  ENDPOINT,
                  headers={
                      "Authorization": "Bearer " + API_TOKEN,
                      "Content-Type": "application/json"
                  },
                  json=payload,
                  timeout=180
              )


              try:
                  data = response.json()
              except ValueError:

                  raise RuntimeError(
                      "Cloudflare returned invalid JSON. "
                      + "HTTP status: "
                      + str(response.status_code)
                  )


              if not response.ok:

                  raise RuntimeError(
                      "Cloudflare HTTP "
                      + str(response.status_code)
                      + ": "
                      + json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )


              if not data.get("success", False):

                  raise RuntimeError(
                      "Cloudflare generation failed: "
                      + json.dumps(
                          data.get("errors", data),
                          ensure_ascii=False
                      )
                  )


              result = data.get("result")

              if not isinstance(result, dict):

                  raise RuntimeError(
                      "Cloudflare response has no result object."
                  )


              encoded = result.get("image")

              if not isinstance(encoded, str) or not encoded:

                  raise RuntimeError(
                      "Cloudflare response contains no image."
                  )


              try:

                  return base64.b64decode(
                      encoded,
                      validate=True
                  )

              except Exception as error:

                  raise RuntimeError(
                      "Invalid Base64 image: "
                      + str(error)
                  )


          # --------------------------------------------------------
          # NORMALIZE CLOUDflare IMAGE
          #
          # FLUX response is documented as JPEG.
          # We decode it and save a known-good JPEG.
          # --------------------------------------------------------

          def save_jpeg(filename, image_bytes):

              try:

                  image = Image.open(
                      io.BytesIO(image_bytes)
                  )

                  image.load()

                  image = image.convert("RGB")

              except Exception as error:

                  raise RuntimeError(
                      "Cloudflare returned bytes that could not "
                      + "be decoded as an image: "
                      + str(error)
                  )


              image.save(
                  filename,
                  format="JPEG",
                  quality=95,
                  optimize=True
              )


              if not os.path.isfile(filename):

                  raise RuntimeError(
                      "Image file was not created: "
                      + filename
                  )


              if os.path.getsize(filename) < 1000:

                  raise RuntimeError(
                      "Image file is unexpectedly small: "
                      + filename
                  )


          # --------------------------------------------------------
          # GENERATE
          # --------------------------------------------------------

          previous_scene = None


          for index, (filename, prompt) in enumerate(
              SCENES,
              start=1
          ):

              print()
              print("==========================================")
              print("GENERATING SCENE " + str(index))
              print("==========================================")

              # ----------------------------------------------------
              # PRIMARY
              # ----------------------------------------------------

              try:

                  raw_image = request_image(
                      prompt
                  )

                  save_jpeg(
                      filename,
                      raw_image
                  )

                  previous_scene = filename

                  print(
                      "Scene "
                      + str(index)
                      + " created successfully."
                  )

                  continue

              except Exception as error:

                  print(
                      "Primary prompt failed:"
                  )

                  print(
                      str(error)
                  )


              # ----------------------------------------------------
              # SAFE FALLBACK
              # ----------------------------------------------------

              try:

                  print(
                      "Trying safe fallback..."
                  )

                  raw_image = request_image(
                      FALLBACK_PROMPT
                  )

                  save_jpeg(
                      filename,
                      raw_image
                  )

                  previous_scene = filename

                  print(
                      "Fallback scene "
                      + str(index)
                      + " created successfully."
                  )

                  continue

              except Exception as error:

                  print(
                      "Fallback failed:"
                  )

                  print(
                      str(error)
                  )


              # ----------------------------------------------------
              # LAST-RESORT REUSE
              # ----------------------------------------------------

              if previous_scene is None:

                  sys.exit(
                      "Unable to generate the first scene."
                  )


              print(
                  "Reusing previous valid scene:"
                  + " "
                  + previous_scene
                  + " -> "
                  + filename
              )


              shutil.copyfile(
                  previous_scene,
                  filename
              )


          # --------------------------------------------------------
          # VERIFY ALL IMAGES
          # --------------------------------------------------------

          for filename, _ in SCENES:

              if not os.path.isfile(filename):

                  sys.exit(
                      "Missing image: "
                      + filename
                  )


              try:

                  image = Image.open(filename)

                  image.verify()

              except Exception as error:

                  sys.exit(
                      "Invalid final image "
                      + filename
                      + ": "
                      + str(error)
                  )


          # --------------------------------------------------------
          # SAVE PROMPTS
          # --------------------------------------------------------

          with open(
              "scene_prompts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for index, (_, prompt) in enumerate(
                  SCENES,
                  start=1
              ):

                  file.write(
                      "SCENE "
                      + str(index)
                      + "\n"
                  )

                  file.write(
                      prompt
                      + "\n\n"
                  )


          print()
          print("ALL THREE SCENES VERIFIED SUCCESSFULLY.")

          PY


          python3 generate_scenes.py


      # ============================================================
      # 5. CREATE HINDI VOICE
      # ============================================================
      - name: Create Hindi voice
        shell: bash
        run: |

          set -euo pipefail

          cat > create_voice.py <<'PY'
          import asyncio

          import edge_tts


          async def make_voice(
              text,
              voice,
              rate,
              pitch,
              output
          ):

              communicate = edge_tts.Communicate(
                  text,
                  voice,
                  rate=rate,
                  pitch=pitch
              )

              await communicate.save(
                  output
              )


          async def main():

              await make_voice(
                  "मम्मी, आज मैंने स्कूल में एक राज़ सीखा!",
                  "hi-IN-SwaraNeural",
                  "+8%",
                  "+15Hz",
                  "child1.mp3"
              )


              await make_voice(
                  "अच्छा? कैसा राज़?",
                  "hi-IN-MadhurNeural",
                  "+3%",
                  "+0Hz",
                  "adult.mp3"
              )


              await make_voice(
                  "होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!",
                  "hi-IN-SwaraNeural",
                  "+8%",
                  "+15Hz",
                  "child2.mp3"
              )


          asyncio.run(
              main()
          )

          PY


          python3 create_voice.py


          test -s child1.mp3
          test -s adult.mp3
          test -s child2.mp3


          # Convert audio to WAV
          ffmpeg -y \
            -i child1.mp3 \
            -ar 44100 \
            -ac 2 \
            child1.wav


          ffmpeg -y \
            -i adult.mp3 \
            -ar 44100 \
            -ac 2 \
            adult.wav


          ffmpeg -y \
            -i child2.mp3 \
            -ar 44100 \
            -ac 2 \
            child2.wav


          # Create pauses
          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=44100:cl=stereo" \
            -t 0.12 \
            pause.wav


          # Build audio sequence
          {
            echo "file '$PWD/child1.wav'"
            echo "file '$PWD/pause.wav'"
            echo "file '$PWD/adult.wav'"
            echo "file '$PWD/pause.wav'"
            echo "file '$PWD/child2.wav'"
          } > audio_concat.txt


          # Combine
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i audio_concat.txt \
            -c:a pcm_s16le \
            voice.wav


          test -s voice.wav


          cat > script.txt <<'EOF'
          बच्चा: मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          मम्मी: अच्छा? कैसा राज़?
          बच्चा: होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF


          echo "Hindi voice created successfully."


      # ============================================================
      # 6. CREATE SCENE 1 VIDEO
      # ============================================================
      - name: Create Scene 1 video
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene1.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -movflags +faststart \
            scene1.mp4


          test -s scene1.mp4


      # ============================================================
      # 7. CREATE SCENE 2 VIDEO
      # ============================================================
      - name: Create Scene 2 video
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene2.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0010,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -movflags +faststart \
            scene2.mp4


          test -s scene2.mp4


      # ============================================================
      # 8. CREATE SCENE 3 VIDEO
      # ============================================================
      - name: Create Scene 3 video
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i scene3.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -movflags +faststart \
            scene3.mp4


          test -s scene3.mp4


      # ============================================================
      # 9. JOIN SCENES
      # ============================================================
      - name: Join scenes
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -i scene1.mp4 \
            -i scene2.mp4 \
            -i scene3.mp4 \
            -filter_complex \
              "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v]" \
            -map "[v]" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            silent_video.mp4


          test -s silent_video.mp4


      # ============================================================
      # 10. ADD HINDI VOICE
      # ============================================================
      - name: Add Hindi voice
        shell: bash
        run: |

          set -euo pipefail

          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -af "apad" \
            -t 9 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            final_toddler_short.mp4


          test -s final_toddler_short.mp4


          echo "Final video created successfully."


      # ============================================================
      # 11. VERIFY FINAL VIDEO
      # ============================================================
      - name: Verify final video
        shell: bash
        run: |

          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          import sys


          result = subprocess.run(
 
