name: Test Toddler Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ============================================================
      # 1. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts

          echo "Tools installed successfully."


      # ============================================================
      # 2. CHECK CLOUDFLARE SECRETS
      # ============================================================
      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

          echo "Cloudflare configuration found."


      # ============================================================
      # 3. GENERATE THREE TODDLER IMAGES
      # ============================================================
      - name: Generate toddler scenes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cat > generate_scenes.py <<'PY'
          import base64
          import json
          import os
          import shutil
          import urllib.error
          import urllib.request
          from pathlib import Path

          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          API_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]

          ENDPOINT = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + ACCOUNT_ID
              + "/ai/run/@cf/black-forest-labs/flux-1-schnell"
          )

          CHARACTER = (
              "wholesome family friendly fictional Indian toddler boy, "
              "about three years old, small chubby body, round cheeks, "
              "large expressive brown eyes, short black hair, "
              "cute innocent smile, yellow T-shirt, blue shorts"
          )

          SCENES = [
              (
                  "scene1.jpg",
                  CHARACTER
                  + ", cheerful smile, standing on a clean Indian "
                  + "residential street, warm daylight, realistic "
                  + "professional photography, cinematic portrait"
              ),
              (
                  "scene2.jpg",
                  CHARACTER
                  + ", funny confused expression, looking toward a "
                  + "family member, Indian home entrance, warm daylight, "
                  + "realistic professional photography, cinematic close-up"
              ),
              (
                  "scene3.jpg",
                  CHARACTER
                  + ", playful happy expression, smiling after saying "
                  + "something clever, Indian neighborhood, warm daylight, "
                  + "realistic professional photography, cinematic portrait"
              )
          ]

          FALLBACK = (
              "wholesome family friendly photograph of a cheerful "
              "fictional Indian child, cute round face, large brown eyes, "
              "short black hair, colorful casual clothing, smiling outdoors "
              "in an Indian neighborhood, natural daylight, realistic photography"
          )

          def request_image(prompt):
              payload = {
                  "prompt": prompt,
                  "steps": 4
              }

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  ENDPOINT,
                  data=body,
                  headers={
                      "Authorization": "Bearer " + API_TOKEN,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:
                      raw = response.read()

              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      "Cloudflare HTTP "
                      + str(error.code)
                      + ": "
                      + error_body
                  )

              except Exception as error:
                  raise RuntimeError(
                      "Cloudflare request failed: "
                      + str(error)
                  )

              try:
                  data = json.loads(
                      raw.decode("utf-8")
                  )
              except Exception as error:
                  raise RuntimeError(
                      "Cloudflare returned invalid JSON: "
                      + str(error)
                  )

              if not data.get("success", False):
                  raise RuntimeError(
                      "Cloudflare error: "
                      + json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )

              result = data.get("result")

              if not isinstance(result, dict):
                  raise RuntimeError(
                      "Cloudflare response has no result object."
                  )

              encoded = result.get("image")

              if not isinstance(encoded, str) or not encoded:
                  raise RuntimeError(
                      "Cloudflare response contains no image."
                  )

              try:
                  image_bytes = base64.b64decode(
                      encoded,
                      validate=True
                  )
              except Exception as error:
                  raise RuntimeError(
                      "Invalid Base64 image: "
                      + str(error)
                  )

              if len(image_bytes) < 1000:
                  raise RuntimeError(
                      "Generated image is unexpectedly small."
                  )

              return image_bytes

          def save_image(filename, image_bytes):
              Path(filename).write_bytes(
                  image_bytes
              )

              print(
                  "Saved "
                  + filename
                  + " ("
                  + str(len(image_bytes))
                  + " bytes)"
              )

          previous_file = None

          for number, (filename, prompt) in enumerate(
              SCENES,
              start=1
          ):

              print()
              print(
                  "=========================================="
              )
              print(
                  "GENERATING SCENE "
                  + str(number)
              )
              print(
                  "=========================================="
              )

              try:
                  image = request_image(prompt)

                  save_image(
                      filename,
                      image
                  )

                  previous_file = filename

              except Exception as first_error:

                  print(
                      "Primary prompt failed:"
                  )

                  print(
                      str(first_error)
                  )

                  try:
                      print(
                          "Trying safe fallback..."
                      )

                      image = request_image(
                          FALLBACK
                      )

                      save_image(
                          filename,
                          image
                      )

                      previous_file = filename

                  except Exception as fallback_error:

                      print(
                          "Fallback failed:"
                      )

                      print(
                          str(fallback_error)
                      )

                      if previous_file is None:
                          raise SystemExit(
                              "First scene could not be generated."
                          )

                      print(
                          "Reusing "
                          + previous_file
                          + " for "
                          + filename
                      )

                      shutil.copyfile(
                          previous_file,
                          filename
                      )

          with open(
              "scene_prompts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for number, (_, prompt) in enumerate(
                  SCENES,
                  start=1
              ):

                  file.write(
                      "SCENE "
                      + str(number)
                      + "\n"
                  )

                  file.write(
                      prompt
                      + "\n\n"
                  )

          for filename, _ in SCENES:

              if not Path(filename).is_file():
                  raise SystemExit(
                      "Missing "
                      + filename
                  )

          print()
          print(
              "All three scene images are ready."
          )
          PY

          python3 generate_scenes.py


      # ============================================================
      # 4. CREATE HINDI VOICE
      # ============================================================
      - name: Create Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          cat > child1.txt <<'EOF'
          मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          EOF

          cat > adult.txt <<'EOF'
          अच्छा? कैसा राज़?
          EOF

          cat > child2.txt <<'EOF'
          होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF

          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate "+8%" \
            --pitch "+15Hz" \
            --text "$(cat child1.txt)" \
            --write-media child1.mp3

          edge-tts \
            --voice "hi-IN-MadhurNeural" \
            --rate "+3%" \
            --pitch "+0Hz" \
            --text "$(cat adult.txt)" \
            --write-media adult.mp3

          edge-tts \
            --voice "hi-IN-SwaraNeural" \
            --rate "+8%" \
            --pitch "+15Hz" \
            --text "$(cat child2.txt)" \
            --write-media child2.mp3

          ffmpeg -y \
            -i child1.mp3 \
            -ar 44100 \
            -ac 2 \
            child1.wav

          ffmpeg -y \
            -i adult.mp3 \
            -ar 44100 \
            -ac 2 \
            adult.wav

          ffmpeg -y \
            -i child2.mp3 \
            -ar 44100 \
            -ac 2 \
            child2.wav

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=44100:cl=stereo" \
            -t 0.12 \
            pause.wav

          {
            echo "file '$PWD/child1.wav'"
            echo "file '$PWD/pause.wav'"
            echo "file '$PWD/adult.wav'"
            echo "file '$PWD/pause.wav'"
            echo "file '$PWD/child2.wav'"
          } > audio_concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i audio_concat.txt \
            -c:a pcm_s16le \
            voice.wav

          test -s voice.wav

          cat > script.txt <<'EOF'
          बच्चा 1: मम्मी, आज मैंने स्कूल में एक राज़ सीखा!
          बच्चा 2: अच्छा? कैसा राज़?
          बच्चा 1: होमवर्क छुपा दो, तो टीचर खुद ढूंढने आ जाती हैं!
          EOF

          echo "Hindi voice created."


      # ============================================================
      # 5. CREATE SCENE 1 VIDEO
      # ============================================================
      - name: Create Scene 1 video
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -i scene1.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            scene1.mp4


      # ============================================================
      # 6. CREATE SCENE 2 VIDEO
      # ============================================================
      - name: Create Scene 2 video
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -i scene2.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0010,1.10)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            scene2.mp4


      # ============================================================
      # 7. CREATE SCENE 3 VIDEO
      # ============================================================
      - name: Create Scene 3 video
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 \
            -i scene3.jpg \
            -t 3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0012,1.12)':d=90:s=1080x1920:fps=30" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            scene3.mp4


      # ============================================================
      # 8. JOIN SCENES
      # ============================================================
      - name: Join scenes
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -i scene1.mp4 \
            -i scene2.mp4 \
            -i scene3.mp4 \
            -filter_complex "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v]" \
            -map "[v]" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            silent_video.mp4

          test -s silent_video.mp4


      # ============================================================
      # 9. ADD HINDI VOICE
      # ============================================================
      - name: Add Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -i silent_video.mp4 \
            -i voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -af "apad=whole_dur=9" \
            -t 9 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            final_toddler_short.mp4

          test -s final_toddler_short.mp4

          echo "Final video created."


      # ============================================================
      # 10. VERIFY VIDEO
      # ============================================================
      - name: Verify final video
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VIDEO INFORMATION"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            final_toddler_short.mp4

          python3 - <<'PY'
          import subprocess
          import sys

          def probe(args):
              command = [
                  "ffprobe",
                  "-v",
                  "error",
                  *args,
                  "final_toddler_short.mp4"
              ]

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True,
                  check=True
              )

              return result.stdout.strip()

          duration = float(
              probe([
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1"
              ])
          )

          dimensions = probe([
              "-show_entries",
              "stream=width,height",
              "-of",
              "csv=s=x:p=0"
          ])

          print(
              "Duration:",
              round(duration, 2),
              "seconds"
          )

          print(
              "Dimensions:",
              dimensions
          )

          if abs(duration - 9.0) > 0.15:
              raise SystemExit(
                  "ERROR: Final video is not approximately 9 seconds."
              )

          if dimensions != "1080x1920":
              raise SystemExit(
                  "ERROR: Final video is not 1080x1920."
              )

          print(
              "FINAL VIDEO VALIDATION PASSED"
          )
          PY


      # ============================================================
      # 11. CREATE YOUTUBE METADATA
      # ============================================================
      - name: Create YouTube metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          metadata = {
              "title": "जब बच्चे ने होमवर्क का राज़ बताया 😂 #shorts",

              "description": (
                  "एक छोटे बच्चे का मज़ेदार और मासूम जवाब 😂\n\n"
                  "ऐसे ही funny Hindi Shorts के लिए subscribe करें!\n\n"
                  "#shorts #funny #comedy #kids #hindi #toddler"
              ),

              "tags": [
                  "shorts",
                  "funny",
                  "comedy",
                  "kids",
                  "toddler",
                  "hindi",
                  "hindi comedy",
                  "funny kids",
                  "indian toddler"
              ],

              "language": "Hindi",
              "format": "YouTube Shorts",
              "aspect_ratio": "9:16",
              "duration_seconds": 9,
              "captions": False,
              "visual_model": "Cloudflare FLUX.1 Schnell"
          }

          with open(
              "youtube_metadata.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  metadata,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "YouTube metadata created."
          )
          PY


      # ============================================================
      # 12. UPLOAD FINAL ARTIFACT
      # ============================================================
      - name: Upload final test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toddler-video-test
     
