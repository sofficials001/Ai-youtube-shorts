name: Test Toddler Scenes

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Scene 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          echo "Generating Scene 1..."

          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of a cute fictional young Indian character with a small round face, round cheeks, large expressive brown eyes, short black hair, cheerful innocent smile, wearing a bright yellow T-shirt and blue shorts, standing in a realistic Indian neighborhood street, warm natural daylight, realistic skin texture, professional photography, shallow depth of field"
            }' \
            -o scene1.json

          echo "Cloudflare response received."

          python - <<'PY'
          import json
          import base64
          import sys

          with open("scene1.json", "r") as f:
              data = json.load(f)

          if "errors" in data and data["errors"]:
              print("CLOUDFLARE ERROR:")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          result = data.get("result")

          if not result:
              print("ERROR: Missing result")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          if isinstance(result, dict):
              image = result.get("image")
          elif isinstance(result, str):
              image = result
          else:
              image = None

          if not image:
              print("ERROR: No image found")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          with open("scene1.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("SCENE 1 CREATED")
          PY

      - name: Generate Scene 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          echo "Generating Scene 2..."

          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic close-up of the same cute fictional young Indian character with a small round face, round cheeks, large expressive brown eyes, short black hair, wearing a bright yellow T-shirt and blue shorts, making a hilarious confused facial expression while looking toward an adult nearby, realistic Indian home entrance, warm natural daylight, realistic skin texture, professional photography, shallow depth of field"
            }' \
            -o scene2.json

          python - <<'PY'
          import json
          import base64
          import sys

          with open("scene2.json", "r") as f:
              data = json.load(f)

          if "errors" in data and data["errors"]:
              print("CLOUDFLARE ERROR:")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          result = data.get("result")

          if isinstance(result, dict):
              image = result.get("image")
          elif isinstance(result, str):
              image = result
          else:
              image = None

          if not image:
              print("ERROR: No image found")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          with open("scene2.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("SCENE 2 CREATED")
          PY

      - name: Generate Scene 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          echo "Generating Scene 3..."

          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of the same cute fictional young Indian character with a small round face, round cheeks, large expressive brown eyes, short black hair, bright yellow T-shirt and blue shorts, giving an extremely funny innocent smile after saying something clever, playful expression, realistic Indian street background, warm natural daylight, realistic skin texture, professional photography, shallow depth of field"
            }' \
            -o scene3.json

          python - <<'PY'
          import json
          import base64
          import sys

          with open("scene3.json", "r") as f:
              data = json.load(f)

          if "errors" in data and data["errors"]:
              print("CLOUDFLARE ERROR:")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          result = data.get("result")

          if isinstance(result, dict):
              image = result.get("image")
          elif isinstance(result, str):
              image = result
          else:
              image = None

          if not image:
              print("ERROR: No image found")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          with open("scene3.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("SCENE 3 CREATED")
          PY

      - name: Upload all scenes
        uses: actions/upload-artifact@v4
        with:
          name: toddler-scenes
          path: |
            scene1.png
            scene2.png
            scene3.png
