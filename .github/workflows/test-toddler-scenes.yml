name: Test Toddler Scenes

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Scene 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of the same fictional 3-year-old Indian toddler boy, very small and slightly chubby round body, cute round cheeks, huge expressive brown eyes, short black hair, adorable innocent smile, wearing a bright yellow T-shirt and blue shorts, standing in a realistic Indian neighborhood street, warm natural daylight, realistic skin texture, professional photography, shallow depth of field"
            }' \
            -o scene1.json

          python -c "import json,base64; d=json.load(open('scene1.json')); open('scene1.png','wb').write(base64.b64decode(d['result']['image']))"

      - name: Generate Scene 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic close-up of the same fictional 3-year-old Indian toddler boy, very small and slightly chubby round body, cute round cheeks, huge expressive brown eyes, short black hair, wearing a bright yellow T-shirt and blue shorts, making a hilarious confused facial expression while looking at an adult standing nearby, realistic Indian home entrance, warm natural daylight, realistic skin texture, professional photography, shallow depth of field"
            }' \
            -o scene2.json

          python -c "import json,base64; d=json.load(open('scene2.json')); open('scene2.png','wb').write(base64.b64decode(d['result']['image']))"

      - name: Generate Scene 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of the same fictional 3-year-old Indian toddler boy, very small and slightly chubby round body, cute round cheeks, huge expressive brown eyes, short black hair, bright yellow T-shirt and blue shorts, giving an extremely funny innocent smile after saying something clever, playful expression, realistic Indian street background, warm natural daylight, realistic skin texture, professional photography, shallow depth of field"
            }' \
            -o scene3.json

          python -c "import json,base64; d=json.load(open('scene3.json')); open('scene3.png','wb').write(base64.b64decode(d['result']['image']))"

      - name: Upload all scenes
        uses: actions/upload-artifact@v4
        with:
          name: toddler-scenes
          path: |
            scene1.png
            scene2.png
            scene3.png
