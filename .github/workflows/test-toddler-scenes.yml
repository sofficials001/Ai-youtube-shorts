name: Test Toddler Scenes

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # SCENE 1
      # =========================
      - name: Generate Scene 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Generating Scene 1..."

          status=$(curl -sS \
            -o scene1.json \
            -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of an adorable fictional 3-year-old Indian toddler boy, very small slightly chubby body, cute round cheeks, huge expressive brown eyes, short black hair, innocent happy smile, wearing a bright yellow T-shirt and blue shorts, standing in a realistic Indian neighborhood street, warm natural daylight, realistic skin texture, professional photography, shallow depth of field",
              "steps": 4
            }')

          echo "HTTP STATUS: $status"

          if [ "$status" != "200" ]; then
            echo "CLOUDFLARE ERROR:"
            cat scene1.json
            exit 1
          fi

          python - <<'PY'
          import json
          import base64

          with open("scene1.json", "r") as f:
              data = json.load(f)

          image = data["result"]["image"]

          with open("scene1.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 1 created successfully")
          PY


      # =========================
      # SCENE 2
      # =========================
      - name: Generate Scene 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Generating Scene 2..."

          status=$(curl -sS \
            -o scene2.json \
            -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic close-up of an adorable fictional 3-year-old Indian toddler boy, very small slightly chubby body, cute round cheeks, huge expressive brown eyes, short black hair, wearing a bright yellow T-shirt and blue shorts, making a hilarious confused expression while looking at an adult nearby, realistic Indian home entrance, warm natural daylight, realistic skin texture, professional photography, shallow depth of field",
              "steps": 4
            }')

          echo "HTTP STATUS: $status"

          if [ "$status" != "200" ]; then
            echo "CLOUDFLARE ERROR:"
            cat scene2.json
            exit 1
          fi

          python - <<'PY'
          import json
          import base64

          with open("scene2.json", "r") as f:
              data = json.load(f)

          image = data["result"]["image"]

          with open("scene2.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 2 created successfully")
          PY


      # =========================
      # SCENE 3
      # =========================
      - name: Generate Scene 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Generating Scene 3..."

          status=$(curl -sS \
            -o scene3.json \
            -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of an adorable fictional 3-year-old Indian toddler boy, very small slightly chubby body, cute round cheeks, huge expressive brown eyes, short black hair, wearing a bright yellow T-shirt and blue shorts, giving an extremely funny innocent smile after saying something clever, playful expression, realistic Indian street background, warm natural daylight, realistic skin texture, professional photography, shallow depth of field",
              "steps": 4
            }')

          echo "HTTP STATUS: $status"

          if [ "$status" != "200" ]; then
            echo "CLOUDFLARE ERROR:"
            cat scene3.json
            exit 1
          fi

          python - <<'PY'
          import json
          import base64

          with open("scene3.json", "r") as f:
              data = json.load(f)

          image = data["result"]["image"]

          with open("scene3.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 3 created successfully")
          PY


      # =========================
      # UPLOAD
      # =========================
      - name: Upload all scenes
        uses: actions/upload-artifact@v4
        with:
          name: toddler-scenes
          path: |
            scene1.png
            scene2.png
            scene3.png
