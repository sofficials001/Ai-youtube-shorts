name: Test Toddler Scenes

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Scene 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Generating Scene 1..."

          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of a fictional 3-year-old Indian boy, small and slightly chubby, round cheeks, big expressive brown eyes, short black hair, happy innocent smile, yellow T-shirt, blue shorts, realistic Indian neighborhood street, natural daylight, professional photography",
              "steps": 1
            }' \
            -o scene1.json

          python - <<'PY'
          import json
          import base64

          with open("scene1.json", "r") as f:
              data = json.load(f)

          if not data.get("success"):
              print(json.dumps(data, indent=2))
              raise SystemExit("Scene 1 generation failed")

          image = data["result"]["image"]

          with open("scene1.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 1 created successfully")
          PY


      - name: Generate Scene 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Generating Scene 2..."

          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic close-up of a fictional 3-year-old Indian boy, small and slightly chubby, round cheeks, big expressive brown eyes, short black hair, funny confused expression, yellow T-shirt, blue shorts, standing near an Indian home entrance, natural daylight, professional photography",
              "steps": 1
            }' \
            -o scene2.json

          python - <<'PY'
          import json
          import base64

          with open("scene2.json", "r") as f:
              data = json.load(f)

          if not data.get("success"):
              print(json.dumps(data, indent=2))
              raise SystemExit("Scene 2 generation failed")

          image = data["result"]["image"]

          with open("scene2.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 2 created successfully")
          PY


      - name: Generate Scene 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Generating Scene 3..."

          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "photorealistic cinematic photograph of a fictional 3-year-old Indian boy, small and slightly chubby, round cheeks, big expressive brown eyes, short black hair, laughing happily while holding a small colorful toy, yellow T-shirt, blue shorts, cheerful Indian neighborhood background, natural daylight, professional photography",
              "steps": 1
            }' \
            -o scene3.json

          echo "Cloudflare response for Scene 3:"
          cat scene3.json
          echo ""

          python - <<'PY'
          import json
          import base64

          with open("scene3.json", "r") as f:
              data = json.load(f)

          if not data.get("success"):
              print(json.dumps(data, indent=2))
              raise SystemExit("Scene 3 generation failed")

          image = data["result"]["image"]

          with open("scene3.png", "wb") as f:
              f.write(base64.b64decode(image))

          print("Scene 3 created successfully")
          PY


      - name: Verify generated images
        run: |
          echo "Generated files:"
          ls -lh scene1.png scene2.png scene3.png

          file scene1.png
          file scene2.png
          file scene3.png


      - name: Upload all scenes
        uses: actions/upload-artifact@v4
        with:
          name: toddler-scenes
          path: |
            scene1.png
            scene2.png
            scene3.png
