name: Test Toddler Scenes

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Scene 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "adorable cute 3-year-old Indian toddler boy, very small and slightly chubby, round cheeks, huge expressive brown eyes, short black hair, happy innocent smile, bright yellow T-shirt, blue shorts, realistic Indian neighborhood, photorealistic cinematic photograph, natural daylight, realistic skin texture"
            }' \
            -o scene1.json

          echo "========== CLOUDFLARE RESPONSE =========="
          cat scene1.json
          echo ""
          echo "=========================================="

          python - <<'PY'
          import json
          import base64

          with open("scene1.json", "r") as f:
              data = json.load(f)

          print("Response type:", type(data).__name__)

          if isinstance(data, dict):
              print("Top-level keys:", list(data.keys()))

          result = data.get("result") if isinstance(data, dict) else None

          print("Result type:", type(result).__name__)

          if isinstance(result, dict):
              print("Result keys:", list(result.keys()))

              image = result.get("image")

              if image:
                  with open("scene1.png", "wb") as f:
                      f.write(base64.b64decode(image))

                  print("SCENE 1 IMAGE CREATED")
              else:
                  raise SystemExit(
                      "ERROR: result.image was not found"
                  )

          elif isinstance(result, str):
              print("Result is a Base64 string")

              with open("scene1.png", "wb") as f:
                  f.write(base64.b64decode(result))

              print("SCENE 1 IMAGE CREATED")

          else:
              raise SystemExit(
                  "ERROR: Unexpected Cloudflare response format"
              )
          PY

      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: toddler-scene-diagnostic
          path: |
            scene1.json
            scene1.png
