name: AI Quick Hindi Toddler Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. INSTALL OLLAMA
      # ==========================================================

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama ready."
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:11434/api/tags >/dev/null


      # ==========================================================
      # 3. DOWNLOAD QWEN
      # ==========================================================

      - name: Download Qwen 1.5B
        shell: bash
        run: |
          set -euo pipefail

          ollama pull qwen2.5:1.5b-instruct


      # ==========================================================
      # 4. GENERATE QUICK HINDI JOKE
      # ==========================================================

      - name: Generate quick Hindi toddler joke
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail

          cat > generate_joke.py <<'PY'
          import json
          import random
          import re
          import urllib.request

          API = "http://127.0.0.1:11434/api/chat"
          MODEL = "qwen2.5:1.5b-instruct"

          topics = [
              "पैसे",
              "चॉकलेट",
              "बिस्कुट",
              "खिलौना",
              "मोबाइल",
              "आइसक्रीम",
              "स्कूल",
              "सोना",
              "खाना",
              "टीवी",
              "जन्मदिन",
              "मम्मी की डांट",
              "पापा के पैसे",
              "बाजार",
              "पिज्जा"
          ]

          topic = random.choice(topics)

          system_prompt = (
              "तुम Hindi YouTube Shorts comedy writer हो। "
              "एक बहुत छोटा funny toddler joke लिखो। "
              "मुख्य character fictional 3-year-old Indian toddler है। "
              "बच्चा बहुत छोटा, थोड़ा chubby, गोल प्यारा चेहरा, "
              "बड़ी brown eyes, छोटे काले बाल और innocent expression वाला है। "
              "उसकी भाषा बहुत सरल और बच्चों जैसी हो। "
              "Joke structure HOOK, SETUP, PUNCHLINE हो। "
              "केवल 3 या 4 dialogue lines लिखो। "
              "पहली line hook हो और आखिरी line punchline हो। "
              "हर line छोटी हो। "
              "Natural Hindi इस्तेमाल करो। "
              "Narrator, stage direction, explanation, celebrity और real person नहीं। "
              "केवल dialogue लिखो।"
          )

          user_prompt = (
              "Topic: " + topic + "\n"
              "एक ORIGINAL 6-12 second Hindi toddler joke लिखो। "
              "Format: बच्चा 1, बच्चा 2, बच्चा 1 और जरूरत हो तो बच्चा 2। "
              "Joke एक ही simple idea पर आधारित हो। "
              "Toddler की innocent सोच से comedy पैदा हो। "
              "केवल dialogue।"
          )

          payload = {
              "model": MODEL,
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "stream": False,
              "options": {
                  "temperature": 0.90,
                  "top_p": 0.95,
                  "repeat_penalty": 1.30,
                  "num_predict": 120
              }
          }

          def call_model(data):
              body = json.dumps(
                  data,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  API,
                  data=body,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              return result["message"]["content"].strip()

          def validate(text):
              text = text.replace("\r", "")
              text = re.sub(
                  r"```(?:text|txt)?",
                  "",
                  text,
                  flags=re.IGNORECASE
              )
              text = text.replace("```", "")

              lines = [
                  x.strip()
                  for x in text.splitlines()
                  if x.strip()
              ]

              if not 3 <= len(lines) <= 4:
                  return None

              pattern = re.compile(
                  r"^(बच्चा 1|बच्चा 2):\s*\S+"
              )

              for i, line in enumerate(lines):
                  if not pattern.match(line):
                      return None

                  expected = (
                      "बच्चा 1"
                      if i % 2 == 0
                      else "बच्चा 2"
                  )

                  if not line.startswith(
                      expected + ":"
                  ):
                      return None

              hindi_count = len(
                  re.findall(
                      r"[\u0900-\u097F]",
                      text
                  )
              )

              if hindi_count < 20:
                  return None

              words = re.findall(
                  r"[\u0900-\u097F]+",
                  text
              )

              if len(words) > 55:
                  return None

              return "\n".join(lines)

          fallbacks = [
              [
                  "बच्चा 1: पापा, मुझे पैसे चाहिए!",
                  "बच्चा 2: क्यों?",
                  "बच्चा 1: आपके पास हैं ना!"
              ],
              [
                  "बच्चा 1: मम्मी, मैं बड़ा हो गया!",
                  "बच्चा 2: कैसे?",
                  "बच्चा 1: बिस्कुट खुद खोल लिया!"
              ],
              [
                  "बच्चा 1: पापा, मोबाइल दो!",
                  "बच्चा 2: क्यों?",
                  "बच्चा 1: गेम में आपकी हार देखनी है!"
              ],
              [
                  "बच्चा 1: मम्मी, भूख नहीं है।",
                  "बच्चा 2: पक्का?",
                  "बच्चा 1: पिज्जा हो तो आ जाएगी!"
              ],
              [
                  "बच्चा 1: पापा, मैं समझदार हूँ!",
                  "बच्चा 2: कैसे?",
                  "बच्चा 1: चॉकलेट छुपाकर खाता हूँ!"
              ]
          ]

          final_joke = None

          try:
              output = call_model(payload)
              final_joke = validate(output)
          except Exception as error:
              print("Generation failed:", error)

          if final_joke is None:
              retry_payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": (
                              "केवल 3 lines का बहुत छोटा Hindi toddler joke लिखो। "
                              "Format: बच्चा 1, बच्चा 2, बच्चा 1। "
                              "पहली line hook और आखिरी line punchline हो। "
                              "तीन साल के प्यारे innocent बच्चे की comedy हो। "
                              "केवल dialogue।"
                          )
                      }
                  ],
                  "stream": False,
                  "options": {
                      "temperature": 1.0,
                      "top_p": 0.95,
                      "num_predict": 100
                  }
              }

              try:
                  output = call_model(retry_payload)
                  final_joke = validate(output)
              except Exception as error:
                  print("Retry failed:", error)

          if final_joke is None:
              final_joke = "\n".join(
                  random.choice(fallbacks)
              )

          with open(
              "script.txt",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(final_joke + "\n")

          print("========================================")
          print("QUICK HINDI TODDLER JOKE")
          print("========================================")
          print(final_joke)
          print("========================================")
          PY

          python3 generate_joke.py


      # ==========================================================
      # 5. INSTALL AUDIO TOOLS
      # ==========================================================

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts


      # ==========================================================
      # 6. GENERATE HINDI VOICE
      # ==========================================================

      - name: Generate Hindi voices
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audio

          i=0

          while IFS= read -r line || [ -n "$line" ]; do

            if [[ "$line" == बच्चा\ 1:* ]]; then
              voice="hi-IN-MadhurNeural"
              text="${line#बच्चा 1:}"

            elif [[ "$line" == बच्चा\ 2:* ]]; then
              voice="hi-IN-SwaraNeural"
              text="${line#बच्चा 2:}"

            else
              continue
            fi

            text="$(echo "$text" | sed 's/^[[:space:]]*//')"

            if [ -z "$text" ]; then
              continue
            fi

            output="audio/$(printf '%03d' "$i").mp3"

            echo "Generating voice $i..."

            edge-tts \
              --voice "$voice" \
              --rate="+10%" \
              --volume="+0%" \
              --pitch="+14Hz" \
              --text "$text" \
              --write-media "$output"

            test -s "$output"

            i=$((i + 1))

          done < script.txt

          if [ "$i" -lt 2 ]; then
            echo "ERROR: Not enough audio."
            exit 1
          fi


      # ==========================================================
      # 7. PROCESS AUDIO
      # ==========================================================

      - name: Process dialogue
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p processed

          i=0

          for file in audio/*.mp3; do

            ffmpeg \
              -y \
              -i "$file" \
              -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
              -ar 44100 \
              -ac 1 \
              "processed/$(printf '%03d' "$i").wav"

            i=$((i + 1))

          done


      # ==========================================================
      # 8. ADD QUICK PAUSES
      # ==========================================================

      - name: Add quick dialogue pauses
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p segments

          i=0

          for file in processed/*.wav; do

            ffmpeg \
              -y \
              -i "$file" \
              -af "apad=pad_dur=0.08" \
              "segments/$(printf '%03d' "$i").wav"

            i=$((i + 1))

          done


      # ==========================================================
      # 9. COMBINE VOICE
      # ==========================================================

      - name: Create final Hindi voice
        shell: bash
        run: |
          set -euo pipefail

          : > concat.txt

          for file in segments/*.wav; do
            echo "file '$PWD/$file'" >> concat.txt
          done

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c:a pcm_s16le \
            voice.wav

          echo "Voice duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.wav


      # ==========================================================
      # 10. CREATE SCENE PLAN
      # ==========================================================

      - name: Create quick-joke scene plan
        shell: bash
        run: |
          set -euo pipefail

          cat > scene_planner.py <<'PY'
          import json

          with open(
              "script.txt",
              "r",
              encoding="utf-8"
          ) as file:
              lines = [
                  line.strip()
                  for line in file
                  if line.strip()
              ]

          toddler = (
              "fictional 3-year-old Indian toddler, "
              "very small slightly chubby round body, "
              "cute round face, large expressive brown eyes, "
              "short black hair, soft natural facial features, "
              "adorable innocent expression, realistic toddler proportions, "
              "realistic skin texture, simple colorful T-shirt and shorts"
          )

          adult = (
              "fictional Indian adult supporting character, "
              "realistic natural appearance"
          )

          shots = [
              "extreme close-up",
              "close-up",
              "medium close-up",
              "reaction close-up"
          ]

          actions = [
              "looks directly at the other character",
              "speaks with innocent confidence",
              "makes a confused cute expression",
              "gives a funny surprised reaction"
          ]

          expressions = [
              "curious innocent expression",
              "confident innocent smile",
              "confused cute expression",
              "funny surprised reaction"
          ]

          scenes = []

          for i, line in enumerate(lines):

              if line.startswith("बच्चा 1:"):
                  speaker = "बच्चा 1"
                  character = toddler
              else:
                  speaker = "बच्चा 2"
                  character = adult

              prompt_parts = [
                  "Photorealistic cinematic vertical 9:16 shot of",
                  character,
                  "realistic Indian environment",
                  "natural daylight",
                  "realistic skin texture",
                  "realistic clothing",
                  "natural body movement",
                  "cinematic shallow depth of field",
                  "high-detail realistic photography",
                  "cute funny innocent acting",
                  "consistent character appearance",
                  "no text",
                  "no subtitles",
                  "no captions",
                  "no watermark"
              ]

              visual_prompt = ", ".join(
                  prompt_parts
              ) + "."

              scene = {
                  "scene": i + 1,
                  "dialogue": line,
                  "speaker": speaker,
                  "duration": 2.5,
                  "shot": shots[i % len(shots)],
                  "camera": "fast smooth cinematic camera movement",
                  "character": character,
                  "action": actions[i % len(actions)],
                  "expression": expressions[i % len(expressions)],
                  "environment": "realistic Indian home, neighborhood or small shop",
                  "visual_prompt": visual_prompt
              }

              scenes.append(scene)

          data = {
              "title": "Quick Funny Toddler Joke",
              "duration_target": "6-12 seconds",
              "aspect_ratio": "9:16",
              "format": "hook setup punchline",
              "main_character": toddler,
              "scenes": scenes
          }

          with open(
              "scenes.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "visual_prompts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for scene in scenes:

                  file.write(
                      "SCENE "
                      + str(scene["scene"])
                      + "\n"
                  )

                  file.write(
                      scene["visual_prompt"]
                      + "\n\n"
                  )

          print(
              "Created "
              + str(len(scenes))
              + " scenes."
          )
          PY

          python3 scene_planner.py


      # ==========================================================
      # 11. CREATE VERTICAL MP4
      # ==========================================================

      - name: Create quick vertical MP4
        shell: bash
        run: |
          set -euo pipefail

          duration=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              voice.wav
          )

          echo "Video duration: $duration seconds"

          ffmpeg \
            -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -i voice.wav \
            -t "$duration" \
            -vf "format=yuv420p" \
            -c:v libx264 \
            -preset ultrafast \
            -crf 28 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            toddler_short.mp4

          test -s toddler_short.mp4


      # ==========================================================
      # 12. YOUTUBE METADATA
      # ==========================================================

      - name: Create YouTube metadata
        shell: bash
        run: |
          set -euo pipefail

          cat > create_metadata.py <<'PY'
          import json
          import random

          with open(
              "script.txt",
              "r",
              encoding="utf-8"
          ) as file:
              script = file.read().strip()

          titles = [
              "😂 ये बच्चा तो बहुत चालाक है! #shorts",
              "🤣 इस बच्चे का जवाब सुनो! #shorts",
              "😂 3 साल के बच्चे ने गजब कर दिया! #shorts",
              "🤣 बच्चे का logic देखो! #shorts",
              "😂 इसका जवाब सुनकर हंसी नहीं रुकेगी! #shorts"
          ]

          metadata = {
              "title": random.choice(titles),
              "description": (
                  "एक प्यारे छोटे बच्चे की मजेदार और मासूम बातचीत 😂\n\n"
                  "ऐसे ही funny Hindi Shorts के लिए subscribe करें!\n\n"
                  "#shorts #funny #comedy #toddler #kids #hindicomedy"
              ),
              "tags": [
                  "shorts",
                  "funny",
                  "comedy",
                  "toddler",
                  "kids",
                  "hindi comedy",
                  "funny kids",
                  "indian toddler",
                  "hindi shorts"
              ],
              "categoryId": "23",
              "privacyStatus": "private",
              "script": script
          }
