name: AI Quick Hindi Toddler Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. INSTALL OLLAMA
      # ==========================================================

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          echo "Waiting for Ollama..."

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready."
              break
            fi

            sleep 2
          done

          curl -sf http://127.0.0.1:11434/api/tags >/dev/null

          echo "Ollama started successfully."


      # ==========================================================
      # 3. DOWNLOAD QWEN
      # ==========================================================

      - name: Download Qwen 1.5B
        shell: bash
        run: |
          set -euo pipefail

          ollama pull qwen2.5:1.5b-instruct


      # ==========================================================
      # 4. GENERATE QUICK HINDI JOKE
      # ==========================================================

      - name: Generate quick Hindi toddler joke
        shell: bash
        timeout-minutes: 4
        run: |

          cat > generate_joke.py <<'PY'

          import json
          import random
          import re
          import urllib.request

          API = "http://127.0.0.1:11434/api/chat"
          MODEL = "qwen2.5:1.5b-instruct"

          TOPICS = [
              "पैसे",
              "चॉकलेट",
              "बिस्कुट",
              "खिलौना",
              "मोबाइल",
              "आइसक्रीम",
              "स्कूल",
              "सोना",
              "खाना",
              "टीवी",
              "जन्मदिन",
              "मम्मी की डांट",
              "पापा के पैसे",
              "बाजार",
              "पिज्जा",
              "खिलौने की दुकान"
          ]

          topic = random.choice(TOPICS)

          system_prompt = """
          तुम Hindi YouTube Shorts के professional comedy writer हो।

          एक बहुत छोटा और funny toddler joke लिखो।

          MAIN CHARACTER:

          fictional 3-year-old Indian toddler.

          Appearance:

          - बहुत छोटा
          - थोड़ा chubby
          - गोल प्यारा चेहरा
          - बड़ी expressive brown eyes
          - छोटे काले बाल
          - cute innocent expression
          - realistic toddler proportions

          बच्चा सच में तीन साल का लगे।

          उसकी भाषा:
          - बहुत सरल
          - छोटी
          - मासूम
          - बच्चों जैसी
          - natural Hindi

          बच्चा बड़े आदमी जैसी complicated बातें नहीं करेगा।

          JOKE STRUCTURE:

          HOOK
          SETUP
          PUNCHLINE

          RULES:

          - केवल 3 या 4 dialogue lines
          - target duration 6-12 seconds
          - पहली line तुरंत attention पकड़े
          - setup बहुत छोटा हो
          - अंतिम line strongest punchline हो
          - joke एक ही simple idea पर हो
          - innocent toddler humor
          - natural Hindi
          - narrator नहीं
          - stage direction नहीं
          - explanation नहीं
          - celebrity नहीं
          - real person नहीं
          - captions नहीं
          - subtitles नहीं
          - hashtags नहीं

          Format exactly:

          बच्चा 1: ...
          बच्चा 2: ...
          बच्चा 1: ...

          या:

          बच्चा 1: ...
          बच्चा 2: ...
          बच्चा 1: ...
          बच्चा 2: ...

          केवल dialogue लिखो।
          """

          user_prompt = f"""
          Topic: {topic}

          इस topic पर एक ORIGINAL बहुत छोटा Hindi
          toddler comedy joke लिखो।

          पहली line hook हो।

          बीच में केवल जरूरी setup हो।

          आखिरी line punchline हो।

          Joke सुनते ही समझ आना चाहिए।

          3 साल के बच्चे की innocent सोच से comedy बनाओ।

          कुल 3 या 4 lines।

          हर line छोटी रखो।

          केवल dialogue।
          """

          payload = {
              "model": MODEL,
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt.strip()
                  },
                  {
                      "role": "user",
                      "content": user_prompt.strip()
                  }
              ],
              "stream": False,
              "options": {
                  "temperature": 0.90,
                  "top_p": 0.95,
                  "repeat_penalty": 1.30,
                  "num_predict": 120
              }
          }

          def call_model():

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  API,
                  data=body,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:

                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              return result.get(
                  "message",
                  {}
              ).get(
                  "content",
                  ""
              ).strip()


          def clean(text):

              text = text.replace(
                  "\r",
                  ""
              )

              text = re.sub(
                  r"```(?:text|txt)?",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = text.replace(
                  "```",
                  ""
              )

              return text.strip()


          def validate(text):

              text = clean(text)

              lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              if not 3 <= len(lines) <= 4:
                  return None

              pattern = re.compile(
                  r"^(बच्चा 1|बच्चा 2):\s*\S+"
              )

              for line in lines:

                  if not pattern.match(line):
                      return None

              for i, line in enumerate(lines):

                  expected = (
                      "बच्चा 1"
                      if i % 2 == 0
                      else "बच्चा 2"
                  )

                  if not line.startswith(
                      expected + ":"
                  ):
                      return None

              hindi_chars = len(
                  re.findall(
                      r"[\u0900-\u097F]",
                      text
                  )
              )

              if hindi_chars < 20:
                  return None

              words = re.findall(
                  r"[\u0900-\u097F]+",
                  text
              )

              if len(words) > 55:
                  return None

              normalized = [
                  re.sub(
                      r"\s+",
                      " ",
                      line.lower()
                  ).strip()
                  for line in lines
              ]

              if len(
                  set(normalized)
              ) != len(normalized):
                  return None

              return "\n".join(lines)


          # ======================================================
          # FALLBACK JOKES
          # ======================================================

          FALLBACKS = [

              [
                  "बच्चा 1: पापा, मुझे पैसे चाहिए!",
                  "बच्चा 2: क्यों?",
                  "बच्चा 1: आपके पास हैं ना!"
              ],

              [
                  "बच्चा 1: मम्मी, मैं बड़ा हो गया!",
                  "बच्चा 2: कैसे?",
                  "बच्चा 1: बिस्कुट खुद खोल लिया!"
              ],

              [
                  "बच्चा 1: पापा, मोबाइल दो!",
                  "बच्चा 2: क्यों?",
                  "बच्चा 1: गेम में आपकी हार देखनी है!"
              ],

              [
                  "बच्चा 1: मम्मी, मुझे भूख नहीं है।",
                  "बच्चा 2: पक्का?",
                  "बच्चा 1: पिज्जा हो तो भूख आ जाएगी!"
              ],

              [
                  "बच्चा 1: पापा, मैं समझदार हूँ!",
                  "बच्चा 2: कैसे?",
                  "बच्चा 1: चॉकलेट छुपाकर खाता हूँ!"
              ],

              [
                  "बच्चा 1: अंकल, आइसक्रीम फ्री है?",
                  "बच्चा 2: नहीं बेटा।",
                  "बच्चा 1: फिर मैं बस देख लेता हूँ!"
              ],

              [
                  "बच्चा 1: पापा, स्कूल नहीं जाना!",
                  "बच्चा 2: क्यों?",
                  "बच्चा 1: स्कूल को मेरी याद आती है!"
              ],

              [
                  "बच्चा 1: मम्मी, नींद नहीं आ रही।",
                  "बच्चा 2: मोबाइल मत देखो।",
                  "बच्चा 1: फिर नींद कैसे आएगी?"
              ]

          ]


          # ======================================================
          # FIRST GENERATION
          # ======================================================

          final_joke = None

          try:

              output = call_model()

              final_joke = validate(
                  output
              )

          except Exception as e:

              print(
                  "Generation error:",
                  e
              )


          # ======================================================
          # RETRY
          # ======================================================

          if final_joke is None:

              retry_payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": """
                          केवल 3 lines का बहुत छोटा Hindi joke लिखो।

                          Format:

                          बच्चा 1: ...
                          बच्चा 2: ...
                          बच्चा 1: ...

                          बच्चा तीन साल का प्यारा और
                          innocent toddler है।

                          पहली line hook हो।

                          आखिरी line punchline हो।

                          हर line छोटी हो।

                          केवल dialogue।
                          """
                      }
                  ],
                  "stream": False,
                  "options": {
                      "temperature": 1.0,
                      "top_p": 0.95,
                      "num_predict": 100
                  }
              }

              try:

                  body = json.dumps(
                      retry_payload,
                      ensure_ascii=False
                  ).encode("utf-8")

                  request = urllib.request.Request(
                      API,
                      data=body,
                      headers={
                          "Content-Type": "application/json"
                      },
                      method="POST"
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:

                      result = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

                  output = result[
                      "message"
                  ][
                      "content"
                  ].strip()

                  final_joke = validate(
                      output
                  )

              except Exception as e:

                  print(
                      "Retry failed:",
                      e
                  )


          # ======================================================
          # FALLBACK
          # ======================================================

          if final_joke is None:

              print(
                  "AI output failed validation."
              )

              print(
                  "Using fallback joke."
              )

              final_joke = "\n".join(
                  random.choice(
                      FALLBACKS
                  )
              )


          # ======================================================
          # SAVE
          # ======================================================

          with open(
              "script.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  final_joke + "\n"
              )


          print()
          print(
              "========================================"
          )
          print(
              "QUICK HINDI TODDLER JOKE"
          )
          print(
              "========================================"
          )
          print(
              final_joke
          )
          print(
              "========================================"
          )

          PY

          python3 generate_joke.py


      # ==========================================================
      # 5. INSTALL AUDIO TOOLS
      # ==========================================================

      - name: Install audio tools
        shell: bash
        run: |

          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y ffmpeg

          python3 -m pip install --upgrade pip

          python3 -m pip install edge-tts


      # ==========================================================
      # 6. GENERATE HINDI VOICES
      # ==========================================================

      - name: Generate Hindi voices
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p audio

          i=0

          while IFS= read -r line || [ -n "$line" ]; do

            if [[ "$line" == बच्चा\ 1:* ]]; then

              voice="hi-IN-MadhurNeural"
              text="${line#बच्चा 1:}"

            elif [[ "$line" == बच्चा\ 2:* ]]; then

              voice="hi-IN-SwaraNeural"
              text="${line#बच्चा 2:}"

            else

              continue

            fi

            text="$(
              echo "$text" |
              sed 's/^[[:space:]]*//'
            )"

            if [ -z "$text" ]; then
              continue
            fi

            output="audio/$(printf '%03d' "$i").mp3"

            echo "Generating dialogue $i..."

            edge-tts \
              --voice "$voice" \
              --rate="+10%" \
              --volume="+0%" \
              --pitch="+14Hz" \
              --text "$text" \
              --write-media "$output"

            test -s "$output"

            i=$((i + 1))

          done < script.txt

          if [ "$i" -lt 2 ]; then
            echo "ERROR: Not enough dialogue audio."
            exit 1
          fi

          echo "Generated $i audio clips."


      # ==========================================================
      # 7. PROCESS AUDIO
      # ==========================================================

      - name: Process dialogue
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p processed

          i=0

          for file in audio/*.mp3; do

            ffmpeg \
              -y \
              -i "$file" \
              -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
              -ar 44100 \
              -ac 1 \
              "processed/$(printf '%03d' "$i").wav"

            i=$((i + 1))

          done


      # ==========================================================
      # 8. ADD VERY SHORT PAUSES
      # ==========================================================

      - name: Add quick dialogue pauses
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p segments

          i=0

          for file in processed/*.wav; do

            ffmpeg \
              -y \
              -i "$file" \
              -af "apad=pad_dur=0.08" \
              "segments/$(printf '%03d' "$i").wav"

            i=$((i + 1))

          done


      # ==========================================================
      # 9. COMBINE FINAL HINDI VOICE
      # ==========================================================

      - name: Create final Hindi voice
        shell: bash
        run: |

          set -euo pipefail

          : > concat.txt

          for file in segments/*.wav; do

            echo "file '$PWD/$file'" \
              >> concat.txt

          done

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c:a pcm_s16le \
            voice.wav

          echo ""
          echo "Voice duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.wav


      # ==========================================================
      # 10. CREATE TODDLER SCENE PLAN
      # ==========================================================

      - name: Create quick-joke scene plan
        shell: bash
        run: |

          set -euo pipefail

          python3 - <<'PY'

          import json

          with open(
              "script.txt",
              "r",
              encoding="utf-8"
          ) as f:

              lines = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]


          toddler = """
          fictional 3-year-old Indian toddler,
          very small and slightly chubby round body,
          cute round face,
          large expressive brown eyes,
          short black hair,
          soft natural facial features,
          adorable innocent expression,
          realistic toddler proportions,
          realistic skin texture,
          simple colorful T-shirt and shorts
          """.strip()


          shots = [
              "extreme close-up",
              "close-up",
              "medium close-up",
              "reaction close-up"
          ]


          actions = [
              "looks directly at the other character",
              "speaks with innocent confidence",
              "makes a confused cute expression",
              "gives a funny surprised reaction"
          ]


          expressions = [
              "curious innocent expression",
              "confident innocent smile",
              "confused cute expression",
              "funny surprised reaction"
          ]


          scenes = []


          for i, line in enumerate(lines):

              if line.startswith("बच्चा 1:"):

                  speaker = "बच्चा 1"

                  character = toddler

              else:

                  speaker = "बच्चा 2"

                  character = """
                  fictional Indian adult supporting character,
                  realistic natural appearance
                  """.strip()


              visual_prompt = (
                  "Photorealistic cinematic vertical 9:16 shot of "
                  + character
                  + ", realistic Indian environment, "
                  + "natural daylight, realistic skin texture, "
                  + "realistic clothing, natural body movement, "
                  + "cinematic shallo
