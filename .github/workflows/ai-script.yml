name: AI Hindi Toddler Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. INSTALL OLLAMA
      # ==========================================================

      - name: Install Ollama
        shell: bash
        run: |
          set -e

          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          echo "Waiting for Ollama..."

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama ready."
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:11434/api/tags >/dev/null

      # ==========================================================
      # 3. DOWNLOAD SMALL LOCAL AI MODEL
      # ==========================================================

      - name: Download Qwen
        shell: bash
        run: |
          set -e

          ollama pull qwen2.5:1.5b-instruct

      # ==========================================================
      # 4. GENERATE UNIQUE HINDI STORY
      # ==========================================================

      - name: Generate Hindi toddler comedy
        shell: bash
        run: |

          cat > generate.py <<'PY'

          import json
          import random
          import re
          import urllib.request

          API = "http://127.0.0.1:11434/api/chat"
          MODEL = "qwen2.5:1.5b-instruct"

          IDEAS = [
              "बच्चा दुकान पर जाकर ऐसी चीज मांगता है जिसे देखकर दुकानदार हैरान हो जाता है।",
              "बच्चा पापा से बहुत मासूम तरीके से महंगी चीज मांगता है।",
              "बच्चा खाना खाने से मना करता है लेकिन खाना देखते ही अपना फैसला बदल देता है।",
              "बच्चा किसी बड़े आदमी की बात का गलत मतलब समझ लेता है।",
              "बच्चा खुद को बहुत बड़ा समझता है लेकिन उसकी मासूम हरकत पोल खोल देती है।",
              "बच्चा अपनी छोटी समस्या को दुनिया की सबसे बड़ी समस्या समझता है।",
              "बच्चा बाजार में ऐसी मासूम बात बोलता है कि सब हंस पड़ते हैं।",
              "बच्चा अपने खिलौने को अपना सबसे अच्छा दोस्त मानकर उसकी मजेदार वजह बताता है।",
              "बच्चा शरारत करने के बाद बहुत मासूम बनकर बचने की कोशिश करता है।",
              "बच्चा पापा से पैसे मांगने के लिए अजीब लेकिन मासूम logic देता है।",
              "बच्चा कहता है कि उसे भूख नहीं है और फिर खाने के सामने बैठ जाता है।",
              "बच्चा किसी बड़े को बहुत मासूम सलाह देता है।"
          ]

          idea = random.choice(IDEAS)

          prompt = f"""
          तुम Hindi YouTube Shorts comedy writer हो।

          एक ORIGINAL funny toddler comedy short लिखो।

          STORY IDEA:
          {idea}

          MAIN CHARACTER:

          fictional 3-year-old Indian toddler.

          बच्चा:
          - बहुत छोटा
          - थोड़ा chubby
          - गोल प्यारा चेहरा
          - बड़ी expressive brown eyes
          - छोटे काले बाल
          - innocent personality
          - realistic toddler language

          IMPORTANT:

          बच्चा सच में 3 साल का लगे।

          उसकी भाषा:
          - छोटी
          - सरल
          - मासूम
          - natural
          - बच्चों जैसी

          बड़े आदमी जैसी complicated बातें नहीं।

          FORMAT:

          बच्चा 1: ...
          बच्चा 2: ...
          बच्चा 1: ...
          बच्चा 2: ...

          RULES:

          - 8 से 12 dialogue lines
          - 20 से 35 seconds
          - पहली line strong hook
          - fast comedy
          - natural conversation
          - innocent misunderstanding
          - अंतिम line strong punchline
          - Hindi
          - narrator नहीं
          - stage directions नहीं
          - celebrity names नहीं
          - real people नहीं
          - हर run में नया idea
          - captions नहीं
          - subtitles नहीं

          केवल dialogue दो।
          """

          payload = {
              "model": MODEL,
              "messages": [
                  {
                      "role": "system",
                      "content": "केवल natural Hindi toddler comedy dialogue लिखो।"
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "stream": False,
              "options": {
                  "temperature": 0.85,
                  "top_p": 0.92,
                  "repeat_penalty": 1.25,
                  "num_predict": 220
              }
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              API,
              data=data,
              headers={
                  "Content-Type": "application/json"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:

                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              output = result["message"]["content"].strip()

          except Exception as e:

              print("AI failed:", e)

              output = """बच्चा 1: पापा, मेरे पास पैसे नहीं हैं।
          बच्चा 2: तो क्या चाहिए?
          बच्चा 1: पैसे चाहिए।
          बच्चा 2: पैसे क्यों चाहिए?
          बच्चा 1: खिलौना खरीदना है।
          बच्चा 2: पैसे कहाँ से आएंगे?
          बच्चा 1: आपके पास हैं ना।
          बच्चा 2: मतलब मेरे पैसे तुम्हारे?
          बच्चा 1: हाँ, मैं छोटा हूँ ना।
          बच्चा 2: वाह, बहुत तेज हो!"""

          output = output.strip()

          output = re.sub(
              r"```.*?```",
              "",
              output,
              flags=re.S
          ).strip()

          lines = [
              x.strip()
              for x in output.splitlines()
              if x.strip()
          ]

          valid = []

          for line in lines:

              if re.match(
                  r"^(बच्चा 1|बच्चा 2):",
                  line
              ):
                  valid.append(line)

          if not 8 <= len(valid) <= 12:

              valid = [
                  "बच्चा 1: पापा, मेरे पास पैसे नहीं हैं।",
                  "बच्चा 2: तो क्या चाहिए?",
                  "बच्चा 1: पैसे चाहिए।",
                  "बच्चा 2: पैसे क्यों चाहिए?",
                  "बच्चा 1: खिलौना खरीदना है।",
                  "बच्चा 2: पैसे कहाँ से आएंगे?",
                  "बच्चा 1: आपके पास हैं ना।",
                  "बच्चा 2: मतलब मेरे पैसे तुम्हारे?",
                  "बच्चा 1: हाँ, मैं छोटा हूँ ना।",
                  "बच्चा 2: वाह, बहुत तेज हो!"
              ]

          with open(
              "script.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(valid)
              )

          print("\n===== HINDI SCRIPT =====\n")

          print(
              "\n".join(valid)
          )

          PY

          python3 generate.py

      # ==========================================================
      # 5. INSTALL HINDI TTS
      # ==========================================================

      - name: Install Hindi TTS
        shell: bash
        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg

          python3 -m pip install --upgrade pip

          python3 -m pip install edge-tts

      # ==========================================================
      # 6. GENERATE HINDI VOICE
      # ==========================================================

      - name: Generate Hindi dialogue voices
        shell: bash
        run: |

          mkdir -p audio

          i=0

          while IFS= read -r line || [ -n "$line" ]; do

            if [[ "$line" == बच्चा\ 1:* ]]; then

              voice="hi-IN-MadhurNeural"
              text="${line#बच्चा 1:}"

            elif [[ "$line" == बच्चा\ 2:* ]]; then

              voice="hi-IN-SwaraNeural"
              text="${line#बच्चा 2:}"

            else

              continue

            fi

            text="$(echo "$text" | sed 's/^[[:space:]]*//')"

            output="audio/$(printf '%03d' "$i").mp3"

            edge-tts \
              --voice "$voice" \
              --rate="+6%" \
              --pitch="+12Hz" \
              --text "$text" \
              --write-media "$output"

            test -s "$output"

            i=$((i+1))

          done < script.txt

          echo "Generated $i voice clips."

      # ==========================================================
      # 7. NORMALIZE AUDIO
      # ==========================================================

      - name: Process audio
        shell: bash
        run: |

          mkdir -p processed

          i=0

          for file in audio/*.mp3; do

            ffmpeg \
              -y \
              -i "$file" \
              -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
              -ar 44100 \
              -ac 1 \
              "processed/$(printf '%03d' "$i").wav"

            i=$((i+1))

          done

      # ==========================================================
      # 8. ADD PAUSES
      # ==========================================================

      - name: Add natural pauses
        shell: bash
        run: |

          mkdir -p segments

          i=0

          for file in processed/*.wav; do

            ffmpeg \
              -y \
              -i "$file" \
              -af "apad=pad_dur=0.18" \
              "segments/$(printf '%03d' "$i").wav"

            i=$((i+1))

          done

      # ==========================================================
      # 9. COMBINE VOICE
      # ==========================================================

      - name: Create final Hindi voice
        shell: bash
        run: |

          : > concat.txt

          for file in segments/*.wav; do

            echo "file '$PWD/$file'" >> concat.txt

          done

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c:a pcm_s16le \
            voice.wav

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.wav

      # ==========================================================
      # 10. CREATE VISUAL SCENE PLAN
      # ==========================================================

      - name: Create toddler scene plan
        shell: bash
        run: |

          python3 - <<'PY'

          import json
          import re

          with open(
              "script.txt",
              encoding="utf-8"
          ) as f:

              lines = [
                  x.strip()
                  for x in f
                  if x.strip()
              ]

          toddler = (
              "fictional 3-year-old Indian toddler, "
              "very small body, slightly chubby round build, "
              "cute round face, large expressive brown eyes, "
              "short black hair, natural toddler proportions, "
              "adorable innocent expression, realistic skin, "
              "simple colorful T-shirt and shorts"
          )

          scenes = []

          shots = [
              "cinematic close-up",
              "medium shot",
              "reaction close-up",
              "over-the-shoulder",
              "medium close-up",
              "side shot",
              "slow push-in",
              "reaction shot"
          ]

          actions = [
              "looks curiously at the other character",
              "speaks with an innocent expression",
              "raises one hand while explaining",
              "looks confused",
              "smiles innocently",
              "makes a funny surprised face",
              "leans forward while speaking",
              "gives a playful toddler reaction"
          ]

          for i, line in enumerate(lines):

              speaker = (
                  "बच्चा 1"
                  if line.startswith("बच्चा 1:")
                  else "बच्चा 2"
              )

              character = (
                  toddler
                  if speaker == "बच्चा 1"
                  else
                  "fictional Indian adult supporting character"
              )

              scenes.append({

                  "scene": i + 1,

                  "dialogue": line,

                  "speaker": speaker,

                  "duration": 3,

                  "shot": shots[i % len(shots)],

                  "camera": (
                      "gentle cinematic camera movement"
                  ),

                  "character": character,

                  "action": actions[i % len(actions)],

                  "expression": (
                      "natural funny innocent expression"
                  ),

                  "environment": (
                      "realistic Indian neighborhood "
                      "or small local shop"
                  ),

                  "visual_prompt": (
                      "Photorealistic cinematic vertical "
                      "9:16 video frame of " +
                      character +
                      ", realistic Indian environment, "
                      "natural daylight, realistic skin texture, "
                      "realistic clothing, cinematic lighting, "
                      "shallow depth of field, natural body "
                      "movement, authentic photography, "
                      "funny innocent reaction, "
                      "consistent character appearance, "
                      "no text, no subtitles, no captions, "
                      "no watermark."
                  )

              })

          plan = {

              "title": "Funny Indian Toddler",

              "aspect_ratio": "9:16",

              "style": (
                  "photorealistic cinematic toddler comedy"
              ),

              "main_character": toddler,

              "scenes": scenes

          }

          with open(
              "scenes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  plan,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Created {len(scenes)} scenes."
          )

          PY

      # ==========================================================
      # 11. CREATE VISUAL PROMPTS
      # ==========================================================

      - name: Create visual prompt file
        shell: bash
        run: |

          python3 - <<'PY'

          import json

          with open(
              "scenes.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          with open(
              "visual_prompts.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for scene in data["scenes"]:

                  f.write(
                      f"SCENE {scene['scene']}\n"
                  )

                  f.write(
                      f"{scene['visual_prompt']}\n\n"
                  )

          PY

      # ==========================================================
      # 12. CREATE A VERTICAL TEST VIDEO
      # ==========================================================

      - name: Create video assembly
        shell: bash
        run: |

          duration=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              voice.wav
          )

          ffmpeg \
            -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -i voice.wav \
            -t "$duration" \
            -vf "format=yuv420p" \
            -c:v libx264 \
            -preset ultrafast \
            -c:a aac \
            -shortest \
            toddler_short.mp4

      # ==========================================================
      # 13. SAVE ARTIFACTS
      # ==========================================================

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: hindi-toddler-short
          path: |
            script.txt
            scenes.json
            visual_prompts.txt
            voice.wav
            toddler_short.mp4
          retention-days: 1
