name: AI Shorts Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          echo "Waiting for Ollama..."
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready."
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:11434/api/tags >/dev/null

      - name: Download Qwen 1.5B
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5:1.5b-instruct

      - name: Generate final Hindi Short
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail

          cat > /tmp/generate_short.py <<'PY'
          import json
          import random
          import re
          import sys
          import time
          import urllib.request
          import urllib.error

          MODEL = "qwen2.5:1.5b-instruct"
          API = "http://127.0.0.1:11434/api/chat"

          # Curated story situations keep the small local model focused.
          STORIES = [
              "एक बच्चा दावा करता है कि वह बहुत बुद्धिमान है, लेकिन उसका सबसे बड़ा सबूत उल्टा उसके खिलाफ चला जाता है।",
              "दो बच्चे बहस करते हैं कि होमवर्क किसने ज्यादा अच्छा किया, फिर पता चलता है कि दोनों ने एक ही गलती की है।",
              "एक बच्चा दूसरे को अपनी बहुत बड़ी चाल बताता है, लेकिन सामने वाला तुरंत उसकी चाल समझ जाता है।",
              "दो बच्चे परीक्षा के बाद अपनी उत्तर-पुस्तिका की तुलना करते हैं और एक बहुत मजेदार गलती पकड़ लेते हैं।",
              "एक बच्चा कहता है कि वह भविष्य देख सकता है और दूसरा बच्चा उसे एक ऐसा सवाल पूछ देता है जिसका जवाब वह नहीं दे पाता।",
              "एक बच्चा खुद को बहुत चालाक समझता है और दूसरे बच्चे से एक आसान पहेली पूछता है, लेकिन खुद ही फंस जाता है।",
              "दो बच्चे तय करते हैं कि आज से वे बिल्कुल झूठ नहीं बोलेंगे, फिर पहला ही वाक्य उन्हें मुश्किल में डाल देता है।",
              "एक बच्चा दावा करता है कि उसने पढ़ाई का सबसे आसान तरीका खोज लिया है, लेकिन उसका तरीका सुनकर दूसरा बच्चा हैरान रह जाता है।",
              "दो बच्चे तय करते हैं कि जो ज्यादा स्मार्ट होगा वही स्कूल का बॉस बनेगा, लेकिन अंत में दोनों को टीचर की एक बात याद आती है।",
              "एक बच्चा अपनी नई 'जादुई' ट्रिक दिखाता है और दूसरा बच्चा उसकी असली वजह बता देता है।"
          ]

          story = random.choice(STORIES)

          system_prompt = """
          तुम भारतीय YouTube Shorts के लिए प्रोफेशनल Hindi comedy writer हो।

          तुम्हारा काम केवल छोटा, बोलने योग्य और मजेदार संवाद लिखना है।

          बहुत महत्वपूर्ण:
          - केवल देवनागरी हिंदी में लिखो।
          - अंग्रेज़ी शब्दों से बचो।
          - केवल दो पात्र: बच्चा 1 और बच्चा 2।
          - कुल 8 से 12 संवाद पंक्तियाँ।
          - हर पंक्ति छोटी हो।
          - पहला संवाद तुरंत hook हो।
          - कहानी तेजी से आगे बढ़े।
          - अंत में स्पष्ट और मजेदार punchline हो।
          - कोई narrator नहीं।
          - कोई stage direction नहीं।
          - कोई explanation नहीं।
          - केवल dialogue।
          - एक ही वाक्य या बात को दोहराना मना है।
          """

          user_prompt = f"""
          इस कहानी की स्थिति पर 25 से 35 सेकंड का YouTube Short लिखो:

          {story}

          यह सटीक format इस्तेमाल करो:

          बच्चा 1: ...
          बच्चा 2: ...
          बच्चा 1: ...
          बच्चा 2: ...

          केवल अंतिम संवाद दो।
          """

          payload = {
              "model": MODEL,
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt.strip()
                  },
                  {
                      "role": "user",
                      "content": user_prompt.strip()
                  }
              ],
              "stream": False,
              "options": {
                  "temperature": 0.65,
                  "top_p": 0.9,
                  "repeat_penalty": 1.25,
                  "num_predict": 150
              }
          }

          def call_model():
              body = json.dumps(payload, ensure_ascii=False).encode("utf-8")

              request = urllib.request.Request(
                  API,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read().decode("utf-8"))

              return result.get("message", {}).get("content", "").strip()

          def clean(text):
              text = text.replace("\r", "")
              text = re.sub(r"```(?:text|txt)?", "", text, flags=re.IGNORECASE)
              text = text.replace("```", "")
              text = re.sub(r"^(अंतिम उत्तर|संवाद)\s*:\s*", "", text.strip())
              return text.strip()

          def validate(text):
              text = clean(text)

              raw_lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              # Remove accidental numbering/bullets.
              lines = []
              for line in raw_lines:
                  line = re.sub(r"^\s*[-•*]\s*", "", line)
                  line = re.sub(r"^\s*\d+[\.\)]\s*", "", line)
                  lines.append(line.strip())

              if not (8 <= len(lines) <= 12):
                  return None

              speaker_pattern = re.compile(r"^(बच्चा 1|बच्चा 2):\s*\S+")

              for line in lines:
                  if not speaker_pattern.match(line):
                      return None

              # Must alternate speakers.
              for i, line in enumerate(lines):
                  expected = "बच्चा 1" if i % 2 == 0 else "बच्चा 2"
                  if not line.startswith(expected + ":"):
                      return None

              # Reject excessive English characters.
              english_chars = len(re.findall(r"[A-Za-z]", text))
              hindi_chars = len(re.findall(r"[\u0900-\u097F]", text))

              if hindi_chars < 40:
                  return None

              if english_chars > max(8, hindi_chars // 12):
                  return None

              # Reject duplicated lines.
              normalized = [
                  re.sub(r"\s+", " ", x.lower()).strip()
                  for x in lines
              ]

              if len(set(normalized)) < len(normalized):
                  return None

              # Reject obvious repetition of the same short phrase.
              counts = {}
              for line in normalized:
                  counts[line] = counts.get(line, 0) + 1

              if max(counts.values()) > 1:
                  return None

              # Approximate spoken length.
              words = re.findall(r"[\u0900-\u097F]+", text)
              if not (45 <= len(words) <= 120):
                  return None

              return "\n".join(lines)

          def fallback():
              fallback_scripts = [
                  [
                      "बच्चा 1: भाई, मैं तुमसे ज्यादा समझदार हूँ!",
                      "बच्चा 2: अच्छा? इसका सबूत क्या है?",
                      "बच्चा 1: मैंने कल बिना पढ़े होमवर्क कर लिया।",
                      "बच्चा 2: बिना पढ़े कैसे?",
                      "बच्चा 1: मैंने सवाल ही नहीं पढ़े।",
                      "बच्चा 2: फिर होमवर्क किया क्या?",
                      "बच्चा 1: हाँ, पड़ोसी की कॉपी देखकर।",
                      "बच्चा 2: मतलब तू समझदार नहीं, पड़ोसी समझदार है!"
                  ],
                  [
                      "बच्चा 1: आज मैंने टीचर को भी चौंका दिया!",
                      "बच्चा 2: क्या किया?",
                      "बच्चा 1: मैंने पूरा होमवर्क कर दिया।",
                      "बच्चा 2: सच में?",
                      "बच्चा 1: हाँ, लेकिन एक छोटी सी समस्या है।",
                      "बच्चा 2: क्या?",
                      "बच्चा 1: होमवर्क मेरी कक्षा का नहीं है।",
                      "बच्चा 2: भाई, तूने पढ़ाई नहीं, पड़ोसी की मदद की है!"
                  ],
                  [
                      "बच्चा 1: मैं भविष्य देख सकता हूँ।",
                      "बच्चा 2: सच में? कल क्या होगा?",
                      "बच्चा 1: कल तुम मुझसे एक सवाल पूछोगे।",
                      "बच्चा 2: कौन सा सवाल?",
                      "बच्चा 1: यही सवाल।",
                      "बच्चा 2: ये तो अभी पूछ दिया!",
                      "बच्चा 1: देखा? भविष्य सही था।",
                      "बच्चा 2: नहीं भाई, सवाल तूने ही बताया था!"
                  ]
              ]
              return "\n".join(random.choice(fallback_scripts))

          final_script = None

          # First attempt.
          try:
              output = call_model()
              final_script = validate(output)
          except Exception as exc:
              print(f"First generation failed: {exc}")

          # One controlled retry.
          if final_script is None:
              retry_payload = payload.copy()
              retry_payload["messages"] = [
                  {
                      "role": "system",
                      "content": (
                          "केवल 8 से 10 बहुत छोटी हिंदी dialogue lines लिखो। "
                          "हर line क्रम से बच्चा 1 और बच्चा 2 की हो। "
                          "आखिरी line मजेदार punchline हो। "
                          "किसी line को repeat मत करो। "
                          "केवल dialogue दो।"
                      )
                  },
                  {
                      "role": "user",
                      "content": user_prompt.strip()
                  }
              ]
              payload = retry_payload

              try:
                  output = call_model()
                  final_script = validate(output)
              except Exception as exc:
                  print(f"Retry failed: {exc}")

          # Guaranteed safe fallback.
          if final_script is None:
              print("AI output did not pass quality checks.")
              print("Using built-in Hindi fallback so the pipeline remains valid.")
              final_script = fallback()

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(final_script + "\n")

          print()
          print("========================================")
          print("        FINAL HINDI SHORT SCRIPT")
          print("========================================")
          print(final_script)
          print("========================================")
          PY

          python3 /tmp/generate_short.py

      - name: Validate final script
        shell: bash
        run: |
          set -euo pipefail

          test -s script.txt

          line_count=$(grep -c '^बच्चा [12]:' script.txt || true)

          if [ "$line_count" -lt 8 ] || [ "$line_count" -gt 12 ]; then
            echo "Invalid dialogue count: $line_count"
            cat script.txt
            exit 1
          fi

          echo "Final script passed validation."

      - name: Save final script
        uses: actions/upload-artifact@v4
        with:
          name: hindi-short-script
          path: script.txt
          retention-days: 1
